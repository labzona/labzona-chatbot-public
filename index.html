
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Консультант Лабзона</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .chat {
      max-width: 480px;
      height: 600px;
      margin: 30px auto;
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #c8202e;
      color: white;
      padding: 18px;
      font-size: 18px;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }

    .message {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .bot {
      background: #f1f1f1;
    }

    .user {
      background: #fce5e7;
      margin-left: 35px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #eee;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    button {
      background: #c8202e;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="chat">
    <div class="header">
      Лабзона | Консультант
    </div>

    <div class="messages" id="messages">
      <div class="message bot">
        Вітаємо у Лабзоні!
        Допоможемо підібрати лабораторне
        обладнання. Що ви шукаєте?
      </div>
    </div>

    <form class="input-area" id="chatForm">
      <input
        id="question"
        placeholder="Наприклад: аналітичні ваги"
        autocomplete="off"
        required
      >
      <button type="submit">
        Надіслати
      </button>
    </form>
  </div>

  <script>
    const messages =
      document.getElementById("messages");

    const question =
      document.getElementById("question");

    const form =
      document.getElementById("chatForm");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = question.value.trim();
      if (!text) return;

      addMessage(text, "user");
      question.value = "";

      addMessage(
        "Дякуємо! Наступним кроком " +
        "ми підключимо каталог Лабзони, " +
        "щоб я міг рекомендувати товари.",
        "bot"
      );
    });
  </script>
</body>
</html>
