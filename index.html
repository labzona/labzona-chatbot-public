
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лабзона | Консультант</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#222}
.chat{max-width:480px;height:min(650px,95dvh);margin:20px auto;background:white;border:1px solid #ddd;border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.header{background:#c8202e;color:white;padding:18px;font-size:19px;font-weight:bold}
.messages{flex:1;overflow-y:auto;padding:16px;min-height:0}
.message{padding:12px;border-radius:11px;margin-bottom:12px;line-height:1.5;overflow-wrap:anywhere}
.bot{background:#f0f0f0}
.user{background:#fce4e6;margin-left:35px}
.product{border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:10px}
.product a{color:#c8202e;font-weight:bold}
.details{font-size:13px;color:#555;margin-top:7px;line-height:1.45}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.choice{background:white;color:#c8202e;border:1px solid #c8202e;padding:9px 11px;border-radius:8px;cursor:pointer}
.form{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}
input{flex:1;min-width:0;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:14px}
.send{background:#c8202e;color:white;border:0;border-radius:8px;padding:11px;cursor:pointer}
</style>
</head>
<body>

<div class="chat">
  <div class="header">Лабзона | Консультант</div>
  <div class="messages" id="messages"></div>
  <form class="form" id="form">
    <input id="input" placeholder="Яке обладнання шукаєте?" required>
    <button class="send" type="submit">Надіслати</button>
  </form>
</div>

<script>
const PHONE='+380505956447';
const CATALOG_URL='./catalog.json';

const messages=document.getElementById('messages');
const input=document.getElementById('input');

let products=[];
let loaded=false;
let stage='';
let context={};

const norm=s=>String(s??'').toLowerCase()
  .replace(/,/g,'.').replace(/\s+/g,' ').trim();

const title=p=>norm(p.name);
const body=p=>norm([p.name,p.description,p.details].join(' '));

function scroll(){
  messages.scrollTop=messages.scrollHeight;
}

function say(t,who='bot'){
  const d=document.createElement('div');
  d.className='message '+who;
  d.textContent=t;
  messages.append(d);
  scroll();
}

function buttons(arr){
  const d=document.createElement('div');
  d.className='actions';

  for(const label of arr){
    const b=document.createElement('button');
    b.className='choice';
    b.textContent=label;
    b.type='button';
    b.onclick=()=>handle(label);
    d.append(b);
  }

  messages.append(d);
  scroll();
}

function restart(){
  stage='';
  context={};
  say('Який прилад шукаєте?');
  buttons(['Аналітичні ваги','pH-метр','Термометр','Гігрометр']);
}

function contact(){
  const d=document.createElement('div');
  d.className='message bot';
  d.append('Телефон менеджера Лабзони: ');

  const a=document.createElement('a');
  a.href='tel:'+PHONE;
  a.textContent='+380 50 595 64 47';
  a.style.color='#c8202e';
  a.style.fontWeight='bold';

  d.append(a);
  messages.append(d);
  scroll();
}

function safe(p){
  try{
    const u=new URL(p.url);
    return u.protocol==='https:' &&
      u.hostname==='labzona.com.ua' &&
      u.pathname.startsWith('/shop/');
  }catch{
    return false;
  }
}

function price(p){
  const n=Number(
    String(p.price??'').replace(/\s/g,'').replace(',','.')
  );
  return n>0 && Number.isFinite(n)
    ? n.toLocaleString('uk-UA')+' грн'
    : 'уточніть у менеджера';
}

function desc(p){
  let s=String(p.description||'')
    .replace(/\b(?:купити|замовити)\b/gi,'')
    .replace(/(?:\+?38\s*\(?0\d{2}\)?[\s\-]*\d{3}[\s\-]*\d{2}[\s\-]*\d{2})/g,'')
    .replace(/(?:тел\.?|дзвоніть|консультація|доставка по україні|в наявності|працюємо 24\/7)[^.!?]{0,100}/gi,'')
    .replace(/\s+/g,' ')
    .trim();

  return s.length>170
    ? s.slice(0,167).replace(/\s+\S*$/,'')+'…'
    : s;
}

function show(items,note=''){
  items=items.filter(safe).slice(0,5);

  if(!items.length){
    say('Не знайшла товарів, відповідність яких можу підтвердити за каталогом. Менеджер допоможе уточнити наявність і характеристики.');
    buttons(['Новий пошук',"Зв'язатися з менеджером"]);
    return;
  }

  say('Знайдено '+items.length+' '+
    (items.length===1?'товар.':items.length<5?'товари.':'товарів.'));

  for(const p of items){
    const card=document.createElement('div');
    card.className='product';

    const a=document.createElement('a');
    a.href=p.url;
    a.target='_blank';
    a.rel='noopener noreferrer';
    a.textContent=p.name;
    card.append(a);

    const pr=document.createElement('div');
    pr.className='details';
    pr.textContent='Ціна: '+price(p);
    card.append(pr);

    const description=desc(p);
    if(description){
      const el=document.createElement('div');
      el.className='details';
      el.textContent=description;
      card.append(el);
    }

    if(note){
      const el=document.createElement('div');
      el.className='details';
      el.textContent=note;
      card.append(el);
    }

    messages.append(card);
  }

  buttons(['Новий пошук',"Зв'язатися з менеджером"]);
  scroll();
}

const isHydrometer=p=>
  /ареометр|денсиметр|нафтопродукт|ант-?\d/i.test(title(p));

const isThermometer=p=>
  /термометр|термощуп|термо-?щуп/i.test(title(p)) &&
  !isHydrometer(p);

const isFood=p=>
  isThermometer(p) &&
  (
    /харчов|haccp|хассп|насср|термометр.щуп|термощуп|для продукт/i.test(title(p)) ||
    /харчов|haccp|хассп|насср|для продукт/i.test(body(p))
  );

const isFridge=p=>
  isThermometer(p) &&
  /холодильн|морозильн/i.test(title(p));

const isPH=p=>
  /ph\s*[-/]?\s*метр|рн\s*[-/]?\s*метр|рh\s*[-/]?\s*метр/i.test(title(p));

const isScale=p=>
  /ваг|balance/i.test(title(p)) &&
  /аналітичн/i.test(title(p));

function measurements(p){
  const s=body(p);
  const caps=[];
  const steps=[];

  function push(re,into){
    for(const m of s.matchAll(re)){
      const u=m[2].toLowerCase();
      const factor=u==='мг'||u==='mg'
        ? 0.001
        : u==='кг'||u==='kg'
        ? 1000
        : 1;

      into.push(Number(m[1])*factor);
    }
  }

  push(
    /(?:нгз|нпв|максимальн[а-яіїєґ]*\s+(?:навантаженн[а-яіїєґ]*|мас[а-яіїєґ]*|зважуванн[а-яіїєґ]*)|\bmax)\s*[:=\-–,]?\s*(\d+(?:\.\d+)?)\s*(кг|kg|г|g)(?![а-яіїєґa-z])/gi,
    caps
  );

  push(
    /(?:дискретніст[а-яіїєґ]*|ціна\s+поділк[а-яіїєґ]*|readability|resolution)\s*[:=\-–,]?\s*(\d+(?:\.\d+)?)\s*(мг|mg|г|g)(?![а-яіїєґa-z])/gi,
    steps
  );

  const pair=title(p).match(
    /(\d+(?:\.\d+)?)\s*(кг|kg|г|g)\s*\/\s*(\d+(?:\.\d+)?)\s*(мг|mg|г|g)/i
  );

  if(pair){
    caps.push(
      Number(pair[1])*(/кг|kg/i.test(pair[2])?1000:1)
    );
    steps.push(
      Number(pair[3])*(/мг|mg/i.test(pair[4])?0.001:1)
    );
  }

  return {caps,steps};
}

function number(s){
  const m=norm(s).match(/\d+(?:\.\d+)?/);
  return m?Number(m[0]):null;
}

function grams(n){
  return n===null
    ? 'не вказано'
    : String(n).replace('.',',')+' г';
}

function finishScales(){
  const cap=number(context.cap);
  const step=number(context.step);

  const result=products.filter(p=>{
    if(!isScale(p))return false;

    const m=measurements(p);

    return (
      (cap===null || m.caps.some(v=>Math.abs(v-cap)<1e-8)) &&
      (step===null || m.steps.some(v=>Math.abs(v-step)<1e-8))
    );
  });

  say('Параметри: навантаження '+grams(cap)+
      ', дискретність '+grams(step)+'.');

  show(result,'Зіставлено зазначені в каталозі параметри. Перед купівлею перевірте паспорт приладу.');

  stage='';
  context={};
}

function startThermo(t){
  context.purpose=/продукт|харчов|хассп|насср/i.test(t)
    ? 'food'
    : /холодильн|морозильн/i.test(t)
    ? 'fridge'
    : null;

  if(context.purpose){
    stage='service';
    say('Чи потрібна повірка або калібрування?');
    buttons([
      'Потрібна повірка',
      'Потрібне калібрування',
      'Не потрібно',
      'Не знаю'
    ]);
  }else{
    stage='thermo';
    say('Для чого потрібен термометр?');
    buttons([
      'Для харчових продуктів',
      'Для холодильника',
      'Для лабораторії',
      'Інше / не знаю'
    ]);
  }
}

function finishThermo(){
  const purpose=context.purpose;

  const found=products.filter(p=>
    purpose==='food'
      ? isFood(p)
      : purpose==='fridge'
      ? isFridge(p)
      : isThermometer(p)
  );

  if(/повірка|калібрування/i.test(context.service||'')){
    say('Можливість '+
      (/повірка/i.test(context.service)
        ? 'повірки'
        : 'калібрування')+
      ' конкретної моделі підтвердить менеджер.');
  }

  show(found,'Перевірте діапазон вимірювання та вимоги до метрологічних документів.');

  stage='';
  context={};
}

function finishPH(t){
  const q=norm(t);
  const found=products.filter(isPH);

  let re=null;

  if(/виробництв/i.test(q)){
    re=/промислов|виробнич|стаціонарн|онлайн|in.line/i;
  }else if(/польов/i.test(q)){
    re=/портативн|ручн|кишеньков/i;
  }else if(/лаборатор/i.test(q)){
    re=/лабораторн|настільн/i;
  }

  const matched=re
    ? found.filter(p=>re.test(title(p)))
    : found;

  if(re && !matched.length){
    say('У назвах товарів не знайшла pH-метрів із підтвердженим призначенням для вашої задачі. Не буду рекомендувати лабораторний прилад як промисловий без перевірки.');
    buttons(['Новий пошук',"Зв'язатися з менеджером"]);
  }else{
    show(matched,'Призначення визначено за назвою товару; сумісність із вашими умовами потрібно перевірити.');
  }

  stage='';
  context={};
}

function search(q){
  const words=norm(q).match(/[a-zа-яіїєґ0-9]+/g)||[];

  const stop=new Set([
    'мені','треба','потрібен','потрібні','потрібна',
    'купити','хочу','для','лабораторії',
    'порадьте','знайти','прилад','обладнання'
  ]);

  const terms=words.filter(w=>w.length>2&&!stop.has(w));

  return products
    .map(p=>({
      p,
      score:terms.reduce((s,w)=>
        s+(title(p).includes(w)?5:body(p).includes(w)?1:0),0)
    }))
    .filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score)
    .slice(0,5)
    .map(x=>x.p);
}

function handle(raw){
  const t=String(raw||'').trim();
  if(!t)return;

  say(t,'user');

  if(!loaded){
    say('Каталог ще завантажується.');
    return;
  }

  if(/^(новий пошук|спочатку|скинути)$/i.test(t)){
    restart();
    return;
  }

  if(/зв.язатися з менеджером/i.test(t)){
    contact();
    return;
  }

  if(stage==='capacity'){
    context.cap=t;
    stage='precision';
    say('Яка дискретність (крок зважування) потрібна?');
    buttons(['0,0001 г','0,001 г','0,01 г','Не знаю']);
    return;
  }

  if(stage==='precision'){
    context.step=t;
    finishScales();
    return;
  }

  if(stage==='thermo'){
    context.purpose=/продукт|харчов/i.test(t)
      ? 'food'
      : /холодильн|морозильн/i.test(t)
      ? 'fridge'
      : 'other';

    stage='service';
    say('Чи потрібна повірка або калібрування?');
    buttons([
      'Потрібна повірка',
      'Потрібне калібрування',
      'Не потрібно',
      'Не знаю'
    ]);
    return;
  }

  if(stage==='service'){
    context.service=t;
    finishThermo();
    return;
  }

  if(stage==='ph'){
    finishPH(t);
    return;
  }

  if(/ваг|зважуван/i.test(t)){
    stage='capacity';
    say('Яка максимальна маса зважування потрібна?');
    buttons(['120 г','200 г','220 г','Не знаю']);
    return;
  }

  if(/(?:ph|рн|рh|pн|піаш|пиаш)\s*[- ]?\s*метр|кислотніст/i.test(t)){
    stage='ph';
    say('Для яких вимірювань потрібен pH-метр?');
    buttons([
      'Для лабораторії',
      'Для виробництва',
      'Для польових вимірювань',
      'Не знаю'
    ]);
    return;
  }

  if(/термометр|термощуп|температур/i.test(t)){
    startThermo(t);
    return;
  }

  if(/гігрометр|гигрометр/i.test(t)){
    show(products.filter(p=>
      /гігрометр|гигрометр/i.test(title(p))
    ));
    return;
  }

  show(search(t),'Попередній пошук за назвою та описом товару.');
}

document.getElementById('form').addEventListener('submit',e=>{
  e.preventDefault();
  const t=input.value.trim();
  input.value='';
  handle(t);
});

(async()=>{
  try{
    const r=await fetch(CATALOG_URL,{cache:'no-store'});
    if(!r.ok)throw Error(r.status);

    const data=await r.json();
    if(!Array.isArray(data.products)){
      throw Error('Неправильний каталог');
    }

    products=data.products.filter(safe);
    loaded=true;

    say('Вітаємо у Лабзоні! Допоможемо підібрати лабораторне обладнання. Який прилад вам потрібен?');

    buttons([
      'Аналітичні ваги',
      'pH-метр',
      'Термометр',
      'Гігрометр'
    ]);
  }catch(e){
    console.error(e);
    say('Не вдалося завантажити каталог. Спробуйте пізніше.');
  }
})();
</script>
</body>
</html>
