
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лабзона | Консультант</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#222}
.chat{max-width:480px;height:min(650px,95dvh);margin:20px auto;background:white;border:1px solid #ddd;border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.header{background:#c8202e;color:white;padding:17px;font-size:19px;font-weight:bold}
.messages{flex:1;overflow-y:auto;padding:15px}
.message{padding:12px;border-radius:11px;margin-bottom:12px;line-height:1.5;overflow-wrap:anywhere}
.bot{background:#f0f0f0}
.user{background:#fce4e6;margin-left:35px}
.product{border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:10px;background:white}
.product a{color:#c8202e;font-weight:bold;line-height:1.4}
.details{font-size:13px;color:#555;margin-top:7px;line-height:1.45}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.choice{background:white;color:#c8202e;border:1px solid #c8202e;padding:9px 11px;border-radius:8px;cursor:pointer}
.choice:hover{background:#fff1f2}
.form{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}
input{flex:1;min-width:0;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:14px}
.send{background:#c8202e;color:white;border:0;border-radius:8px;padding:11px;cursor:pointer}
</style>
</head>
<body>

<div class="chat">
<div class="header">Лабзона | Консультант</div>
<div class="messages" id="messages"></div>
<form class="form" id="form">
<input id="input" placeholder="Яке обладнання шукаєте?" required autocomplete="off">
<button class="send" type="submit">Надіслати</button>
</form>
</div>

<script>
const messages=document.getElementById("messages");
const input=document.getElementById("input");

let products=[];
let loaded=false;
let state={
  stage:null,
  capacity:null,
  precision:null,
  lastQuery:null
};

function norm(s){
  return String(s||"").toLowerCase()
    .replace(/,/g,".")
    .replace(/ё/g,"е")
    .replace(/рн(?=[-\s]?(?:метр|метрія))/g,"ph")
    .replace(/\s+/g," ").trim();
}

function scroll(){
  messages.scrollTop=messages.scrollHeight;
}

function message(text,role="bot"){
  const div=document.createElement("div");
  div.className="message "+role;
  div.textContent=text;
  messages.appendChild(div);
  scroll();
}

function choices(items){
  const box=document.createElement("div");
  box.className="actions";

  items.forEach(item=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="choice";
    btn.textContent=item;
    btn.onclick=()=>{
      box.remove();
      handle(item);
    };
    box.appendChild(btn);
  });

  messages.appendChild(box);
  scroll();
}

function reset(){
  state={
    stage:null,
    capacity:null,
    precision:null,
    lastQuery:null
  };
}

function safeLink(url){
  try{
    const u=new URL(url);
    return u.protocol==="https:" &&
      u.hostname==="labzona.com.ua" &&
      u.pathname.startsWith("/shop/");
  }catch{return false;}
}

function priceText(p){
  const raw=String(p.price||"").trim();
  const value=Number(raw);

  return raw&&Number.isFinite(value)&&value>0
    ?"Ціна: "+value.toLocaleString("uk-UA")+" грн"
    :"Ціна: уточніть у менеджера";
}

function cleanDescription(p){
  let s=String(p.description||"");

  s=s.replace(
    /(?:тел\.?|телефон|консультація)\s*[:.]?\s*\+?[\d\s()+-]{9,}/gi,
    ""
  );

  s=s.replace(
    /(?:в наявності|доставка по україні|працюємо 24\/7|безкоштовна консультація)[^.]*\.?/gi,
    ""
  );

  s=s.replace(/\s+/g," ").trim();

  return s.length>175?s.slice(0,175).trim()+"…":s;
}

function showProducts(items){
  const valid=items.filter(p=>safeLink(p.url));

  if(!valid.length){
    message(
      "Не знайшла відповідних товарів. Спробуйте уточнити назву, модель або характеристики приладу."
    );
    choices(["Новий пошук"]);
    return;
  }

  valid.forEach(p=>{
    const card=document.createElement("div");
    card.className="product";

    const link=document.createElement("a");
    link.href=p.url;
    link.target="_blank";
    link.rel="noopener noreferrer";
    link.textContent=p.name;

    const price=document.createElement("div");
    price.className="details";
    price.textContent=priceText(p);

    const desc=document.createElement("div");
    desc.className="details";
    desc.textContent=cleanDescription(p);

    card.append(link,price,desc);
    messages.appendChild(card);
  });

  choices(["Новий пошук"]);
  scroll();
}

function productText(p){
  return norm([
    p.name||"",
    p.description||"",
    p.details||""
  ].join(" "));
}

function toGrams(value,unit){
  const n=Number(String(value).replace(",","."));
  if(!Number.isFinite(n))return null;

  const u=unit.toLowerCase();

  if(u==="мг"||u==="mg")return n/1000;
  if(u==="кг"||u==="kg")return n*1000;

  return n;
}

function closeEnough(a,b){
  return Math.abs(a-b)<
    Math.max(1e-8,Math.abs(b)*1e-6);
}

function extractValues(p,kind){
  const text=productText(p);

  const labels=kind==="capacity"
    ?[
      "нгз",
      "нпв",
      "max",
      "мах",
      "максимальне навантаження",
      "максимальна маса зважування",
      "найбільша межа зважування",
      "найбільша границя зважування",
      "максимальна межа зважування"
    ]
    :[
      "дискретність",
      "ціна поділки",
      "ціна ділення",
      "крок зважування",
      "readability",
      "resolution"
    ];

  const values=[];

  for(const label of labels){
    const escaped=label.replace(
      /[.*+?^${}()|[\]\\]/g,"\\$&"
    );

    const re=new RegExp(
      escaped+
      "\\s*[:=—–-]?\\s*"+
      "(\\d+(?:[.,]\\d+)?)"+
      "\\s*(мг|кг|г|mg|kg|g)\\b",
      "gi"
    );

    for(const m of text.matchAll(re)){
      const value=toGrams(m[1],m[2]);

      if(value!==null&&value>0){
        values.push(value);
      }
    }
  }

  return [...new Set(values)];
}

function numberValue(s){
  const m=norm(s).match(/\d+(?:\.\d+)?/);
  return m?Number(m[0]):null;
}

function findScales(capacity,precision){
  return products.filter(p=>{
    if(!/ваг|balance|scale/i.test(p.name||"")){
      return false;
    }

    const capacities=extractValues(p,"capacity");
    const precisions=extractValues(p,"precision");

    if(capacity!==null &&
       !capacities.some(v=>closeEnough(v,capacity))){
      return false;
    }

    if(precision!==null &&
       !precisions.some(v=>closeEnough(v,precision))){
      return false;
    }

    return true;
  });
}

/* Пошук інших товарів */

const synonyms=[
  ["гігрометр","вологомір повітря"],
  ["термометр","вимірювач температури"],
  ["ph","рн кислотність"],
  ["ваги","вага зважування"],
  ["сито","сита просіювання"],
  ["вологомір зерна","зерновий вологомір"],
  ["ареометр","вимірювач густини"]
];

const stop=new Set([
  "мені","треба","потрібен","потрібна",
  "потрібні","потрібно","хочу","купити",
  "порадьте","знайти","підберіть","підкажіть",
  "який","яка","які","для","мене","будь",
  "ласка","прилад","обладнання","лабораторії",
  "лабораторний","лабораторна","лабораторні",
  "та","або","що","де","чи","на","по","від",
  "із","з","в","у","і","є"
]);

function tokenize(s){
  return (norm(s).match(/[a-zа-яіїєґ0-9]+/g)||[])
    .filter(w=>w.length>1&&!stop.has(w));
}

function expandQuery(query){
  let result=norm(query);

  synonyms.forEach(group=>{
    if(group.some(word=>result.includes(word))){
      result+=" "+group.join(" ");
    }
  });

  return result;
}

function genericSearch(query){
  const original=tokenize(query);
  const expanded=tokenize(expandQuery(query));
  const terms=[...new Set(expanded)];

  if(!original.length)return [];

  const results=products.map(p=>{
    const title=norm(p.name);
    const description=norm(p.description);
    const details=norm(p.details);

    let score=0;
    let originalMatches=0;

    terms.forEach(word=>{
      if(title.includes(word)){
        score+=8;
      }else if(description.includes(word)){
        score+=3;
      }else if(details.includes(word)){
        score+=1;
      }
    });

    original.forEach(word=>{
      if(title.includes(word)||
         description.includes(word)||
         details.includes(word)){
        originalMatches++;
      }
    });

    if(originalMatches===0){
      score=0;
    }else{
      score*=0.5+originalMatches/original.length;
    }

    return {p,score};
  });

  return results
    .filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score)
    .slice(0,5)
    .map(x=>x.p);
}

function categoryOf(text){
  const s=norm(text);

  if(/ваг|зважуван/.test(s))return "scales";
  if(/ph|кислотн|рн-метр/.test(s))return "ph";
  if(/термометр|температур/.test(s))return "thermo";
  if(/гігрометр|вологість повітря/.test(s))return "hygro";

  return null;
}

function startScales(){
  reset();
  state.stage="capacity";

  message(
    "Допоможу підібрати аналітичні ваги. Яка максимальна маса зважування вам потрібна?"
  );

  choices(["120 г","200 г","220 г","Інша / не знаю"]);
}

function completeScales(){
  const capacity=numberValue(state.capacity);
  const precision=numberValue(state.precision);

  if(capacity===null&&precision===null){
    message("Ось аналітичні ваги з каталогу Лабзони:");
    showProducts(genericSearch("аналітичні ваги"));
    reset();
    return;
  }

  const found=findScales(capacity,precision);

  message(
    "Шукаю ваги: навантаження — "+
    (capacity===null?"не вказано":capacity+" г")+
    ", дискретність — "+
    (precision===null?"не вказано":
      String(precision).replace(".",",")+" г")+"."
  );

  if(found.length){
    message(
      "Знайдено "+found.length+
      " моделей із розпізнаними параметрами. Перевірте конкретну модифікацію та технічну документацію перед замовленням."
    );
    showProducts(found.slice(0,10));
  }else{
    message(
      "Не знайшла моделей, у яких вдалося підтвердити ці параметри. Це не означає, що таких ваг немає в Лабзоні. Уточніть у менеджера."
    );
    choices(["Новий пошук"]);
  }

  reset();
}

function recommend(query){
  const found=genericSearch(query);

  if(found.length){
    message(
      "Знайшла "+found.length+
      " найбільш релевантних товарів у каталозі Лабзони. Це попередній підбір за текстом, тому перевірте характеристики в картці товару."
    );
    showProducts(found);
  }else{
    message(
      "Не знайшла товарів за цим запитом. Спробуйте вказати модель, назву або основну характеристику."
    );
    choices(["Новий пошук"]);
  }
}

function handle(text){
  text=String(text||"").trim();
  if(!text)return;

  message(text,"user");

  if(!loaded){
    message("Каталог ще завантажується. Спробуйте пізніше.");
    return;
  }

  if(/^(новий пошук|спочатку|скинути)$/i.test(text)){
    reset();
    message("Що шукаємо цього разу?");
    choices([
      "Аналітичні ваги",
      "pH-метр",
      "Термометр",
      "Гігрометр"
    ]);
    return;
  }

  if(state.stage==="capacity"){
    state.capacity=text;
    state.stage="precision";

    message("Яка дискретність (крок зважування) потрібна?");
    choices([
      "0,0001 г",
      "0,001 г",
      "0,01 г",
      "Не знаю"
    ]);
    return;
  }

  if(state.stage==="precision"){
    state.precision=text;
    completeScales();
    return;
  }

  const category=categoryOf(text);

  if(category==="scales"){
    const capMatch=norm(text).match(
      /(\d+(?:\.\d+)?)\s*(кг|г)\b/
    );

    const precisionMatch=norm(text).match(
      /(?:дискретніст\w*|точніст\w*|крок)\s*[:=—–-]?\s*(\d+(?:\.\d+)?)\s*(мг|г)\b/
    );

    if(capMatch&&precisionMatch){
      const cap=toGrams(capMatch[1],capMatch[2]);
      const prec=toGrams(
        precisionMatch[1],
        precisionMatch[2]
      );

      const found=findScales(cap,prec);

      if(found.length){
        message(
          "Знайшла моделі за вказаними характеристиками:"
        );
        showProducts(found.slice(0,10));
      }else{
        message(
          "Не знайшла підтверджених збігів. Спробуйте уточнити параметри."
        );
        choices(["Новий пошук"]);
      }
      return;
    }

    startScales();
    return;
  }

  recommend(text);
}

document.getElementById("form").addEventListener(
  "submit",e=>{
    e.preventDefault();
    const text=input.value.trim();
    input.value="";
    handle(text);
  }
);

async function load(){
  try{
    const response=await fetch("./catalog.json",{
      cache:"no-cache"
    });

    if(!response.ok){
      throw new Error("HTTP "+response.status);
    }

    const data=await response.json();

    if(!Array.isArray(data.products)){
      throw new Error("Невірний формат каталогу");
    }

    products=data.products;
    loaded=true;

    message(
      "Вітаємо у Лабзоні! Допоможемо знайти лабораторне обладнання. Який прилад вам потрібен?"
    );

    choices([
      "Аналітичні ваги",
      "pH-метр",
      "Термометр",
      "Гігрометр"
    ]);

  }catch(error){
    console.error(error);
    message(
      "Каталог тимчасово недоступний. Спробуйте пізніше або зверніться до менеджера Лабзони."
    );
  }
}

load();
</script>
</body>
</html>
