
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лабзона | Консультант з лабораторного обладнання</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px;
  background: #f4f6f8;
  font-family: Arial, sans-serif;
  color: #242424;
}

.chat {
  width: 100%;
  max-width: 520px;
  height: min(700px, 95dvh);
  margin: 0 auto;
  background: white;
  border: 1px solid #ddd;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header {
  padding: 17px 20px;
  background: #c91d2c;
  color: white;
}

.header strong {
  display: block;
  font-size: 20px;
}

.header small {
  display: block;
  margin-top: 5px;
  font-size: 12px;
}

.messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 16px;
}

.message {
  max-width: 94%;
  padding: 12px 14px;
  margin-bottom: 12px;
  border-radius: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-line;
}

.bot {
  background: #f0f0f0;
}

.user {
  background: #fbe4e7;
  margin-left: auto;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 14px;
}

.choice {
  border: 1px solid #c91d2c;
  border-radius: 9px;
  background: white;
  color: #c91d2c;
  padding: 9px 12px;
  cursor: pointer;
  font-size: 13px;
}

.choice:hover {
  background: #fff0f2;
}

.product {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 13px;
  margin-bottom: 12px;
}

.product a {
  color: #c91d2c;
  font-size: 15px;
  font-weight: bold;
  line-height: 1.4;
}

.price {
  margin-top: 9px;
  font-weight: bold;
}

.detail {
  margin-top: 8px;
  font-size: 13px;
  line-height: 1.5;
  color: #555;
}

.match {
  margin-top: 9px;
  font-size: 13px;
  line-height: 1.5;
}

.match strong {
  color: #237247;
}

.notice {
  font-size: 12px;
  color: #777;
  margin-top: 8px;
}

.form {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid #eee;
  background: white;
}

.form input {
  flex: 1;
  min-width: 0;
  padding: 11px;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 14px;
}

.send {
  padding: 11px 13px;
  border: none;
  border-radius: 9px;
  background: #c91d2c;
  color: white;
  cursor: pointer;
}

@media (max-width: 420px) {
  body { padding: 0; }

  .chat {
    height: 100dvh;
    border-radius: 0;
  }

  .header strong { font-size: 18px; }

  .choice { font-size: 12px; }
}
</style>
</head>

<body>

<div class="chat">
  <div class="header">
    <strong>Лабзона | Консультант</strong>
    <small>Підбір обладнання з каталогу Лабзони</small>
  </div>

  <div class="messages" id="messages"></div>

  <form class="form" id="form">
    <input
      id="input"
      placeholder="Яке обладнання шукаєте?"
      autocomplete="off"
      required
    >
    <button class="send" type="submit">
      Надіслати
    </button>
  </form>
</div>

<script>
"use strict";

const CATALOG_URL = "./catalog.json";
const MANAGER_URL = "https://labzona.com.ua/";

const messages = document.getElementById("messages");
const input = document.getElementById("input");

let products = [];
let loaded = false;

let state = {
  category: null,
  material: null,
  purpose: null,
  capacity: null,
  readability: null,
  budget: null,
  pending: null,
  stage: null
};

function normalize(value) {
  return String(value ?? "")
    .toLowerCase()
    .replace(/[’ʼ`]/g, "'")
    .replace(/,/g, ".")
    .replace(/\s+/g, " ")
    .trim();
}

function resetState() {
  state = {
    category: null,
    material: null,
    purpose: null,
    capacity: null,
    readability: null,
    budget: null,
    pending: null,
    stage: null
  };
}

function addMessage(text, role = "bot") {
  const el = document.createElement("div");
  el.className = "message " + role;
  el.textContent = text;
  messages.appendChild(el);
  scrollDown();
}

function scrollDown() {
  messages.scrollTop = messages.scrollHeight;
}

function addChoices(items) {
  const box = document.createElement("div");
  box.className = "actions";

  for (const item of items) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "choice";
    button.textContent = item;

    button.addEventListener("click", () => {
      box.remove();
      handle(item);
    });

    box.appendChild(button);
  }

  messages.appendChild(box);
  scrollDown();
}

function safeUrl(value) {
  try {
    const url = new URL(String(value || ""));

    return (
      url.protocol === "https:" &&
      url.hostname === "labzona.com.ua" &&
      url.pathname.startsWith("/shop/")
    );
  } catch {
    return false;
  }
}

function productText(product) {
  return normalize([
    product.name,
    product.description,
    product.details
  ].join(" "));
}

function parsePrice(value) {
  if (typeof value === "number") {
    return Number.isFinite(value) && value > 0
      ? value
      : null;
  }

  const raw = String(value ?? "")
    .replace(/\s/g, "")
    .replace(/грн|uah/gi, "")
    .replace(",", ".");

  const number = Number(raw);

  return Number.isFinite(number) && number > 0
    ? number
    : null;
}

function priceLabel(product) {
  const price = parsePrice(product.price);

  return price === null
    ? "Ціна: уточніть у менеджера"
    : "Ціна: " +
      price.toLocaleString("uk-UA") +
      " грн";
}

function getCategory(query) {
  const text = normalize(query);

  if (/волого(мір|мер)|вимірювач вологості/.test(text)) {
    return "moisture";
  }

  if (/гігрометр|гигрометр|віт[- ]?[12]/.test(text)) {
    return "hygrometer";
  }

  if (/ph[- ]?метр|рн[- ]?метр|pн[- ]?метр|кислотност/.test(text)) {
    return "ph";
  }

  if (/термометр|температурн.*датчик/.test(text)) {
    return "thermometer";
  }

  if (/ваг[иа]|зважуван|терез/.test(text)) {
    return "scales";
  }

  return null;
}

function getMaterial(query) {
  const text = normalize(query);

  if (/зерн|пшениц|ячмен|кукурудз|ріпак/.test(text)) {
    return "grain";
  }

  if (/ґрунт|грунт|soil|земл|теплиц/.test(text)) {
    return "soil";
  }

  if (/сін|сено|солом/.test(text)) {
    return "hay";
  }

  return null;
}

function getPurpose(query) {
  const text = normalize(query);

  if (/холодильник|морозильник|холодильн/.test(text)) {
    return "fridge";
  }

  if (/харчов|продукт|haccp|хассп|насср/.test(text)) {
    return "food";
  }

  if (/вод[аиу]|розчин|рідина|жидкост/.test(text)) {
    return "water";
  }

  if (/лаборатор/.test(text)) {
    return "laboratory";
  }

  if (/виробництв/.test(text)) {
    return "production";
  }

  return null;
}

function getBudget(query) {
  const text = normalize(query);

  if (/без обмежень|будь-як.*бюджет|неважлив.*цін/.test(text)) {
    return Infinity;
  }

  const match = text.match(
    /(?:до|не більше|бюджет|максимум|ціна)\s*[:\-]?\s*(\d[\d\s]*)\s*(тис(?:яч)?|к|грн|uah)?/
  );

  if (!match) return null;

  let amount = Number(match[1].replace(/\s/g, ""));

  if (/^(тис|к)/.test(match[2] || "")) {
    amount *= 1000;
  }

  return amount > 0 ? amount : null;
}

function getCapacity(query) {
  const text = normalize(query);

  const match = text.match(
    /(\d+(?:\.\d+)?)\s*(кг|г|kg|g)(?=\s|$|[,;\/])/
  );

  if (!match) return null;

  const amount = Number(match[1]);

  return /кг|kg/.test(match[2])
    ? amount * 1000
    : amount;
}

function getReadability(query) {
  const text = normalize(query);

  const match = text.match(
    /(?:дискретніст[ья]|крок зважування|ціна поділки|readability|точніст[ью]?|\/)\s*[:=\-]?\s*(\d+(?:\.\d+)?)\s*(мг|г|mg|g)(?=\s|$|[,;\/])/
  );

  if (!match) return null;

  const amount = Number(match[1]);

  return /мг|mg/.test(match[2])
    ? amount / 1000
    : amount;
}

function extractSpecifications(product) {
  const text = productText(product);
  const capacities = [];
  const readability = [];

  const capacityPatterns = [
    /(?:нгз|нпв|max|максимальне навантаження|найбільша границя зважування)\s*[:=\-]?\s*(\d+(?:\.\d+)?)\s*(кг|г|kg|g)(?=\s|$|[,;\/])/g,
    /(\d+(?:\.\d+)?)\s*(кг|г|kg|g)\s*\/\s*(\d+(?:\.\d+)?)\s*(мг|г|mg|g)(?=\s|$|[,;\/])/g
  ];

  for (const pattern of capacityPatterns) {
    for (const match of text.matchAll(pattern)) {
      const amount = Number(match[1]);
      const unit = match[2];

      capacities.push(
        /кг|kg/.test(unit) ? amount * 1000 : amount
      );
    }
  }

  const readabilityPatterns = [
    /(?:дискретність|ціна поділки|readability|крок зважування)\s*[:=\-]?\s*(\d+(?:\.\d+)?)\s*(мг|г|mg|g)(?=\s|$|[,;\/])/g,
    /(\d+(?:\.\d+)?)\s*(кг|г|kg|g)\s*\/\s*(\d+(?:\.\d+)?)\s*(мг|г|mg|g)(?=\s|$|[,;\/])/g
  ];

  for (const pattern of readabilityPatterns) {
    for (const match of text.matchAll(pattern)) {
      let amount;
      let unit;

      if (match.length >= 5) {
        amount = Number(match[3]);
        unit = match[4];
      } else {
        amount = Number(match[1]);
        unit = match[2];
      }

      readability.push(
        /мг|mg/.test(unit) ? amount / 1000 : amount
      );
    }
  }

  // Support compact specifications in product titles,
  // such as "220 г, 0,0001 г".
  const compact = text.match(
    /(\d+(?:\.\d+)?)\s*г\s*[,;/]\s*(0\.\d+)\s*г(?=\s|$|[,;\/])/
  );

  if (compact) {
    capacities.push(Number(compact[1]));
    readability.push(Number(compact[2]));
  }

  return {
    capacities: [...new Set(capacities)],
    readability: [...new Set(readability)]
  };
}

function sameNumber(a, b) {
  return Math.abs(a - b) <
    Math.max(0.00000001, Math.abs(b) * 0.000001);
}

function isEquipment(product, category) {
  const name = normalize(product.name);

  if (category === "scales") {
    return (
      /ваг|balance|scale/.test(name) &&
      !/чашк|гир[яі]|аксесуар|платформ|кабел|блок живлення/.test(name)
    );
  }

  if (category === "ph") {
    return (
      /ph[- ]?метр|рн[- ]?метр|кислотномір/.test(name) &&
      !/розчин|буфер|електрод|калібрувальн|реактив|тест-смуж/.test(name)
    );
  }

  if (category === "thermometer") {
    return (
      /термометр/.test(name) &&
      !/чохол|футляр|зонд окремо|кабел/.test(name)
    );
  }

  if (category === "hygrometer") {
    return (
      /гігрометр|гигрометр/.test(name) &&
      !/запчастин|чохол|футляр/.test(name)
    );
  }

  if (category === "moisture") {
    return (
      /вологомір|влагомер/.test(name) &&
      !/чашк|аксесуар|контейнер|калібрувальн|запчастин/.test(name)
    );
  }

  return true;
}

function materialMatches(product, material) {
  if (!material) return true;

  const name = normalize(product.name);
  const text = productText(product);

  if (material === "grain") {
    return /зерн|пшениц|ячмен|кукурудз|ріпак/.test(name);
  }

  if (material === "soil") {
    return /ґрунт|грунт|soil/.test(name);
  }

  if (material === "hay") {
    return /сін|сено|солом/.test(name) ||
      /сін|сено|солом/.test(text);
  }

  return true;
}

function purposeScore(product, purpose) {
  if (!purpose) return 0;

  const text = productText(product);

  const patterns = {
    fridge: /холодильник|морозильник|холодильн/,
    food: /харчов|продукт|haccp|хассп|насср/,
    water: /вод[аиу]|розчин|рідина/,
    laboratory: /лаборатор/,
    production: /виробництв/
  };

  return patterns[purpose]?.test(text) ? 10 : 0;
}

function evaluateProduct(product) {
  if (!safeUrl(product.url)) return null;

  if (state.category &&
      !isEquipment(product, state.category)) {
    return null;
  }

  if (state.category === "moisture" &&
      !materialMatches(product, state.material)) {
    return null;
  }

  const price = parsePrice(product.price);

  if (
    state.budget !== null &&
    state.budget !== Infinity &&
    price !== null &&
    price > state.budget
  ) {
    return null;
  }

  const specs = extractSpecifications(product);
  const confirmed = [];
  const unknown = [];

  if (state.category === "scales") {
    if (state.capacity !== null) {
      if (specs.capacities.length) {
        if (!specs.capacities.some(
          value => sameNumber(value, state.capacity)
        )) {
          return null;
        }

        confirmed.push(
          "навантаження " + state.capacity + " г"
        );
      } else {
        unknown.push("максимальне навантаження");
      }
    }

    if (state.readability !== null) {
      if (specs.readability.length) {
        if (!specs.readability.some(
          value => sameNumber(value, state.readability)
        )) {
          return null;
        }

        confirmed.push(
          "дискретність " +
          String(state.readability).replace(".", ",") +
          " г"
        );
      } else {
        unknown.push("дискретність");
      }
    }
  }

  if (
    state.budget !== null &&
    state.budget !== Infinity &&
    price === null
  ) {
    unknown.push("ціну");
  }

  let score = 0;

  score += confirmed.length * 30;
  score += purposeScore(product, state.purpose);

  if (price !== null) score += 3;

  if (unknown.length === 0) score += 20;

  return {
    product,
    price,
    confirmed,
    unknown,
    score
  };
}

function cleanDescription(product) {
  let text = String(product.description || "")
    .replace(/(?:\+?38)?[\s(.-]*0\d[\d\s().-]{7,}/g, "")
    .replace(/працюємо\s*24\s*\/\s*7/gi, "")
    .replace(/доставка по україні/gi, "")
    .replace(/в наявності/gi, "")
    .replace(/\s+/g, " ")
    .trim();

  if (text.length > 180) {
    text = text.slice(0, 180).replace(/\s+\S*$/, "") + "…";
  }

  return text;
}

function showCard(result) {
  const { product, confirmed, unknown } = result;

  const card = document.createElement("div");
  card.className = "product";

  const link = document.createElement("a");
  link.href = product.url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = product.name;

  const price = document.createElement("div");
  price.className = "price";
  price.textContent = priceLabel(product);

  card.append(link, price);

  const description = cleanDescription(product);

  if (description) {
    const desc = document.createElement("div");
    desc.className = "detail";
    desc.textContent = description;
    card.appendChild(desc);
  }

  if (confirmed.length) {
    const match = document.createElement("div");
    match.className = "match";

    const strong = document.createElement("strong");
    strong.textContent = "Підтверджено: ";

    match.appendChild(strong);
    match.appendChild(
      document.createTextNode(confirmed.join(", ") + ".")
    );

    card.appendChild(match);
  }

  if (unknown.length) {
    const notice = document.createElement("div");
    notice.className = "notice";

    notice.textContent =
      "Потрібно уточнити: " +
      unknown.join(", ") + ".";

    card.appendChild(notice);
  }

  messages.appendChild(card);
}

function showRecommendations() {
  const results = products
    .map(evaluateProduct)
    .filter(Boolean)
    .sort((a, b) => b.score - a.score);

  const confirmed = results.filter(
    item => item.unknown.length === 0
  );

  const uncertain = results.filter(
    item => item.unknown.length > 0
  );

  if (!results.length) {
    addMessage(
      "За заданими параметрами не знайшла відповідних товарів у каталозі. Можемо змінити умови або уточнити наявність у менеджера."
    );

    addChoices([
      "Новий пошук",
      "Зв'язатися з менеджером"
    ]);

    return;
  }

  if (confirmed.length) {
    addMessage(
      "Знайдено " +
      confirmed.length +
      " товарів, які відповідають доступним даним каталогу."
    );

    confirmed.slice(0, 5).forEach(showCard);
  }

  if (uncertain.length) {
    addMessage(
      confirmed.length
        ? "Також є моделі, для яких потрібно уточнити окремі характеристики:"
        : "Є потенційно відповідні моделі, але частину параметрів потрібно уточнити:"
    );

    uncertain.slice(0, 3).forEach(showCard);
  }

  addChoices([
    "Новий пошук",
    "Зв'язатися з менеджером"
  ]);

  scrollDown();
}

function askBudget() {
  state.stage = "budget";

  addMessage(
    "Який орієнтовний бюджет? Можна написати суму, наприклад «до 15000 грн»."
  );

  addChoices([
    "До 1000 грн",
    "До 5000 грн",
    "До 10000 грн",
    "До 15000 грн",
    "Без обмежень"
  ]);
}

function askPurpose() {
  state.stage = "purpose";

  addMessage(
    "Для яких умов або завдань потрібен прилад?"
  );

  addChoices([
    "Для лабораторії",
    "Для виробництва",
    "Для господарства",
    "Не знаю"
  ]);
}

function askMoistureMaterial() {
  state.stage = "material";

  addMessage("Вологість якого матеріалу потрібно вимірювати?");

  addChoices([
    "Зерно",
    "Ґрунт",
    "Сіно або солома",
    "Інші матеріали"
  ]);
}

function askCapacity() {
  state.stage = "capacity";

  addMessage(
    "Яке максимальне навантаження ваг потрібне?"
  );

  addChoices([
    "120 г",
    "200 г",
    "220 г",
    "Не знаю"
  ]);
}

function askReadability() {
  state.stage = "readability";

  addMessage(
    "Яка дискретність (крок зважування) потрібна?"
  );

  addChoices([
    "0,0001 г",
    "0,001 г",
    "0,01 г",
    "Не знаю"
  ]);
}

function continueConsultation() {
  if (
    state.category === "moisture" &&
    !state.material
  ) {
    askMoistureMaterial();
    return;
  }

  if (state.category === "scales") {
    if (state.capacity === null &&
        state.stage !== "capacity_done") {
      askCapacity();
      return;
    }

    if (state.readability === null &&
        state.stage !== "readability_done") {
      askReadability();
      return;
    }
  }

  if (
    state.category === "ph" &&
    !state.purpose &&
    state.stage !== "purpose_done"
  ) {
    askPurpose();
    return;
  }

  if (state.budget === null) {
    askBudget();
    return;
  }

  state.stage = "results";
  showRecommendations();
}

function applyInitialQuery(text) {
  resetState();

  state.category = getCategory(text);
  state.material = getMaterial(text);
  state.purpose = getPurpose(text);
  state.budget = getBudget(text);

  if (state.category === "scales") {
    state.capacity = getCapacity(text);
    state.readability = getReadability(text);
  }

  if (!state.category) {
    addMessage(
      "Уточніть, будь ласка, який саме прилад потрібен. Можна обрати категорію або написати назву."
    );

    addChoices([
      "Аналітичні ваги",
      "pH-метр",
      "Термометр",
      "Гігрометр",
      "Вологомір"
    ]);

    return;
  }

  // When all relevant specifications are already present,
  // do not ask for them again.
  if (
    state.category === "scales" &&
    state.capacity !== null &&
    state.readability !== null
  ) {
    if (state.budget === null) {
      addMessage(
        "Знайшла параметри: " +
        state.capacity +
        " г, дискретність " +
        String(state.readability).replace(".", ",") +
        " г. Покажу відповідні моделі без обмеження бюджету."
      );

      state.budget = Infinity;
    }

    showRecommendations();
    state.stage = "results";
    return;
  }

  continueConsultation();
}

function handle(text) {
  const value = String(text || "").trim();

  if (!value) return;

  addMessage(value, "user");

  if (!loaded) {
    addMessage("Каталог ще завантажується.");
    return;
  }

  if (/^новий пошук$/i.test(value)) {
    resetState();

    addMessage("Яке обладнання шукаєте?");

    addChoices([
      "Аналітичні ваги",
      "pH-метр",
      "Термометр",
      "Гігрометр",
      "Вологомір"
    ]);

    return;
  }

  if (/^зв'язатися з менеджером$/i.test(value)) {
    addMessage(
      "Для консультації з менеджером Лабзони телефонуйте: 050 595 64 47. Також можна перейти на сайт Лабзони."
    );

    const box = document.createElement("div");
    box.className = "actions";

    const link = document.createElement("a");
    link.className = "choice";
    link.href = MANAGER_URL;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "Перейти на сайт Лабзони";

    box.appendChild(link);
    messages.appendChild(box);
    scrollDown();
    return;
  }

  if (state.stage === "material") {
    state.material = getMaterial(value);

    if (!state.material) {
      state.material = "other";
    }

    continueConsultation();
    return;
  }

  if (state.stage === "capacity") {
    state.capacity = getCapacity(value);
    state.stage = "capacity_done";
    continueConsultation();
    return;
  }

  if (state.stage === "readability") {
    state.readability = getCapacity(value);

    if (/мг/i.test(value) &&
        state.readability !== null) {
      state.readability /= 1000;
    }

    state.stage = "readability_done";
    continueConsultation();
    return;
  }

  if (state.stage === "purpose") {
    state.purpose = getPurpose(value) || "unknown";
    state.stage = "purpose_done";
    continueConsultation();
    return;
  }

  if (state.stage === "budget") {
    const budget = getBudget(value);

    if (budget === null) {
      addMessage(
        "Не вдалося визначити бюджет. Напишіть, наприклад, «до 15000 грн» або оберіть «Без обмежень»."
      );

      askBudget();
      return;
    }

    state.budget = budget;
    state.stage = "results";
    showRecommendations();
    return;
  }

  applyInitialQuery(value);
}

document.getElementById("form").addEventListener(
  "submit",
  event => {
    event.preventDefault();

    const text = input.value.trim();
    input.value = "";

    handle(text);
  }
);

async function loadCatalog() {
  try {
    const response = await fetch(
      CATALOG_URL,
      { cache: "no-cache" }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (!Array.isArray(data.products)) {
      throw new Error("Неправильний формат каталогу");
    }

    products = data.products.filter(
      item => item &&
        typeof item.name === "string" &&
        safeUrl(item.url)
    );

    loaded = true;

    addMessage(
      "Вітаємо у Лабзоні! Допоможемо підібрати лабораторне обладнання. Який прилад вам потрібен?"
    );

    addChoices([
      "Аналітичні ваги",
      "pH-метр",
      "Термометр",
      "Гігрометр",
      "Вологомір"
    ]);

  } catch (error) {
    console.error(error);

    addMessage(
      "Не вдалося завантажити каталог. Спробуйте оновити сторінку пізніше."
    );
  }
}

loadCatalog();
</script>
