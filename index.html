function norm(v){
 return String(v??"")
  .toLowerCase()
  .replace(/[’ʼ`]/g,"'")
  .replace(/,/g,".")
  .replace(/\s+/g," ")
  .trim();
}

function message(text,role="bot"){
 const el=document.createElement("div");
 el.className="message "+role;
 el.textContent=text;
 messages.appendChild(el);
 messages.scrollTop=messages.scrollHeight;
 return el;
}

}

function validUrl(value){
 try{
  const u=new URL(value);
  return u.protocol==="https:" &&
   u.hostname==="labzona.com.ua" &&
   u.pathname.startsWith("/shop/");
 }catch{
  return false;
 }
}

function priceNumber(value){
 if(typeof value==="number"){
  return Number.isFinite(value)&&value>0?value:null;
 }

 const n=Number(
  String(value??"")
   .replace(/\s/g,"")
   .replace(/грн|uah/gi,"")
   .replace(",",".")
 );

 return Number.isFinite(n)&&n>0?n:null;
}

function priceText(value){
 const n=priceNumber(value);
 return n===null
  ?"Ціну уточнюйте у менеджера"
  :n.toLocaleString("uk-UA")+" грн";
}

/*

 },
 {

 {

  exclude:/пробірк|пчп|числ[ао] падін|числ[ао] паден|запчастин|комплектуюч|аксесуар|окремий ротор|бан[яі]|термостат/i
 }
];

const MATERIAL={
 grain:/зерн|пшениц|кукурудз|ячмен|ріпак/i,
 soil:/ґрунт|грунт/i,
 wood:/деревин|дерев'ян|дерев/i
};

function categoryOf(query){
 const q=norm(query);

 if(
  /кислотн|кислотност/.test(q) &&
  /вод|рідин|розчин|раствор/.test(q)
 ){
  return CATEGORIES.find(c=>c.id==="ph");
 }

 return CATEGORIES.find(c=>c.q.test(q))||null;
}

function materialOf(query){
 const q=norm(query);
 return Object.keys(MATERIAL)
  .find(k=>MATERIAL[k].test(q))||null;
}

/*
 Read customer application.
 Never infer confirmed technical compatibility
 from the name of the category alone.
*/
function applicationOf(query){
 const q=norm(query);

 if(/фарб|лакофарб|лакокрас|емал|покритт|paint|coating/.test(q)){
  return "paint";
 }

 if(/зерн|пшениц|кукурудз|ячмен|ріпак/.test(q)){
  return "grain";
 }

 if(/холодильн|морозильн/.test(q)){
  return "cold";
 }

 if(/вод|рідин|розчин/.test(q)){
  return "liquid";
 }

 return null;
}

/*
 Main instrument vs accessory/support equipment.
 Specific category rules are safer than broad
 bans on product names.
*/
function productKind(product,category){
 const name=norm(product.name);

 if(category?.id==="viscometer"){
  if(/пробірк|пчп|запчастин|ротор окрем/.test(name))
   return "accessory";

  if(/бан[яі]|термостат|водян.*бан/.test(name))
   return "support";

  if(/віскозиметр|вискозиметр/.test(name))
   return "instrument";
 }

 if(category?.id==="ph" ||
    category?.id==="conductivity"){
  if(/електрод|буфер|калібрувальн.*розчин|датчик окрем/.test(name))
   return "accessory";
 }

 if(category?.id==="scales"){
  if(/гир[яі]|чашк|блок живлення|адаптер|кабел/.test(name))
   return "accessory";
 }

 if(category?.id==="moisture"){
  if(/чашк|контейнер|запчастин/.test(name))
   return "accessory";
 }

 return "instrument";
}

function applicationEvidence(product,category,application){
 const name=norm(product.name);
 const body=norm([product.description,product.details].join(" "));
 const text=name+" "+body;

 if(!application)return "not_requested";

 if(category.id==="viscometer"&&application==="paint"){
  if(/лакофарб|лакокрас|фарб|емал|paint|coating/.test(text)){
   return "confirmed";
  }
  return "unconfirmed";
 }

 if(category.id==="moisture"&&application==="grain"){
  return /зерн|насін|пшениц|кукурудз|ячмен|ріпак/.test(text)
   ?"confirmed":"unconfirmed";
 }

 if(category.id==="thermometer"&&application==="cold"){
  return /холодильн|морозильн/.test(text)
   ?"confirmed":"unconfirmed";
 }

 return "not_requested";
}

function budgetOf(query){
 const s=norm(query);

 if(/без обмежень|будь.як.*цін/.test(s)){
  return Infinity;
 }

 const m=s.match(
  /(?:до|бюджет|не дорожче|не більше|максимум|ціна)\s*[:-]?\s*(\d[\d\s.]*)\s*(тис|тисяч|к|грн)?/
 );

 if(!m)return null;

 let n=Number(m[1].replace(/\s/g,""));

 if(/^(тис|к)/.test(m[2]||"")){
  n*=1000;
 }

 return Number.isFinite(n)&&n>0?n:null;
}

function toGrams(number,unit){
 const n=Number(String(number).replace(",","."));

 if(!Number.isFinite(n)||n<=0)return null;
 if(/^(кг|kg)$/i.test(unit))return n*1000;
 if(/^(мг|mg)$/i.test(unit))return n/1000;
 return n;
}

function same(a,b){
 return a!==null&&b!==null&&
  Math.abs(a-b)<Math.max(1e-8,Math.abs(b)*1e-6);
}

const READABILITY_PATTERN=
 /(?:дискретн[а-яіїєґ]*|крок зважування|ціна поділки|readability)\s*[:=–—-]?\s*(\d+(?:\.\d+)?)\s*(мг|mg|кг|kg|г|g)(?=\s|$|[.,;])/i;

const CAPACITY_PATTERN=
 /(?:нпв|нгз|мах|max|найбільша межа зважування|максимальна межа зважування|межа зважування|навантаження)\s*[:=–—-]?\s*(\d+(?:\.\d+)?)\s*(кг|kg|г|g)(?=\s|$|[.,;])/i;

const PAIR_PATTERN=
 /(\d+(?:\.\d+)?)\s*(кг|kg|г|g)\s*\/\s*(\d+(?:\.\d+)?)\s*(мг|mg|г|g)(?=\s|$|[.,;])/i;

function queryScaleSpecs(query){
 const s=norm(query);
 let capacity=null;
 let readability=null;

 const step=s.match(READABILITY_PATTERN);
 if(step)readability=toGrams(step[1],step[2]);

 const cap=s.match(CAPACITY_PATTERN);
 if(cap)capacity=toGrams(cap[1],cap[2]);

 const pair=s.match(PAIR_PATTERN);

 if(pair){
  capacity=toGrams(pair[1],pair[2]);
  readability=toGrams(pair[3],pair[4]);
 }

 if(capacity===null){
  const matches=[...s.matchAll(
   /(\d+(?:\.\d+)?)\s*(кг|kg|г|g)(?=\s|$|[.,;/])/gi
  )];

  const found=matches.find(m=>{
   const grams=toGrams(m[1],m[2]);

   if(grams===null||grams<1)return false;

   const before=s.slice(Math.max(0,m.index-35),m.index);

   if(/(?:дискретн[а-яіїєґ]*|похиб[а-яіїєґ]*|погреш[а-я]*)\s*$/.test(before))
    return false;

   return true;
  });

  if(found)capacity=toGrams(found[1],found[2]);
 }

 return {capacity,readability};
}

function catalogScaleSpecs(product){
 const title=norm(product.name);
 const details=norm([
  product.description,
  product.details
 ].join(" "));

 let capacity=null;
 let readability=null;
 let ambiguous=false;

 const pair=title.match(PAIR_PATTERN);

 if(pair){
  capacity=toGrams(pair[1],pair[2]);
  readability=toGrams(pair[3],pair[4]);
 }else{
  const tc=title.match(CAPACITY_PATTERN);
  const td=title.match(READABILITY_PATTERN);
  const dc=details.match(CAPACITY_PATTERN);
  const dd=details.match(READABILITY_PATTERN);

  if(tc)capacity=toGrams(tc[1],tc[2]);
  else if(dc)capacity=toGrams(dc[1],dc[2]);

  if(td)readability=toGrams(td[1],td[2]);
  else if(dd)readability=toGrams(dd[1],dd[2]);
 }

 if(
  /серія містить|залежно від моделі|залежно від модифікації|кілька модифікацій/i.test(details)||
  /(?:\d+\s*\/\s*\d+)\s*(?:г|kg|кг)/i.test(title)
 ){
  ambiguous=true;
 }

 return {capacity,readability,ambiguous};
}

function scaleErrorQuery(q){
 return categoryOf(q)?.id==="scales" &&
  /похиб|погреш|accuracy/i.test(q);
}

function dimensions(q){
 const s=norm(q);
 const out={};

 let m=s.match(
  /(?:об'єм|місткість|объем)\s*[:=–—-]?\s*(\d+(?:\.\d+)?)\s*(мл|л)/u
 );

 if(m){
  out.volume=Number(m[1])*(m[2]==="л"?1000:1);
 }

 m=s.match(
  /(?:діаметр|діам|ø|⌀)\s*[:=–—-]?\s*(\d+(?:\.\d+)?)\s*(мм|см)/u
 );

 if(m){
  out.diameter=Number(m[1])*(m[2]==="см"?10:1);
 }

 m=s.match(
  /(?:отвор(?:и|ів|у)?|комірк(?:и|а)?|ячейк(?:а|и)?)\s*[:=–—-]?\s*(\d+(?:\.\d+)?)\s*(мм|мкм)/u
 );

 if(m){
  out.aperture=Number(m[1])*(m[2]==="мкм"?.001:1);
 }

 return out;
}

function newState(query,aiData=null){
 let category=categoryOf(query);

 if(!category&&aiData){
  const combined=[
   aiData.normalized_query,
   aiData.category,
   ...(Array.isArray(aiData.keywords)?aiData.keywords:[])
  ]
   .filter(x=>typeof x==="string")
   .join(" ");

  category=categoryOf(combined);
 }

 return {
  query,
  category,
  application:applicationOf(query),
  specs:category?.id==="scales"
   ?queryScaleSpecs(query)
   :{capacity:null,readability:null},
  material:materialOf(query),
  budget:budgetOf(query),
  dims:dimensions(query),
  waitBudget:false
 };
}

function scoreProduct(p,s){
 if(!validUrl(p.url)||!s.category)return null;

 const name=norm(p.name);
 const body=norm([
  p.description,
  p.details
 ].join(" "));

 if(!s.category.name.test(name))return null;
 if(s.category.exclude?.test(name))return null;

 const kind=productKind(p,s.category);

 if(kind!=="instrument")return null;

 const evidence=applicationEvidence(
  p,s.category,s.application
 );

 /*
 For a clearly stated technical application,
 do not recommend an unverified instrument
 as a confirmed match.
 */
 if(
  s.category.id==="viscometer" &&
  s.application==="paint" &&
  evidence!=="confirmed"
 ){
  return null;
 }

 if(
  s.category.id==="moisture" &&
  s.application==="grain" &&
  evidence!=="confirmed"
 ){
  return null;
 }

 if(
  s.category.id==="thermometer" &&
  s.application==="cold" &&
  evidence!=="confirmed"
 ){
  return null;
 }

 let score=50;
 const confirmed=[];
 const unknown=[];

 if(evidence==="confirmed"){
  score+=100;
  confirmed.push("призначення згідно з описом товару");
 }

 if(s.category.id==="viscometer"){
  if(/вз[\s-]*246/.test(name)){
   score+=35;
  }

  if(/ротаційн|ротавіск|rotavisc/.test(name)){
   score+=15;
  }

  if(/впж|капілярн/.test(name)){
   score+=5;
  }
 }

 if(s.category.id==="scales"){
  if(
   /аналітичн/.test(norm(s.query)) &&
   !/аналітичн/.test(name)
  ){
   return null;
  }

  const spec=catalogScaleSpecs(p);

  if(s.specs.capacity!==null){
   if(!same(spec.capacity,s.specs.capacity)){
    return null;
   }

   confirmed.push(
    "НПВ "+s.specs.capacity+" г"
   );
   score+=30;
  }

  if(s.specs.readability!==null){
   if(!same(spec.readability,s.specs.readability)){
    return null;
   }

   confirmed.push(
    "дискретність "+s.specs.readability+" г"
   );
   score+=30;
  }

  if(
   spec.ambiguous &&
   (
    s.specs.capacity!==null||
    s.specs.readability!==null
   )
  ){
   unknown.push(
    "відповідність конкретної модифікації"
   );
  }
 }

 const pd=dimensions([
  p.name,p.description,p.details
 ].join(" "));

 for(const [key,value] of Object.entries(s.dims)){
  if(pd[key]===undefined)return null;
  if(!same(pd[key],value))return null;

  confirmed.push(key+": "+value);
  score+=15;
 }

 const price=priceNumber(p.price);

 if(s.budget!==null&&s.budget!==Infinity){
  if(price!==null&&price>s.budget)return null;

  if(price===null){
   unknown.push("вартість товару");
  }
 }

 if(
  s.category.id==="conductivity" &&
  /кондуктометр/.test(name)
 ){
  score+=25;
 }

 if(
  s.category.id==="ph" &&
  /ph[\s-]*метр/i.test(name)
 ){
  score+=15;
 }

 if(price!==null)score+=2;
 if(!unknown.length)score+=5;

 return {
  product:p,
  score,
  confirmed,
  unknown,
  evidence,
  kind
 };
}

function description(p){
 const s=String(p.description||"")
  .replace(/(?:\+?38)?[\s(.-]*0\d[\d\s().-]{7,}/g,"")
  .replace(/працюємо\s*24\s*\/\s*7/gi,"")
  .replace(/доставка по україні/gi,"")
  .replace(/в наявності/gi,"")
  .replace(/\s+/g," ")
  .trim();

 return s.length>155
  ?s.slice(0,155).replace(/\s+\S*$/,"")+"…"
  :s;
}

function productCard(result){
 const p=result.product;
 const card=document.createElement("div");
 card.className="product";

 const link=document.createElement("a");
 link.href=p.url;
 link.target="_blank";
 link.rel="noopener noreferrer";
 link.textContent=p.name;
 card.appendChild(link);

 const price=document.createElement("div");
 price.className="price";
 price.textContent=priceText(p.price);
 card.appendChild(price);

 const desc=description(p);

 if(desc){
  const d=document.createElement("div");
  d.className="detail";
  d.textContent=desc;
  card.appendChild(d);
 }

 if(result.confirmed.length){
  const d=document.createElement("div");
  d.className="detail good";
  d.textContent="Підтверджено за каталогом: "+
   result.confirmed.join(", ")+".";
  card.appendChild(d);
 }

 if(result.unknown.length){
  const d=document.createElement("div");
  d.className="note";
  d.textContent="Потрібно уточнити: "+
   result.unknown.join(", ")+".";
  card.appendChild(d);
 }

 return card;
}

function renderProduct(){
 if(!resultBox||!results.length)return;

 resultBox.replaceChildren();

 const status=document.createElement("div");
 status.className="detail";
 status.style.marginBottom="10px";
 status.textContent=
  "Товар "+(resultIndex+1)+" із "+results.length;

 resultBox.appendChild(status);
 resultBox.appendChild(
  productCard(results[resultIndex])
 );

 const nav=document.createElement("div");
 nav.className="actions";

 const prev=document.createElement("button");
 prev.type="button";
 prev.className="choice";
 prev.textContent="← Попередній товар";
 prev.disabled=resultIndex===0;
 prev.onclick=()=>{
  resultIndex--;
  renderProduct();
 };

 const next=document.createElement("button");
 next.type="button";
 next.className="choice";
 next.textContent="Наступний товар →";
 next.disabled=resultIndex===results.length-1;
 next.onclick=()=>{
  resultIndex++;
  renderProduct();
 };

 nav.append(prev,next);
 resultBox.appendChild(nav);
 messages.scrollTop=messages.scrollHeight;
}

function recommend(skipAI=false){
 if(!current?.category){
  message(
   "Не вдалося визначити тип обладнання. "+
   "Можете уточнити запит через AI."
  );

  if(!skipAI)offerAI(current.query);

  buttons([
   "Новий пошук",
   "Зв'язатися з менеджером"
  ]);

  return;
 }

 results=products
  .map(p=>scoreProduct(p,current))
  .filter(Boolean)
  .sort((a,b)=>
   b.score-a.score||
   a.unknown.length-b.unknown.length
  );

 if(!results.length){
  message(
   "У поточному каталозі не знайдено товарів "+
   "із підтвердженою відповідністю вашому запиту. "+
   "Це не означає, що Лабзона не постачає "+
   "таке обладнання. Менеджер допоможе "+
   "перевірити доступні моделі та характеристики."
  );

  if(!skipAI)offerAI(current.query);

  buttons([
   "Новий пошук",
   "Зв'язатися з менеджером"
  ]);

  return;
 }

 let text=
  "Категорія: "+current.category.label+". "+
  "Знайдено "+results.length+
  " потенційно відповідних товарів.";

 if(results.some(r=>r.evidence==="confirmed")){
  text+=
   " Першими показано товари з підтвердженим "+
   "призначенням.";
 }

 text+=
  " Перед замовленням перевірте технічні "+
  "характеристики обраної моделі.";

 message(text);

 resultIndex=0;
 resultBox=document.createElement("div");
 messages.appendChild(resultBox);
 renderProduct();

 if(
  current.category.id==="viscometer" &&
  current.application==="paint"
 ){
  message(
   "Уточнення: потрібне вимірювання умовної "+
   "в'язкості за часом витікання чи динамічної "+
   "в'язкості в мПа·с? Для цих методів "+
   "використовують різні типи віскозиметрів."
  );
 }

 buttons([
  "Уточнити бюджет",
  "Новий пошук",
  "Зв'язатися з менеджером"
 ]);
}

function offerAI(originalQuery){
 const box=document.createElement("div");
 box.className="actions";

 const button=document.createElement("button");
 button.type="button";
 button.className="choice";
 button.textContent="✨ Уточнити запит через AI";

 box.appendChild(button);
 messages.appendChild(box);

 button.onclick=()=>{
  if(aiBusy)return;

  button.disabled=true;

  if(
   !window.turnstile ||
   typeof window.turnstile.render!=="function"
  ){
   message(
    "Turnstile ще завантажується. "+
    "Спробуйте знову."
   );
   button.disabled=false;
   return;
  }

  const holder=document.createElement("div");
  holder.className="turnstile-holder";
  messages.appendChild(holder);
  messages.scrollTop=messages.scrollHeight;

  let used=false;

  try{
   window.turnstile.render(holder,{
    sitekey:AI.siteKey,
    theme:"auto",

    callback:async token=>{
     if(used)return;

     used=true;
     aiBusy=true;

     const loading=message(
      "Уточнюю запит за допомогою AI…"
     );

     try{
      const controller=new AbortController();
      const timer=setTimeout(
       ()=>controller.abort(),18000
      );

      let response;

      try{
       response=await fetch(AI.endpoint,{
        method:"POST",
        headers:{
         "Content-Type":"application/json"
        },
        body:JSON.stringify({
         query:originalQuery,
         turnstileToken:token
        }),
        signal:controller.signal
       });
      }finally{
       clearTimeout(timer);
      }

      const data=await response.json()
       .catch(()=>({}));

      if(!response.ok){
       message(
        response.status===429
         ?"Ліміт AI-запитів тимчасово вичерпано."
         :"AI тимчасово недоступний. "+
          "Звичайний пошук продовжує працювати."
       );
       return;
      }

      if(data.needs_clarification){
       message(
        data.clarification_question||
        "Уточніть характеристики обладнання."
       );
       return;
      }

      const query=data.normalized_query;

      if(
       typeof query!=="string"||
       query.trim().length<2
      ){
       message("AI не зміг уточнити запит.");
       return;
      }

      message("AI уточнив запит: "+query);

      current=newState(query.trim(),data);
      recommend(true);

     }catch{
      message(
       "Не вдалося отримати відповідь AI. "+
       "Спробуйте звичайний пошук."
      );
     }finally{
      loading.remove();
      aiBusy=false;
      holder.remove();
     }
    },

    "error-callback":()=>{
     message(
      "Перевірка Turnstile не вдалася."
     );
     holder.remove();
     button.disabled=false;
    },

    "expired-callback":()=>{
     message(
      "Час перевірки минув. Спробуйте ще раз."
     );
     holder.remove();
     button.disabled=false;
    }
   });
  }catch{
   message("Не вдалося запустити Turnstile.");
   holder.remove();
   button.disabled=false;
  }
 };
}

function manager(){
 message(
  "Як зручніше зв'язатися з менеджеркою Лабзони?"
 );

 const box=document.createElement("div");
 box.className="actions";

function start(){
 current=null;

 message("Яке обладнання шукаєте?");

 buttons([
  "Аналітичні ваги",
  "pH-метр",
  "Кондуктометр",
  "Термометр для холодильника",
  "Вологомір зерна",
  "Лабораторний посуд",
  "Сита лабораторні"
 ]);
}

function handle(raw){
 const value=String(raw||"").trim();
 if(!value)return;

 message(value,"user");

 if(!ready){
  message("Каталог ще завантажується.");
  return;
 }

 if(/^новий пошук$/i.test(value)){
  start();
  return;
 }

 if(/^зв'язатися з менеджером$/i.test(value)){
  manager();
  return;
 }

 if(/^уточнити бюджет$/i.test(value)){
  if(!current){
   message("Спочатку напишіть назву обладнання.");
   return;
  }

  current.waitBudget=true;

  message("Який максимальний бюджет?");

  buttons([
   "До 1000 грн",
   "До 5000 грн",
   "До 10000 грн",
   "До 15000 грн",
   "Без обмежень"
  ]);

  return;
 }

 if(current?.waitBudget){
  const budget=budgetOf(value);

  if(budget===null){
   message(
    'Напишіть, наприклад, «до 15000 грн».'
   );
   return;
  }

  current.budget=budget;
  current.waitBudget=false;
  recommend();
  return;
 }

 current=newState(value);

 if(scaleErrorQuery(value)){
  message(
   "Уточніть, будь ласка: йдеться про "+
   "допустиму похибку вимірювання чи "+
   "дискретність ваг? Вкажіть одиницю "+
   "вимірювання та найбільшу межу зважування."
  );
  return;
 }

 recommend();
}

form.addEventListener("submit",event=>{
 event.preventDefault();

 const value=input.value.trim();
 input.value="";

 if(value)handle(value);
});

async function load(){
 try{
  const response=await fetch(
   CATALOG_URL,{cache:"no-store"}
  );

  if(!response.ok){
   throw Error(
    "Catalog HTTP "+response.status
   );
  }

  const data=await response.json();

  if(!Array.isArray(data.products)){
   throw Error("Invalid catalog format");
  }

  products=data.products.filter(p=>
   p &&
   typeof p.name==="string" &&
   validUrl(p.url)
  );

  ready=true;

  message(
   "Вітаємо у Лабзоні! Допоможемо підібрати "+
   "лабораторне обладнання, прилади та матеріали. "+
   "Що саме вам потрібно?"
  );

  buttons([
   "Аналітичні ваги",
   "pH-метр",
   "Кондуктометр",
   "Термометр для холодильника",
   "Вологомір зерна",
   "Сита лабораторні"
  ]);

 }catch(error){
  console.error(error);

  message(
   "Не вдалося завантажити каталог. "+
   "Оновіть сторінку або зверніться до менеджера."
  );
 }
}

load();
