
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лабзона | Консультант</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#222}
.chat{max-width:480px;height:min(650px,95dvh);margin:20px auto;background:#fff;border:1px solid #ddd;border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.header{background:#c8202e;color:white;padding:18px;font-size:19px;font-weight:bold}
.messages{flex:1;overflow-y:auto;padding:16px}
.message{padding:12px;border-radius:11px;margin-bottom:12px;line-height:1.5;overflow-wrap:anywhere}
.bot{background:#f0f0f0}
.user{background:#fce4e6;margin-left:35px}
.product{border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
.product a{color:#c8202e;font-weight:bold}
.details{font-size:13px;color:#555;margin-top:7px;line-height:1.4}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.choice{background:white;color:#c8202e;border:1px solid #c8202e;padding:9px 11px;border-radius:8px;cursor:pointer}
.form{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}
input{flex:1;min-width:0;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:14px}
.send{background:#c8202e;color:#fff;border:0;border-radius:8px;padding:11px;cursor:pointer}
</style>
</head>
<body>
<div class="chat">
<div class="header">Лабзона | Консультант</div>
<div class="messages" id="messages"></div>
<form class="form" id="form">
<input id="input" placeholder="Який прилад шукаєте?" required>
<button class="send" type="submit">Надіслати</button>
</form>
</div>

<script>
const messages=document.getElementById("messages");
const input=document.getElementById("input");
let products=[];
let loaded=false;
let state={stage:null,capacity:null,precision:null};

function norm(s){
  return String(s||"").toLowerCase()
    .replace(/,/g,".")
    .replace(/\s+/g," ").trim();
}

function message(text,role="bot"){
  const div=document.createElement("div");
  div.className="message "+role;
  div.textContent=text;
  messages.appendChild(div);
  scroll();
}

function scroll(){
  messages.scrollTop=messages.scrollHeight;
}

function choices(items){
  const box=document.createElement("div");
  box.className="actions";
  items.forEach(item=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="choice";
    btn.textContent=item;
    btn.onclick=()=>handle(item);
    box.appendChild(btn);
  });
  messages.appendChild(box);
  scroll();
}

function reset(){
  state={stage:null,capacity:null,precision:null};
}

function safeLink(url){
  try{
    const u=new URL(url);
    return u.protocol==="https:" &&
      u.hostname==="labzona.com.ua" &&
      u.pathname.startsWith("/shop/");
  }catch{return false;}
}

function priceText(p){
  const raw=String(p.price||"").trim();
  const value=Number(raw);
  return raw&&Number.isFinite(value)&&value>0
    ?"Ціна: "+value.toLocaleString("uk-UA")+" грн"
    :"Ціна: уточніть у менеджера";
}

function showProducts(items){
  if(!items.length){
    message("Не знайшла підтверджених збігів. Уточніть характеристики у менеджера Лабзони.");
    choices(["Новий пошук"]);
    return;
  }

  items.forEach(p=>{
    if(!safeLink(p.url))return;
    const card=document.createElement("div");
    card.className="product";

    const link=document.createElement("a");
    link.href=p.url;
    link.target="_blank";
    link.rel="noopener noreferrer";
    link.textContent=p.name;

    const price=document.createElement("div");
    price.className="details";
    price.textContent=priceText(p);

    const description=document.createElement("div");
    description.className="details";
    description.textContent=String(p.description||"").slice(0,180);

    card.append(link,price,description);
    messages.appendChild(card);
  });

  choices(["Новий пошук"]);
  scroll();
}

function productText(p){
  return norm([
    p.name||"",
    p.description||"",
    p.details||""
  ].join(" "));
}

function toGrams(number,unit){
  const value=Number(String(number).replace(",","."));
  if(!Number.isFinite(value))return null;
  const u=unit.toLowerCase();
  if(u==="мг"||u==="mg")return value/1000;
  if(u==="кг"||u==="kg")return value*1000;
  return value;
}

function closeEnough(a,b){
  return Math.abs(a-b)<Math.max(1e-8,Math.abs(b)*1e-6);
}

/*
  Зчитуємо лише числа після назв характеристик.
  Не використовуємо випадкові числа з опису.
*/
function extractValues(p,kind){
  const text=productText(p);

  const labels=kind==="capacity"
    ?[
      "нгз",
      "нпв",
      "max",
      "мах",
      "максимальне навантаження",
      "максимальна маса зважування",
      "найбільша межа зважування",
      "найбільша границя зважування",
      "максимальна границя зважування",
      "максимальна межа зважування"
    ]
    :[
      "дискретність",
      "ціна поділки",
      "ціна ділення",
      "крок зважування",
      "readability",
      "resolution"
    ];

  const values=[];
  const num="(\\d+(?:[.,]\\d+)?)";
  const unit="(мг|кг|г|mg|kg|g)";

  for(const label of labels){
    const escaped=label.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    const re=new RegExp(
      escaped+"\\s*[:=—–-]?\\s*"+num+"\\s*"+unit,
      "gi"
    );

    for(const match of text.matchAll(re)){
      const value=toGrams(match[1],match[2]);
      if(value!==null&&value>0)values.push(value);
    }
  }

  return [...new Set(values)];
}

function findScales(capacity,precision){
  return products.filter(p=>{
    if(!/ваг|balance|scale/i.test(p.name||""))return false;

    const capacities=extractValues(p,"capacity");
    const precisions=extractValues(p,"precision");

    if(capacity!==null &&
       !capacities.some(v=>closeEnough(v,capacity))){
      return false;
    }

    if(precision!==null &&
       !precisions.some(v=>closeEnough(v,precision))){
      return false;
    }

    return true;
  });
}

function numberValue(s){
  const m=norm(s).match(/\d+(?:\.\d+)?/);
  return m?Number(m[0]):null;
}

function genericSearch(query){
  const stop=new Set([
    "мені","треба","потрібен","потрібні","потрібна",
    "купити","хочу","для","лабораторії","порадьте",
    "знайти","прилад","обладнання","який","яка"
  ]);

  const terms=(norm(query).match(/[a-zа-яіїєґ0-9]+/g)||[])
    .filter(w=>w.length>1&&!stop.has(w));

  if(!terms.length)return [];

  return products.map(p=>{
    const title=norm(p.name);
    const body=productText(p);
    let score=0;
    terms.forEach(w=>{
      if(title.includes(w))score+=5;
      else if(body.includes(w))score+=1;
    });
    return {p,score};
  }).filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score)
    .slice(0,5).map(x=>x.p);
}

function startScales(){
  reset();
  state.stage="capacity";
  message("Яке максимальне навантаження ваг вам потрібне?");
  choices(["120 г","200 г","220 г","Інше / не знаю"]);
}

function completeScales(){
  const capacity=numberValue(state.capacity);
  const precision=numberValue(state.precision);

  message(
    "Шукаю ваги з параметрами: навантаження — "+
    (capacity===null?"не вказано":capacity+" г")+
    ", дискретність — "+
    (precision===null?"не вказано":precision+" г")+"."
  );

  if(capacity===null&&precision===null){
    message("Покажу аналітичні ваги для ознайомлення.");
    showProducts(genericSearch("аналітичні ваги"));
    reset();
    return;
  }

  const found=findScales(capacity,precision);

  if(found.length){
    message(
      "Знайдено "+found.length+
      " моделей із відповідними розпізнаними параметрами. Перевірте повні технічні характеристики перед замовленням."
    );
    showProducts(found.slice(0,10));
  }else{
    message(
      "Не знайшла моделей, для яких вдалося підтвердити ці параметри в каталозі. Це не означає, що товару немає. Зверніться до менеджера Лабзони."
    );
    choices(["Новий пошук"]);
  }

  reset();
}

function handle(text){
  text=String(text||"").trim();
  if(!text)return;
  message(text,"user");

  if(!loaded){
    message("Каталог ще завантажується. Спробуйте пізніше.");
    return;
  }

  if(/^(новий пошук|спочатку|скинути)$/i.test(text)){
    reset();
    message("Яке обладнання шукаєте?");
    choices(["Аналітичні ваги","pH-метр","Термометр"]);
    return;
  }

  if(state.stage==="capacity"){
    state.capacity=text;
    state.stage="precision";
    message("Яка дискретність (крок зважування) потрібна?");
    choices(["0,0001 г","0,001 г","0,01 г","Не знаю"]);
    return;
  }

  if(state.stage==="precision"){
    state.precision=text;
    completeScales();
    return;
  }

  if(/ваг|зважуван/i.test(text)){
    startScales();
    return;
  }

  const results=genericSearch(text);
  if(results.length){
    message("Знайшла товари в каталозі Лабзони:");
    showProducts(results);
  }else{
    message("За цим запитом товари не знайдено. Уточніть назву обладнання.");
    choices(["Новий пошук"]);
  }
}

document.getElementById("form").addEventListener("submit",e=>{
  e.preventDefault();
  const text=input.value.trim();
  input.value="";
  handle(text);
});

async function load(){
  try{
    const response=await fetch("./catalog.json",{cache:"no-cache"});
    if(!response.ok)throw new Error("HTTP "+response.status);

    const data=await response.json();
    if(!Array.isArray(data.products))throw new Error("Invalid catalog");

    products=data.products;
    loaded=true;

    message("Вітаємо у Лабзоні! Допоможемо підібрати лабораторне обладнання. Що ви шукаєте?");
    choices(["Аналітичні ваги","pH-метр","Термометр"]);
  }catch(error){
    console.error(error);
    message("Не вдалося завантажити каталог. Спробуйте пізніше.");
  }
}
load();
</script>
</body>
</html>
