function norm(x){
 return String(x??"")
  .toLowerCase()
  .replace(/[’ʼ`]/g,"'")
  .replace(/,/g,".")
  .replace(/\s+/g," ")
  .trim();
}

}

];

const MATERIAL={
 grain:/зерн|пшениц|кукурудз|ячмен|ріпак/i,
 soil:/ґрунт|грунт/i,
 wood:/деревин|дерев'ян|дерев/i
};

function categoryOf(query){
 const q=norm(query);
 if(/кислотн|кислотност|кисл[а-яіїєґ]*/.test(q) &&
    /вод|рідин|розчин|раствор/.test(q)){
  return CATEGORIES.find(c=>c.id==="ph");
 }
 return CATEGORIES.find(c=>c.q.test(q))||null;
}

function materialOf(q){
 return Object.keys(MATERIAL)
  .find(k=>MATERIAL[k].test(norm(q)))||null;
}

function budgetOf(q){
 const s=norm(q);
 if(/без обмежень|будь.як.*цін/.test(s))return Infinity;
 const m=s.match(
  /(?:до|бюджет|не дорожче|не більше|максимум|ціна)\s*[:-]?\s*(\d[\d\s.]*)\s*(тис|тисяч|к|грн)?/
 );
 if(!m)return null;
 let n=Number(m[1].replace(/\s/g,""));
 if(/^(тис|к)/.test(m[2]||""))n*=1000;
 return n>0?n:null;
}

function toGrams(number,unit){
 const n=Number(String(number).replace(",","."));
 if(!Number.isFinite(n)||n<=0)return null;
 if(/^(кг|kg)$/i.test(unit))return n*1000;
 if(/^(мг|mg)$/i.test(unit))return n/1000;
 return n;
}

function same(a,b){
 return a!==null&&b!==null&&
  Math.abs(a-b)<Math.max(1e-8,Math.abs(b)*1e-6);
}

/*
 Parse scale query independently of catalog descriptions.
 "ваги 220 г дискретність 0,1 мг":
 capacity=220 g, readability=0.0001 g.
*/
function queryScaleSpecs(query){
 const s=norm(query);
 let capacity=null,readability=null;

 const d=s.match(
  /(?:дискретн\w*|крок зважування|ціна поділки|readability)\s*[:=–—-]?\s*(\d+(?:\.\d+)?)\s*(мг|mg|кг|kg|г|g)(?=\s|$|[.,;])/i
 );
 if(d)readability=toGrams(d[1],d[2]);

 const c=s.match(
  /(?:нпв|нгз|мах|max|межа зважування|навантаження)\s*[:=–—-]?\s*(\d+(?:\.\d+)?)\s*(кг|kg|г|g)(?=\s|$|[.,;])/i
 );
 if(c)capacity=toGrams(c[1],c[2]);

 const slash=s.match(
  /(\d+(?:\.\d+)?)\s*(кг|kg|г|g)\s*\/\s*(\d+(?:\.\d+)?)\s*(мг|mg|г|g)/i
 );
 if(slash){
  capacity=toGrams(slash[1],slash[2]);
  readability=toGrams(slash[3],slash[4]);
 }

 if(capacity===null){
  const candidates=[...s.matchAll(
   /(\d+(?:\.\d+)?)\s*(кг|kg|г|g)(?=\s|$|[.,;/])/gi
  )];
  const found=candidates.find(m=>
   toGrams(m[1],m[2])>=1 &&
   !/похиб|погреш/i.test(s.slice(Math.max(0,m.index-24),m.index))
  );
  if(found)capacity=toGrams(found[1],found[2]);
 }

 return {capacity,readability};
}

/*
 Catalog extraction:
 - model title / explicitly labeled specifications
 - no guessing from arbitrary numbers
 - multirange series must be checked manually
*/
function catalogScaleSpecs(p){
 const title=norm(p.name);
 const text=norm([p.name,p.description,p.details].join(" "));

 let capacity=null,readability=null;
 let ambiguous=false;

 const slash=title.match(
  /(\d+(?:\.\d+)?)\s*(кг|kg|г|g)\s*\/\s*(\d+(?:\.\d+)?)\s*(мг|mg|г|g)/i
 );
 if(slash){
  capacity=toGrams(slash[1],slash[2]);
  readability=toGrams(slash[3],slash[4]);
 }

 if(capacity===null){
  const m=text.match(
   /(?:нпв|нгз|мах|max|найбільша межа зважування|максимальна межа зважування|максимальне навантаження)\s*[:=–—-]?\s*(\d+(?:\.\d+)?)\s*(кг|kg|г|g)(?=\s|$|[.,;])/i
  );
  if(m)capacity=toGrams(m[1],m[2]);
 }

 if(readability===null){
  const m=text.match(
   /(?:дискретність|дискретністю|крок зважування|ціна поділки|readability)\s*[:=–—-]?\s*(\d+(?:\.\d+)?)\s*(мг|mg|г|g)(?=\s|$|[.,;])/i
  );
  if(m)readability=toGrams(m[1],m[2]);
 }

 // Recognize multi-range and model-series descriptions.
 if(
  /(?:\d+\s*\/\s*\d+)\s*(?:г|kg|кг)/i.test(text)||
  /(?:моделі|модифікації|серія містить|залежно від моделі|залежно від модифікації)/i.test(text)
 ) ambiguous=true;

 // A well-formed, exact single-model title is preferred.
 if(slash &&
    !/серія|залежно від моделі|кілька модифікацій/i.test(title)){
  ambiguous=false;
 }

 return {capacity,readability,ambiguous};
}

function scaleErrorQuery(q){
 return categoryOf(q)?.id==="scales" &&
  /похиб|погреш|accuracy/i.test(q);
}

function dimensions(q){
 const s=norm(q),out={};
 let m=s.match(
  /(?:об'єм|місткість|объем)\s*[:=–—-]?\s*(\d+(?:\.\d+)?)\s*(мл|л)/u
 );
 if(m)out.volume=Number(m[1])*(m[2]==="л"?1000:1);

 m=s.match(
  /(?:діаметр|діам|ø|⌀)\s*[:=–—-]?\s*(\d+(?:\.\d+)?)\s*(мм|см)/u
 );
 if(m)out.diameter=Number(m[1])*(m[2]==="см"?10:1);

 m=s.match(
  /(?:отвор(?:и|ів|у)?|комірк(?:и|а)?|ячейк(?:а|и)?)\s*[:=–—-]?\s*(\d+(?:\.\d+)?)\s*(мм|мкм)/u
 );
 if(m)out.aperture=Number(m[1])*(m[2]==="мкм"?.001:1);

 return out;
}

function newState(query,aiData=null){
 let category=categoryOf(query);
 if(!category&&aiData){
  const combined=[
   aiData.normalized_query,
   aiData.category,
   ...(Array.isArray(aiData.keywords)?aiData.keywords:[])
  ].filter(x=>typeof x==="string").join(" ");
  category=categoryOf(combined);
 }

 return {
  query,category,
  specs:category?.id==="scales"
   ?queryScaleSpecs(query)
   :{capacity:null,readability:null},
  material:materialOf(query),
  budget:budgetOf(query),
  dims:dimensions(query),
  waitBudget:false
 };
}

function scoreProduct(p,s){
 if(!validUrl(p.url)||!s.category)return null;

 const name=norm(p.name);
 const body=norm([p.description,p.details].join(" "));
 if(!s.category.name.test(name))return null;
 if(s.category.exclude?.test(name))return null;

 let score=50;
 const confirmed=[];
 const unknown=[];

 if(s.category.id==="scales"){
  if(/аналітичн/.test(norm(s.query)) &&
     !/аналітичн/.test(name))return null;

  const spec=catalogScaleSpecs(p);

  // A strict specification search must have both
  // explicitly documented fields on the product.
  if(s.specs.capacity!==null){
   if(spec.capacity===null)return null;
   if(!same(spec.capacity,s.specs.capacity))return null;
   confirmed.push("НПВ "+s.specs.capacity+" г");
   score+=30;
  }

  if(s.specs.readability!==null){
   if(spec.readability===null)return null;
   if(!same(spec.readability,s.specs.readability))return null;
   confirmed.push(
    "дискретність "+s.specs.readability+" г"
   );
   score+=30;
  }

  if(
   spec.ambiguous &&
   (s.specs.capacity!==null||
    s.specs.readability!==null)
  ){
   unknown.push("відповідність конкретної модифікації");
  }
 }

 if(s.category.id==="moisture"&&s.material){
  const re=MATERIAL[s.material];
  if(!re.test(name)&&!re.test(body))return null;
  score+=20;
 }

 if(s.category.id==="thermometer" &&
    /холодильн|морозильн/.test(norm(s.query))){
  if(!/холодильн|морозильн/.test(name+" "+body))
   return null;
  score+=20;
 }

 const pd=dimensions([p.name,p.description,p.details].join(" "));
 for(const [key,v] of Object.entries(s.dims)){
  if(pd[key]===undefined)return null;
  if(!same(pd[key],v))return null;
  confirmed.push(key+": "+v);
  score+=15;
 }

 const price=priceNumber(p.price);
 if(s.budget!==null&&s.budget!==Infinity){
  if(price!==null&&price>s.budget)return null;
  if(price===null)unknown.push("ціну");
 }

 if(s.category.id==="conductivity" &&
    /кондуктометр/.test(name))score+=25;

 if(s.category.id==="ph" &&
    /ph[\s-]*метр/i.test(name))score+=15;

 if(price!==null)score+=2;
 if(!unknown.length)score+=5;

 return {product:p,score,confirmed,unknown};
}

function description(p){
 const s=String(p.description||"")
  .replace(/(?:\+?38)?[\s(.-]*0\d[\d\s().-]{7,}/g,"")
  .replace(/працюємо\s*24\s*\/\s*7/gi,"")
  .replace(/доставка по україні/gi,"")
  .replace(/в наявності/gi,"")
  .replace(/\s+/g," ").trim();

 return s.length>155
  ?s.slice(0,155).replace(/\s+\S*$/,"")+"…"
  :s;
}

function productCard(r){
 const p=r.product;
 const card=document.createElement("div");
 card.className="product";

 const link=document.createElement("a");
 link.href=p.url;
 link.target="_blank";
 link.rel="noopener noreferrer";
 link.textContent=p.name;
 card.appendChild(link);

 const price=document.createElement("div");
 price.className="price";
 price.textContent=priceText(p.price);
 card.appendChild(price);

 const desc=description(p);
 if(desc){
  const el=document.createElement("div");
  el.className="detail";
  el.textContent=desc;
  card.appendChild(el);
 }

 if(r.confirmed.length){
  const el=document.createElement("div");
  el.className="detail good";
  el.textContent="Знайдено в каталозі: "+
   r.confirmed.join(", ")+".";
  card.appendChild(el);
 }

 if(r.unknown.length){
  const el=document.createElement("div");
  el.className="note";
  el.textContent="Потрібно уточнити: "+
   r.unknown.join(", ")+".";
  card.appendChild(el);
 }

 return card;
}

function renderProduct(){
 if(!resultBox||!results.length)return;
 resultBox.replaceChildren();

 const status=document.createElement("div");
 status.className="detail";
 status.style.marginBottom="10px";
 status.textContent="Товар "+(resultIndex+1)+
  " із "+results.length;

 resultBox.appendChild(status);
 resultBox.appendChild(productCard(results[resultIndex]));

 const nav=document.createElement("div");
 nav.className="actions";

 const prev=document.createElement("button");
 prev.type="button";
 prev.className="choice";
 prev.textContent="← Попередній товар";
 prev.disabled=resultIndex===0;
 prev.onclick=()=>{resultIndex--;renderProduct()};

 const next=document.createElement("button");
 next.type="button";
 next.className="choice";
 next.textContent="Наступний товар →";
 next.disabled=resultIndex===results.length-1;
 next.onclick=()=>{resultIndex++;renderProduct()};

 nav.append(prev,next);
 resultBox.appendChild(nav);
}

function recommend(skipAI=false){
 if(!current?.category){
  message(
   "Не вдалося точно визначити тип обладнання. "+
   "Спробуйте уточнити запит через AI."
  );
  if(!skipAI)offerAI(current.query);
  buttons(["Новий пошук","Зв'язатися з менеджером"]);
  return;
 }

 results=products
  .map(p=>scoreProduct(p,current))
  .filter(Boolean)
  .sort((a,b)=>
   a.unknown.length-b.unknown.length||
   b.score-a.score
  );

 if(!results.length){
  message(
   "У каталозі немає товарів із підтвердженою "+
   "відповідністю всім заданим параметрам. "+
   "Уточніть характеристики або зверніться "+
   "до менеджера Лабзони."
  );
  if(!skipAI)offerAI(current.query);
  buttons([
   "Уточнити бюджет",
   "Новий пошук",
   "Зв'язатися з менеджером"
  ]);
  return;
 }

 const precise=current.category.id==="scales" &&
  (current.specs.capacity!==null||
   current.specs.readability!==null);

 message(
  "Категорія: "+current.category.label+". "+
  "Знайдено "+results.length+
  (precise
   ?" товарів із документованими збігами параметрів. "
   :" потенційно відповідних товарів. ")+
  "Непідтверджені характеристики позначено в картках."
 );

 resultIndex=0;
 resultBox=document.createElement("div");
 messages.appendChild(resultBox);
 renderProduct();

 buttons([
  "Уточнити бюджет",
  "Новий пошук",
  "Зв'язатися з менеджером"
 ]);
}

function offerAI(originalQuery){
 const box=document.createElement("div");
 box.className="actions";

 const button=document.createElement("button");
 button.type="button";
 button.className="choice";
 button.textContent="✨ Уточнити запит через AI";
 box.appendChild(button);
 messages.appendChild(box);

 button.onclick=()=>{
  if(aiBusy)return;
  button.disabled=true;

  if(!window.turnstile ||
     typeof window.turnstile.render!=="function"){
   message("Turnstile ще завантажується. Спробуйте знову.");
   button.disabled=false;
   return;
  }

  const holder=document.createElement("div");
  holder.className="turnstile-holder";
  messages.appendChild(holder);
  messages.scrollTop=messages.scrollHeight;
  let used=false;

  try{
   window.turnstile.render(holder,{
    sitekey:AI.siteKey,
    theme:"auto",

    callback:async token=>{
     if(used)return;
     used=true;
     aiBusy=true;
     const loading=message("Уточнюю запит через AI…");

     try{
      const controller=new AbortController();
      const timer=setTimeout(
       ()=>controller.abort(),18000
      );
      let r;
      try{
       r=await fetch(AI.endpoint,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
         query:originalQuery,
         turnstileToken:token
        }),
        signal:controller.signal
       });
      }finally{
       clearTimeout(timer);
      }

      const data=await r.json().catch(()=>({}));

      if(!r.ok){
       message(
        r.status===429
        ?"Ліміт AI-запитів тимчасово вичерпано."
        :"AI тимчасово недоступний. "+
         "Звичайний пошук продовжує працювати."
       );
       return;
      }

      if(data.needs_clarification){
       message(
        data.clarification_question||
        "Уточніть характеристики обладнання."
       );
       return;
      }

      const q=data.normalized_query;
      if(typeof q!=="string"||q.trim().length<2){
       message("AI не зміг уточнити запит.");
       return;
      }

      message("AI уточнив запит: "+q);
      current=newState(q.trim(),data);
      recommend(true);

     }catch{
      message(
       "Не вдалося отримати відповідь AI. "+
       "Спробуйте звичайний пошук."
      );
     }finally{
      loading.remove();
      aiBusy=false;
      holder.remove();
     }
    },

    "error-callback":()=>{
     message("Перевірка Turnstile не вдалася.");
     holder.remove();
     button.disabled=false;
    },

    "expired-callback":()=>{
     message("Час перевірки минув. Спробуйте ще раз.");
     holder.remove();
     button.disabled=false;
    }
   });
  }catch{
   message("Не вдалося запустити Turnstile.");
   holder.remove();
   button.disabled=false;
  }
 };
}

function manager(){
 message("Як зручніше зв'язатися з менеджеркою Лабзони?");

 const box=document.createElement("div");
 box.className="actions";

 const phone=document.createElement("button");
 phone.type="button";
 phone.className="choice";
 phone.textContent="Телефон менеджера";
 phone.onclick=()=>message("Телефон: "+PHONE);

 const telegram=document.createElement("a");
 telegram.className="choice";
 telegram.href=TELEGRAM;
 telegram.target="_blank";
 telegram.rel="noopener noreferrer";

}

function start(){
 current=null;
 message("Яке обладнання шукаєте?");
 buttons([
  "Аналітичні ваги",
  "pH-метр",
  "Кондуктометр",
  "Термометр для холодильника",
  "Вологомір зерна",
  "Лабораторний посуд",
  "Сита лабораторні"
 ]);
}

function handle(raw){
 const value=String(raw||"").trim();
 if(!value)return;

 message(value,"user");

 if(!ready){
  message("Каталог ще завантажується.");
  return;
 }

 if(/^новий пошук$/i.test(value)){
  start();
  return;
 }

 if(/^зв'язатися з менеджером$/i.test(value)){
  manager();
  return;
 }

 if(/^уточнити бюджет$/i.test(value)){
  if(!current){
   message("Спочатку напишіть назву обладнання.");
   return;
  }
  current.waitBudget=true;
  message("Який максимальний бюджет?");
  buttons([
   "До 1000 грн",
   "До 5000 грн",
   "До 10000 грн",
   "До 15000 грн",
   "Без обмежень"
  ]);
  return;
 }

 if(current?.waitBudget){
  const budget=budgetOf(value);
  if(budget===null){
   message('Напишіть, наприклад, «до 15000 грн».');
   return;
  }
  current.budget=budget;
  current.waitBudget=false;
  recommend();
  return;
 }

 current=newState(value);

 if(scaleErrorQuery(value)){
  message(
   "Уточніть, будь ласка: йдеться про допустиму "+
   "похибку чи дискретність ваг? Вкажіть одиницю "+
   "вимірювання та найбільшу межу зважування."
  );
  return;
 }

 recommend();
}

form.addEventListener("submit",e=>{
 e.preventDefault();
 const value=input.value.trim();
 input.value="";
 if(value)handle(value);
});

async function load(){
 try{
  const r=await fetch(CATALOG_URL,{cache:"no-store"});
  if(!r.ok)throw Error("Catalog HTTP "+r.status);

  const data=await r.json();
  if(!Array.isArray(data.products))
   throw Error("Invalid catalog format");

  products=data.products.filter(p=>
   p&&typeof p.name==="string"&&validUrl(p.url)
  );

  ready=true;

  message(
   "Вітаємо у Лабзоні! Допоможемо підібрати "+
   "лабораторне обладнання, прилади та матеріали. "+
   "Що саме вам потрібно?"
  );

  buttons([
   "Аналітичні ваги",
   "pH-метр",
   "Кондуктометр",
   "Термометр для холодильника",
   "Вологомір зерна",
   "Сита лабораторні"
  ]);
 }catch(error){
  console.error(error);
  message(
   "Не вдалося завантажити каталог. "+
   "Оновіть сторінку або зверніться до менеджера."
  );
 }
}

load();
</script>
