function validUrl(value){

  return u.protocol==="https:" &&
   u.hostname==="labzona.com.ua" &&
   u.pathname.startsWith("/shop/");
 }catch{return false}
}

function priceNumber(value){
 if(typeof value==="number"){

 }
 const n=Number(String(value??"")
  .replace(/\s/g,"")
  .replace(/грн|uah/gi,"")
  .replace(",","."));
 return Number.isFinite(n)&&n>0?n:null;
}

}

function categoryOf(query){
 const q=norm(query);

 // Intent matters more than incidental mentions.
 if(
  /(кислотн|кислотност|кисл[а-яіїєґ]*)/.test(q) &&
  /(вод|рідин|розчин|раствор)/.test(q)
 ) return CATEGORIES.find(c=>c.id==="ph");

 return CATEGORIES.find(c=>c.q.test(q))||null;
}

const MATERIAL={
 grain:/зерн|пшениц|кукурудз|ячмен|ріпак/i,
 soil:/ґрунт|грунт|soil/i,
 wood:/деревин|дерев'ян|дерев/i
};

function materialOf(q){
 const s=norm(q);
 return Object.keys(MATERIAL).find(k=>MATERIAL[k].test(s))||null;
}

function budgetOf(q){
 const s=norm(q);
 if(/без обмежень|будь.як.*цін/.test(s))return Infinity;
 const m=s.match(
  /(?:до|бюджет|не дорожче|не більше|максимум|ціна)\s*[:-]?\s*(\d[\d\s.]*)\s*(тис|тисяч|к|грн)?/
 );
 if(!m)return null;
 let n=Number(m[1].replace(/\s/g,""));
 if(/^(тис|к)/.test(m[2]||""))n*=1000;
 return n>0?n:null;
}

function grams(n,u){
 const x=Number(String(n).replace(",","."));
 return /^(кг|kg)$/i.test(u)?x*1000:x;
}
function stepGrams(n,u){
 const x=Number(String(n).replace(",","."));
 return /^(мг|mg)$/i.test(u)?x*.001:x;
}

// Strictly extract explicit metrological fields.
// Avoid treating arbitrary numbers in descriptions
// as weighing limits or readability.
function scaleSpecs(value){
 const s=norm(value);
 let capacity=null,readability=null;

 const slash=s.match(
  /(\d+(?:\.\d+)?)\s*(кг|г|kg|g)\s*\/\s*(\d+(?:\.\d+)?)\s*(мг|г|mg|g)/i
 );
 if(slash){
  capacity=grams(slash[1],slash[2]);
  readability=stepGrams(slash[3],slash[4]);
 }

 const c=s.match(
  /(?:нпв|нгз|мах|max|найбільша межа зважування|максимальна межа зважування|максимальне навантаження)\s*[:=–—-]?\s*(\d+(?:\.\d+)?)\s*(кг|г|kg|g)/i
 );
 if(c)capacity=grams(c[1],c[2]);

 const d=s.match(
  /(?:дискретність|дискретністю|крок зважування|ціна поділки|readability)\s*[:=–—-]?\s*(\d+(?:\.\d+)?)\s*(мг|г|mg|g)/i
 );
 if(d)readability=stepGrams(d[1],d[2]);

 return {capacity,readability};
}

function productScale(p){
 const a=scaleSpecs(p.name);
 const b=scaleSpecs([p.description,p.details].join(" "));
 return {
  capacity:a.capacity??b.capacity,
  readability:a.readability??b.readability
 };
}

function same(a,b){
 return Math.abs(a-b)<Math.max(1e-8,Math.abs(b)*1e-6);
}

function dimensions(q){
 const s=norm(q),out={};
 let m=s.match(
  /(?:об'єм|місткість|объем)\s*[:=–—-]?\s*(\d+(?:\.\d+)?)\s*(мл|л)/u
 );
 if(m)out.volume=Number(m[1])*(m[2]==="л"?1000:1);

 m=s.match(
  /(?:діаметр|діам|ø|⌀)\s*[:=–—-]?\s*(\d+(?:\.\d+)?)\s*(мм|см)/u
 );
 if(m)out.diameter=Number(m[1])*(m[2]==="см"?10:1);

 m=s.match(
  /(?:отвор(?:и|ів|у)?|комірк(?:и|а)?|ячейк(?:а|и)?)\s*[:=–—-]?\s*(\d+(?:\.\d+)?)\s*(мм|мкм)/u
 );
 if(m)out.aperture=Number(m[1])*(m[2]==="мкм"?.001:1);
 return out;
}

function productDimensions(p){
 return dimensions([p.name,p.description,p.details].join(" "));
}

function scaleErrorQuery(q){
 return categoryOf(q)?.id==="scales" &&
  /похиб|погреш|accuracy/i.test(q);
}

function newState(query,aiData=null){
 let category=categoryOf(query);

 if(!category&&aiData){
  const combined=[
   aiData.normalized_query,
   aiData.category,
   ...(Array.isArray(aiData.keywords)?aiData.keywords:[])
  ].filter(x=>typeof x==="string").join(" ");

  category=categoryOf(combined);
 }

 const specs=category?.id==="scales"
  ?scaleSpecs(query)
  :{capacity:null,readability:null};

 return {
  query,
  category,
  material:materialOf(query),
  budget:budgetOf(query),
  capacity:specs.capacity,
  readability:specs.readability,
  dimensions:dimensions(query),
  waitBudget:false,
  aiData
 };
}

function words(q){
 const stop=new Set([
  "мені","хочу","шукаю","прилад","обладнання",
  "потрібен","потрібно","треба","купити",
  "для","води","вода","розчин","лабораторний",
  "лабораторні","прилади","який","яка","які",
  "наскільки","щоб","перевірити","виміряти",
  "ціна","вартість","грн","нужен","мне"
 ]);
 return norm(q)
  .replace(/[^a-zа-яіїєґ0-9]+/g," ")
  .split(/\s+/)
  .filter(w=>w.length>2&&!stop.has(w));
}

function scoreProduct(p,s){
 if(!validUrl(p.url))return null;
 if(!s.category)return null;

 const name=norm(p.name);
 const description=norm(p.description);
 const details=norm(p.details);
 const body=description+" "+details;

 // The product name must explicitly declare
 // the matching equipment type or function.
 if(!s.category.name.test(name))return null;
 if(s.category.exclude?.test(name))return null;

 let score=50;
 const confirmed=[],unknown=[];

 if(s.category.id==="conductivity"){
  if(/кондуктометр/.test(name))score+=25;
  if(/електропровідн|conductivity/i.test(body))score+=8;
 }

 if(s.category.id==="ph"){
  if(/ph[\s-]*метр/i.test(name))score+=15;
 }

 if(s.category.id==="scales"){
  const specs=productScale(p);

  if(/аналітичн/.test(norm(s.query)) &&
     !/аналітичн/.test(name))return null;

  for(const [key,label] of [
   ["capacity","найбільша межа зважування"],
   ["readability","дискретність"]
  ]){
   if(s[key]!==null){
    if(specs[key]!==null){
     if(!same(specs[key],s[key]))return null;
     score+=25;
     confirmed.push(label+": "+s[key]+" г");
    }else{
     unknown.push(label);
    }
   }
  }
 }

 if(s.category.id==="moisture"&&s.material){
  const re=MATERIAL[s.material];
  if(!re.test(name)&&!re.test(body))return null;
  score+=20;
 }

 if(s.category.id==="thermometer"){
  if(/холодильн|морозильн/.test(norm(s.query))){
   if(!/холодильн|морозильн/.test(name+" "+body))
    return null;
   score+=20;
  }
 }

 const pd=productDimensions(p);
 for(const [key,v] of Object.entries(s.dimensions)){
  if(pd[key]!==undefined){
   if(!same(pd[key],v))return null;
   confirmed.push(
    key+": "+v+(key==="volume"?" мл":" мм")
   );
   score+=15;
  }else{
   unknown.push("параметр "+key);
  }
 }

 const price=priceNumber(p.price);

 if(s.budget!==null&&s.budget!==Infinity){
  if(price!==null&&price>s.budget)return null;
  if(price===null)unknown.push("ціну");
 }

 for(const w of words(s.query)){
  if(name.includes(w))score+=8;
  else if(description.includes(w))score+=2;
 }

 if(price!==null)score+=2;
 if(!unknown.length)score+=5;

 return {product:p,score,confirmed,unknown};
}

function cleanDescription(p){
 const s=String(p.description||"")
  .replace(/(?:\+?38)?[\s(.-]*0\d[\d\s().-]{7,}/g,"")
  .replace(/працюємо\s*24\s*\/\s*7/gi,"")
  .replace(/доставка по україні/gi,"")
  .replace(/в наявності/gi,"")
  .replace(/\s+/g," ").trim();

 return s.length>155
  ?s.slice(0,155).replace(/\s+\S*$/,"")+"…"
  :s;
}

function productCard(r){
 const p=r.product;
 const div=document.createElement("div");
 div.className="product";

 const link=document.createElement("a");
 link.href=p.url;
 link.target="_blank";
 link.rel="noopener noreferrer";
 link.textContent=p.name;
 div.appendChild(link);

 const price=document.createElement("div");
 price.className="price";
 price.textContent=priceText(p.price);
 div.appendChild(price);

 const desc=cleanDescription(p);
 if(desc){
  const el=document.createElement("div");
  el.className="detail";
  el.textContent=desc;
  div.appendChild(el);
 }

 if(r.confirmed.length){
  const el=document.createElement("div");
  el.className="detail good";
  el.textContent="Підтверджено за каталогом: "+
   r.confirmed.join(", ")+".";
  div.appendChild(el);
 }

 if(r.unknown.length){
  const el=document.createElement("div");
  el.className="note";
  el.textContent="Потрібно уточнити: "+
   r.unknown.join(", ")+".";
  div.appendChild(el);
 }
 return div;
}

function renderProduct(){
 if(!resultBox||!searchResults.length)return;
 resultBox.replaceChildren();

 const status=document.createElement("div");
 status.className="detail";
 status.style.marginBottom="10px";
 status.textContent="Товар "+(resultIndex+1)+
  " із "+searchResults.length;
 resultBox.appendChild(status);

 resultBox.appendChild(
  productCard(searchResults[resultIndex])
 );

 const nav=document.createElement("div");
 nav.className="actions";

 const previous=document.createElement("button");
 previous.type="button";
 previous.className="choice";
 previous.textContent="← Попередній товар";
 previous.disabled=resultIndex===0;
 previous.onclick=()=>{resultIndex--;renderProduct()};

 const next=document.createElement("button");
 next.type="button";
 next.className="choice";
 next.textContent="Наступний товар →";
 next.disabled=resultIndex===searchResults.length-1;
 next.onclick=()=>{resultIndex++;renderProduct()};

 nav.append(previous,next);
 resultBox.appendChild(nav);
}

function recommend(skipAI=false){
 if(!current?.category){
  message(
   "Не вдалося точно визначити тип обладнання. "+
   "Можете уточнити запит через AI або звернутися "+
   "до менеджера."
  );
  if(!skipAI&&AI_CONFIG.enabled)offerAI(current.query);
  buttons(["Новий пошук","Зв'язатися з менеджером"]);
  return;
 }

 searchResults=products
  .map(p=>scoreProduct(p,current))
  .filter(Boolean)
  .sort((a,b)=>
   a.unknown.length-b.unknown.length||
   b.score-a.score
  );

 if(!searchResults.length){
  message(
   "За цим запитом у поточному каталозі бота "+
   "не знайдено підтверджених збігів. "+
   "Це не означає, що Лабзона не постачає "+
   "таке обладнання."
  );
  if(!skipAI&&AI_CONFIG.enabled)offerAI(current.query);
  buttons([
   "Уточнити бюджет",
   "Новий пошук",
   "Зв'язатися з менеджером"
  ]);
  return;
 }

 message(
  "Категорія: "+current.category.label+". "+
  "Знайдено "+searchResults.length+
  " потенційно відповідних товарів. "+
  "Непідтверджені параметри позначено в картках."
 );

 resultIndex=0;
 resultBox=document.createElement("div");
 messages.appendChild(resultBox);
 renderProduct();

 buttons([
  "Уточнити бюджет",
  "Новий пошук",
  "Зв'язатися з менеджером"
 ]);
}

function offerAI(originalQuery){
 const box=document.createElement("div");
 box.className="actions";

 const button=document.createElement("button");
 button.type="button";
 button.className="choice";
 button.textContent="✨ Уточнити запит через AI";
 box.appendChild(button);
 messages.appendChild(box);

 button.onclick=()=>{
  if(aiBusy)return;
  button.disabled=true;

  if(!window.turnstile||
     typeof window.turnstile.render!=="function"){
   message("Turnstile ще завантажується. Спробуйте знову.");
   button.disabled=false;
   return;
  }

  const holder=document.createElement("div");
  holder.className="turnstile-holder";
  messages.appendChild(holder);
  messages.scrollTop=messages.scrollHeight;

  let used=false;

  try{
   window.turnstile.render(holder,{
    sitekey:AI_CONFIG.siteKey,
    theme:"auto",

    callback:async token=>{
     if(used)return;
     used=true;
     aiBusy=true;
     const loading=message(
      "Уточнюю запит за допомогою AI…"
     );

     try{
      const controller=new AbortController();
      const timer=setTimeout(
       ()=>controller.abort(),18000
      );
      let response;

      try{
       response=await fetch(AI_CONFIG.endpoint,{
        method:"POST",
        headers:{
         "Content-Type":"application/json"
        },
        body:JSON.stringify({
         query:originalQuery,
         turnstileToken:token
        }),
        signal:controller.signal
       });
      }finally{
       clearTimeout(timer);
      }

      const data=await response.json().catch(()=>({}));

      if(!response.ok){
       if(response.status===429){
        message(
         "Тимчасово досягнуто ліміту AI-запитів. "+
         "Звичайний пошук працює."
        );
       }else if(
        response.status===503&&
        data.error==="Public AI is not enabled yet"
       ){
        message("AI поки вимкнений на сервері.");
       }else{
        message(
         "AI зараз недоступний. "+
         "Спробуйте звичайний пошук або зверніться "+
         "до менеджера."
        );
       }
       return;
      }

      if(data.needs_clarification){
       message(
        data.clarification_question||
        "Уточніть характеристики обладнання."
       );
       return;
      }

      if(
       typeof data.normalized_query!=="string"||
       data.normalized_query.trim().length<2
      ){
       message("AI не зміг уточнити запит.");
       return;
      }

      const normalized=data.normalized_query.trim();

      message("AI уточнив запит: "+normalized);

      // Try normalized wording, plus AI category.
      // Products still must pass local catalog filters.
      current=newState(normalized,data);

      recommend(true);

     }catch{
      message(
       "Не вдалося отримати відповідь AI. "+
       "Звичайний пошук залишається доступним."
      );
     }finally{
      loading.remove();
      aiBusy=false;
      holder.remove();
     }
    },

    "error-callback":()=>{
     message(
      "Перевірка Turnstile не вдалася. "+
      "Спробуйте знову."
     );
     holder.remove();
     button.disabled=false;
    },

    "expired-callback":()=>{
     message(
      "Термін дії перевірки минув. "+
      "Повторіть спробу."
     );
     holder.remove();
     button.disabled=false;
    }
   });
  }catch{
   message("Не вдалося запустити Turnstile.");
   holder.remove();
   button.disabled=false;
  }
 };
}

 message(

 );

 const box=document.createElement("div");
 box.className="actions";

 const phone=document.createElement("button");

 );

function start(){
 current=null;
 message("Яке обладнання або матеріали шукаєте?");
 buttons([
  "Аналітичні ваги",
  "pH-метр",
  "Термометр для холодильника",
  "Вологомір зерна",
  "Лабораторний посуд",
  "Сита лабораторні",
  "Ареометр"
 ]);
}

function handle(raw){
 const value=String(raw||"").trim();
 if(!value)return;
 message(value,"user");

 if(!ready){
  message("Каталог ще завантажується.");
  return;
 }

 if(/^новий пошук$/i.test(value)){
  start();
  return;
 }

 if(/^зв'язатися з менеджером$/i.test(value)){
  manager();
  return;
 }

 if(/^уточнити бюджет$/i.test(value)){
  if(!current){
   message(
    "Спочатку напишіть, яке обладнання шукаєте."
   );
   return;
  }
  current.waitBudget=true;
  message("Який максимальний бюджет?");
  buttons([
   "До 1000 грн",
   "До 5000 грн",
   "До 10000 грн",
   "До 15000 грн",
   "Без обмежень"
  ]);
  return;
 }

 if(current?.waitBudget){
  const budget=budgetOf(value);
  if(budget===null){
   message(
    "Напишіть, наприклад, «до 15000 грн»."
   );
   return;
  }
  current.budget=budget;
  current.waitBudget=false;
  recommend();
  return;
 }

 current=newState(value);

 if(scaleErrorQuery(value)){
  message(
   "Уточніть, будь ласка: йдеться про "+
   "допустиму похибку вимірювання чи "+
   "дискретність ваг? Вкажіть одиницю "+
   "вимірювання та найбільшу межу зважування."
  );
  return;
 }

 recommend();
}

function scaleErrorQuery(q){
 return categoryOf(q)?.id==="scales" &&
  /похиб|погреш|accuracy/i.test(q);
}

form.addEventListener("submit",event=>{
 event.preventDefault();
 const value=input.value.trim();
 input.value="";
 if(value)handle(value);
});

async function load(){
 try{
  const response=await fetch(
   CATALOG_URL,{cache:"no-store"}
  );

  if(!response.ok){
   throw Error(
    "Catalog HTTP "+response.status
   );
  }

  const data=await response.json();

  if(!Array.isArray(data.products)){
   throw Error("Invalid catalog format");
  }

  products=data.products.filter(p=>
   p&&
   typeof p.name==="string"&&
   validUrl(p.url)
  );

  ready=true;

  message(
   "Вітаємо у Лабзоні! Допоможемо підібрати "+
   "лабораторне обладнання, прилади та матеріали. "+
   "Що саме вам потрібно?"
  );

  buttons([
   "Аналітичні ваги",
   "pH-метр",
   "Термометр для холодильника",
   "Вологомір зерна",
   "Лабораторний посуд",
   "Сита лабораторні"
  ]);
 }catch(error){
  console.error(error);
  message(
   "Не вдалося завантажити каталог. "+
   "Оновіть сторінку або зверніться до менеджера."
  );
 }
}

load();
</script>
