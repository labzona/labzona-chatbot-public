
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лабзона | Консультант</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#222}
.chat{max-width:480px;height:min(650px,95dvh);margin:20px auto;background:white;border:1px solid #ddd;border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.header{background:#c8202e;color:white;padding:18px;font-size:19px;font-weight:bold}
.messages{flex:1;overflow-y:auto;padding:16px}
.message{padding:12px;border-radius:11px;margin-bottom:12px;line-height:1.5;overflow-wrap:anywhere}
.bot{background:#f0f0f0}
.user{background:#fce4e6;margin-left:35px}
.product{border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
.product a{color:#c8202e;font-weight:bold;line-height:1.4}
.details{font-size:13px;color:#555;margin-top:7px;line-height:1.45}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.choice{background:#fff;color:#c8202e;border:1px solid #c8202e;padding:9px 11px;border-radius:8px;cursor:pointer}
.choice:hover{background:#fff1f2}
.form{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}
input{flex:1;min-width:0;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:14px}
.send{background:#c8202e;color:#fff;border:0;border-radius:8px;padding:11px;cursor:pointer}
.note{font-size:12px;color:#777;margin:8px 0}
</style>
</head>
<body>

<div class="chat">
  <div class="header">Лабзона | Консультант</div>
  <div class="messages" id="messages"></div>
  <form class="form" id="form">
    <input id="input" placeholder="Яке обладнання шукаєте?" autocomplete="off" required>
    <button class="send" type="submit">Надіслати</button>
  </form>
</div>

<script>
const messages=document.getElementById("messages");
const input=document.getElementById("input");
let products=[];
let loaded=false;
let state={category:null,step:0,answers:[],original:""};

function norm(s){
  return String(s||"").toLowerCase()
    .replace(/,/g,".")
    .replace(/\s+/g," ").trim();
}

function scroll(){
  messages.scrollTop=messages.scrollHeight;
}

function message(text,role="bot"){
  const div=document.createElement("div");
  div.className="message "+role;
  div.textContent=text;
  messages.appendChild(div);
  scroll();
}

function choices(items){
  const box=document.createElement("div");
  box.className="actions";
  items.forEach(item=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="choice";
    btn.textContent=item;
    btn.onclick=()=>{
      box.remove();
      handle(item);
    };
    box.appendChild(btn);
  });
  messages.appendChild(box);
  scroll();
}

function reset(){
  state={category:null,step:0,answers:[],original:""};
}

function safeLink(url){
  try{
    const u=new URL(url);
    return u.protocol==="https:" &&
      u.hostname==="labzona.com.ua" &&
      u.pathname.startsWith("/shop/");
  }catch{return false;}
}

function priceText(p){
  const raw=String(p.price||"").trim();
  const amount=Number(raw);
  return raw&&Number.isFinite(amount)&&amount>0
    ?"Ціна: "+amount.toLocaleString("uk-UA")+" грн"
    :"Ціна: уточніть у менеджера";
}

function cleanDescription(p){
  let s=String(p.description||"");

  s=s.replace(
    /(?:тел\.?|телефон|дзвоніть|консультація)\s*[:.]?\s*\+?[\d\s()+-]{9,}/gi,""
  );
  s=s.replace(
    /(?:\+?38[\s()-]*)?0\d{2}[\s()-]*\d{3}[\s()-]*\d{2}[\s()-]*\d{2}/g,""
  );
  s=s.replace(
    /(?:в наявності|доставка по україні|працюємо 24\/7|безкоштовна консультація)[^.]*\.?/gi,""
  );
  s=s.replace(/\s+/g," ").trim();

  return s.length>155?s.slice(0,155).trim()+"…":s;
}

function showProducts(items){
  const valid=items.filter(p=>safeLink(p.url));

  if(!valid.length){
    message("Не знайшла підтверджених збігів у каталозі. Уточніть характеристики у менеджера Лабзони.");
    choices(["Новий пошук"]);
    return;
  }

  valid.forEach(p=>{
    const card=document.createElement("div");
    card.className="product";

    const link=document.createElement("a");
    link.href=p.url;
    link.target="_blank";
    link.rel="noopener noreferrer";
    link.textContent=p.name;

    const price=document.createElement("div");
    price.className="details";
    price.textContent=priceText(p);

    const desc=document.createElement("div");
    desc.className="details";
    desc.textContent=cleanDescription(p);

    card.append(link,price,desc);
    messages.appendChild(card);
  });

  choices(["Новий пошук"]);
  scroll();
}

function productText(p){
  return norm([p.name,p.description,p.details].join(" "));
}

function toGrams(value,unit){
  const n=Number(String(value).replace(",","."));
  if(!Number.isFinite(n))return null;
  if(unit==="мг"||unit==="mg")return n/1000;
  if(unit==="кг"||unit==="kg")return n*1000;
  return n;
}

function extractValues(p,kind){
  const text=productText(p);
  const labels=kind==="capacity"
    ?["нгз","нпв","max","мах","максимальне навантаження",
      "найбільша межа зважування","найбільша границя зважування",
      "максимальна маса зважування"]
    :["дискретність","ціна поділки","ціна ділення",
      "крок зважування","readability","resolution"];

  const values=[];
  for(const label of labels){
    const escaped=label.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    const re=new RegExp(
      escaped+"\\s*[:=—–-]?\\s*(\\d+(?:[.,]\\d+)?)\\s*(мг|кг|г|mg|kg|g)","gi"
    );
    for(const m of text.matchAll(re)){
      const v=toGrams(m[1],m[2]);
      if(v!==null&&v>0)values.push(v);
    }
  }
  return [...new Set(values)];
}

function numberValue(s){
  const m=norm(s).match(/\d+(?:\.\d+)?/);
  return m?Number(m[0]):null;
}

function closeEnough(a,b){
  return Math.abs(a-b)<Math.max(1e-8,b*1e-6);
}

function findScales(capacity,precision){
  return products.filter(p=>{
    if(!/ваг|balance|scale/i.test(p.name||""))return false;
    const caps=extractValues(p,"capacity");
    const precs=extractValues(p,"precision");
    if(capacity!==null&&!caps.some(v=>closeEnough(v,capacity)))return false;
    if(precision!==null&&!precs.some(v=>closeEnough(v,precision)))return false;
    return true;
  });
}

/* Категорії та діалоги */

const flows={
  scales:{
    questions:[
      {
        text:"Яка максимальна маса зважування вам потрібна?",
        options:["120 г","200 г","220 г","Інша / не знаю"]
      },
      {
        text:"Яка дискретність (крок зважування) потрібна?",
        options:["0,0001 г","0,001 г","0,01 г","Не знаю"]
      }
    ]
  },
  thermometer:{
    questions:[
      {
        text:"Що саме потрібно вимірювати?",
        options:["Повітря в холодильнику","Температуру продуктів","Рідини","Інше / не знаю"]
      },
      {
        text:"Чи потрібна повірка або калібрування?",
        options:["Потрібна повірка","Потрібне калібрування","Не потрібно","Не знаю"]
      }
    ]
  },
  hygrometer:{
    questions:[
      {
        text:"Де плануєте контролювати вологість?",
        options:["У приміщенні","На складі","У лабораторії","Інше / не знаю"]
      },
      {
        text:"Чи потрібна повірка або калібрування?",
        options:["Потрібна повірка","Потрібне калібрування","Не потрібно","Не знаю"]
      }
    ]
  },
  ph:{
    questions:[
      {
        text:"Для яких зразків потрібен pH-метр?",
        options:["Вода","Ґрунт","Харчові продукти","Інше / не знаю"]
      },
      {
        text:"Який формат приладу зручніший?",
        options:["Портативний","Настільний лабораторний","Не знаю"]
      }
    ]
  }
};

function detectCategory(s){
  const q=norm(s);
  if(/ваг|зважуван/.test(q))return "scales";
  if(/термометр|температур/.test(q))return "thermometer";
  if(/гігрометр|вологість повітря/.test(q))return "hygrometer";
  if(/ph|рн-метр|кислотномір/.test(q))return "ph";
  return null;
}

function startFlow(category,original){
  reset();
  state.category=category;
  state.original=original;
  askQuestion();
}

function askQuestion(){
  const flow=flows[state.category];
  const q=flow.questions[state.step];
  message(q.text);
  choices(q.options);
}

/* Пошук із пріоритетом призначення */

function isUnknown(s){
  return /не знаю|інше|не потрібно/.test(norm(s));
}

function categoryMatches(p,category){
  const name=norm(p.name);

  if(category==="thermometer"){
    return /термометр|термогігрометр|термограф/.test(name)
      && !/ареометр|тигл|спалах|нафтопродукт/.test(name);
  }
  if(category==="hygrometer"){
    return /гігрометр|термогігрометр|вологомір повітря/.test(name);
  }
  if(category==="ph"){
    return /ph|рн-метр|кислотномір|лакуатвін/.test(name);
  }
  return true;
}

function purposeRule(category,answer){
  const a=norm(answer);

  if(category==="thermometer"){
    if(/холодильник/.test(a)){
      return /холодильник|холодильн|морозильн|холодов/;
    }
    if(/продукт/.test(a)){
      return /харчов|продукт|haccp|хассп|щупов/;
    }
    if(/рідини/.test(a)){
      return /рідин|занур|щупов|води/;
    }
  }

  if(category==="hygrometer"){
    if(/склад/.test(a))return /склад|приміщенн|повітря/;
    if(/лаборатор/.test(a))return /лаборатор|приміщенн|повітря/;
    if(/приміщенн/.test(a))return /приміщенн|повітря/;
  }

  if(category==="ph"){
    if(/вода/.test(a))return /води|водн|water|акваріум/;
    if(/ґрунт/.test(a))return /ґрунт|грунт|soil/;
    if(/харчов/.test(a))return /харчов|продукт|food/;
  }

  return null;
}

function formRule(answer){
  const a=norm(answer);
  if(/портативн/.test(a))return /портатив|кишеньков|ручн|handheld/;
  if(/настільн/.test(a))return /настільн|стаціонарн|лабораторн/;
  return null;
}

function documentRule(answer){
  const a=norm(answer);
  if(/повірка/.test(a))return /повірк|повірен/;
  if(/калібрування/.test(a))return /калібр|calibrat/;
  return null;
}

const stop=new Set([
  "мені","треба","потрібен","потрібна","потрібні",
  "потрібно","хочу","купити","порадьте","знайти",
  "підберіть","підкажіть","який","яка","які",
  "для","мене","будь","ласка","прилад","обладнання",
  "лабораторії","та","або","що","де","чи",
  "на","по","від","із","з","в","у","і","є"
]);

function tokenize(s){
  return (norm(s).match(/[a-zа-яіїєґ0-9]+/g)||[])
    .filter(w=>w.length>1&&!stop.has(w));
}

function searchGeneral(query,category=null,rule=null,form=null){
  const terms=[...new Set(tokenize(query))];

  return products
    .filter(p=>safeLink(p.url))
    .filter(p=>!category||categoryMatches(p,category))
    .filter(p=>!rule||rule.test(productText(p)))
    .filter(p=>!form||form.test(productText(p)))
    .map(p=>{
      const name=norm(p.name);
      const desc=norm(p.description);
      const details=norm(p.details);
      let score=0;

      terms.forEach(t=>{
        if(name.includes(t))score+=10;
        else if(desc.includes(t))score+=3;
        else if(details.includes(t))score+=1;
      });

      if(rule&&rule.test(name))score+=100;
      if(form&&form.test(name))score+=30;

      return {p,score};
    })
    .filter(x=>x.score>0||rule!==null)
    .sort((a,b)=>b.score-a.score)
    .slice(0,5)
    .map(x=>x.p);
}

function completeFlow(){
  const category=state.category;
  const answers=[...state.answers];

  if(category==="scales"){
    const capacity=numberValue(answers[0]);
    const precision=numberValue(answers[1]);

    if(capacity===null&&precision===null){
      message("Покажу аналітичні ваги для ознайомлення.");
      showProducts(searchGeneral("аналітичні ваги"));
    }else{
      const found=findScales(capacity,precision);
      message(
        "Підбір ваг: навантаження — "+
        (capacity===null?"не визначено":capacity+" г")+
        ", дискретність — "+
        (precision===null?"не визначено":String(precision).replace(".",",")+" г")+"."
      );
      if(found.length){
        message("Знайдено "+found.length+" моделей із розпізнаними характеристиками.");
        showProducts(found.slice(0,10));
      }else{
        message("Не знайшла підтверджених збігів. Можливо, характеристики в каталозі записані інакше.");
        choices(["Новий пошук"]);
      }
    }
    reset();
    return;
  }

  const purpose=purposeRule(category,answers[0]);
  const format=category==="ph"?formRule(answers[1]):null;
  const document=category==="ph"?null:documentRule(answers[1]);

  const query=state.original+" "+answers[0];
  let found=searchGeneral(query,category,purpose,format);

  if(document){
    const confirmed=found.filter(p=>document.test(productText(p)));
    if(confirmed.length){
      found=confirmed;
      message("У знайдених описах згадано потрібну метрологічну послугу або документ. Уточніть у менеджера, чи доступні вони саме для обраного приладу.");
    }else{
      message("Наявність повірки або калібрування для цих моделей у каталозі не підтверджена. Потрібно уточнити у менеджера.");
    }
  }

  if(found.length){
    message("Знайшла "+found.length+" товарів за уточненою потребою. Перевірте характеристики перед замовленням.");
    showProducts(found);
  }else{
    message("У каталозі не знайшла товарів із підтвердженим призначенням за вашими відповідями. Зверніться до менеджера для індивідуального підбору.");
    choices(["Новий пошук"]);
  }

  reset();
}

function handle(text){
  text=String(text||"").trim();
  if(!text)return;

  message(text,"user");

  if(!loaded){
    message("Каталог ще завантажується. Спробуйте пізніше.");
    return;
  }

  if(/^(новий пошук|спочатку|скинути)$/i.test(text)){
    reset();
    message("Яке обладнання шукаєте?");
    choices(["Аналітичні ваги","pH-метр","Термометр","Гігрометр"]);
    return;
  }

  if(state.category){
    state.answers.push(text);
    state.step++;

    if(state.step<flows[state.category].questions.length){
      askQuestion();
    }else{
      completeFlow();
    }
    return;
  }

  const category=detectCategory(text);

  if(category){
    startFlow(category,text);
  }else{
    const found=searchGeneral(text);
    if(found.length){
      message("Знайшла товари за назвою та описом. Це попередній пошук, а не підтвердження технічної відповідності.");
      showProducts(found);
    }else{
      message("За цим запитом нічого не знайдено. Спробуйте уточнити назву або модель.");
      choices(["Новий пошук"]);
    }
  }
}

document.getElementById("form").addEventListener("submit",e=>{
  e.preventDefault();
  const text=input.value.trim();
  input.value="";
  handle(text);
});

async function load(){
  try{
    const response=await fetch("./catalog.json",{cache:"no-cache"});
    if(!response.ok)throw new Error("HTTP "+response.status);
    const data=await response.json();
    if(!Array.isArray(data.products))throw new Error("Invalid catalog");

    products=data.products.filter(p=>safeLink(p.url));
    loaded=true;

    message("Вітаємо у Лабзоні! Допоможемо підібрати лабораторне обладнання. Який прилад вам потрібен?");
    choices(["Аналітичні ваги","pH-метр","Термометр","Гігрометр"]);
  }catch(error){
    console.error(error);
    message("Не вдалося завантажити каталог. Спробуйте пізніше.");
  }
}
load();
</script>
</body>
</html>
