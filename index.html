
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лабзона | Консультант</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f4f6f8;
  font-family: Arial, sans-serif;
  color: #222;
}

.chat {
  max-width: 480px;
  height: min(650px, 95dvh);
  margin: 20px auto;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header {
  background: #c8202e;
  color: #fff;
  padding: 18px;
  font-size: 19px;
  font-weight: bold;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

.message {
  padding: 12px;
  border-radius: 11px;
  margin-bottom: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.bot { background: #f0f0f0; }

.user {
  background: #fce4e6;
  margin-left: 35px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 12px;
}

.choice {
  background: #fff;
  color: #c8202e;
  border: 1px solid #c8202e;
  padding: 9px 11px;
  border-radius: 8px;
  cursor: pointer;
}

.choice:hover { background: #fff0f1; }

.product {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  background: #fff;
}

.product a {
  color: #c8202e;
  font-weight: bold;
}

.details {
  font-size: 13px;
  color: #555;
  margin-top: 7px;
  line-height: 1.5;
}

.form {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid #eee;
}

input {
  flex: 1;
  min-width: 0;
  padding: 11px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 14px;
}

.send {
  background: #c8202e;
  color: #fff;
  border: 0;
  border-radius: 8px;
  padding: 11px;
  cursor: pointer;
}
</style>
</head>

<body>
<div class="chat">
  <div class="header">Лабзона | Консультант</div>

  <div class="messages" id="messages"></div>

  <form class="form" id="form">
    <input
      id="input"
      placeholder="Яке обладнання шукаєте?"
      required
    >
    <button class="send" type="submit">
      Надіслати
    </button>
  </form>
</div>

<script>
const CATALOG_URL = "./catalog.json";

const messages = document.getElementById("messages");
const input = document.getElementById("input");

let products = [];
let loaded = false;

let state = {
  stage: null,
  category: null,
  material: null,
  usage: null,
  budget: null
};

function norm(value) {
  return String(value || "")
    .toLowerCase()
    .replace(/ґ/g, "г")
    .replace(/[’']/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function message(text, role = "bot") {
  const div = document.createElement("div");
  div.className = "message " + role;
  div.textContent = text;
  messages.appendChild(div);
  scrollBottom();
}

function scrollBottom() {
  messages.scrollTop = messages.scrollHeight;
}

function choices(items) {
  const box = document.createElement("div");
  box.className = "actions";

  items.forEach(item => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "choice";
    button.textContent = item;
    button.onclick = () => handle(item);
    box.appendChild(button);
  });

  messages.appendChild(box);
  scrollBottom();
}

function reset() {
  state = {
    stage: null,
    category: null,
    material: null,
    usage: null,
    budget: null
  };
}

function safeLink(url) {
  try {
    const u = new URL(url);
    return u.protocol === "https:" &&
      u.hostname === "labzona.com.ua" &&
      u.pathname.startsWith("/shop/");
  } catch {
    return false;
  }
}

function numericPrice(product) {
  const raw = String(product.price ?? "")
    .replace(/\s/g, "")
    .replace(",", ".");

  const match = raw.match(/\d+(?:\.\d+)?/);
  if (!match) return null;

  const amount = Number(match[0]);
  return amount > 0 ? amount : null;
}

function priceText(product) {
  const price = numericPrice(product);

  return price === null
    ? "Ціна: уточніть у менеджера"
    : "Ціна: " +
      price.toLocaleString("uk-UA") +
      " грн";
}

function cleanDescription(product) {
  let text = String(product.description || "");

  text = text.replace(
    /(?:\+?38)?0\d{9}/g,
    ""
  );

  text = text.replace(
    /(?:дзвоніть|телефонуйте|замовляйте|безкоштовна консультація|працюємо 24\/7)[^.!?\n]*/gi,
    ""
  );

  text = text.replace(
    /\s+/g,
    " "
  ).trim();

  if (text.length > 150) {
    text = text.slice(0, 150);
    const lastSpace = text.lastIndexOf(" ");

    if (lastSpace > 80) {
      text = text.slice(0, lastSpace);
    }

    text += "…";
  }

  return text;
}

function showProducts(items) {
  const valid = items.filter(p => safeLink(p.url));

  if (!valid.length) {
    message(
      "Не знайшла товарів, які відповідають запиту. Можемо уточнити параметри або звернутися до менеджера Лабзони."
    );
    choices(["Новий пошук", "Зв'язатися з менеджером"]);
    return;
  }

  message(
    "Знайдено " +
    valid.length +
    " відповідних товарів за даними каталогу."
  );

  valid.forEach(p => {
    const card = document.createElement("div");
    card.className = "product";

    const link = document.createElement("a");
    link.href = p.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = p.name;

    const price = document.createElement("div");
    price.className = "details";
    price.textContent = priceText(p);

    const description = document.createElement("div");
    description.className = "details";
    description.textContent = cleanDescription(p);

    const warning = document.createElement("div");
    warning.className = "details";
    warning.textContent =
      "Попередній підбір за каталогом. Перевірте характеристики на сторінці товару.";

    card.append(link, price);

    if (description.textContent) {
      card.appendChild(description);
    }

    card.appendChild(warning);
    messages.appendChild(card);
  });

  choices(["Новий пошук", "Зв'язатися з менеджером"]);
  scrollBottom();
}

function extractBudget(text) {
  const s = norm(text).replace(/\u00a0/g, " ");

  const patterns = [
    /(?:до|не дорожче|максимум|бюджет(?:ом)?(?: до)?|в межах)\s*(\d[\d\s]*)(?:\s*(тис|тисяч))?\s*(?:грн|гривень|гривні)?/i,
    /(\d[\d\s]*)\s*(тис|тисяч)?\s*грн/i
  ];

  for (const pattern of patterns) {
    const match = s.match(pattern);
    if (!match) continue;

    let amount = Number(match[1].replace(/\s/g, ""));

    if (/тис|тисяч/.test(match[2] || "")) {
      amount *= 1000;
    }

    if (amount >= 100 && amount <= 10000000) {
      return amount;
    }
  }

  return null;
}

function detectMaterial(text) {
  const s = norm(text);

  if (/зерн|пшениц|кукурудз|ячмен|насін|соняшник|ріпак|соя/.test(s)) {
    return "grain";
  }

  if (/сін|солом|сіна/.test(s)) {
    return "hay";
  }

  if (/грунт|земл|почв/.test(s)) {
    return "soil";
  }

  return null;
}

function detectUsage(text) {
  const s = norm(text);

  if (/лаборатор|агролаборатор/.test(s)) {
    return "laboratory";
  }

  if (/ферм|господарств|агропідприєм|аграр|елеватор/.test(s)) {
    return "farm";
  }

  return null;
}

function isMoistureQuery(text) {
  return /вологомір|вологомірів|вимір.*вологіст/.test(norm(text));
}

function moistureType(product) {
  const name = norm(product.name);

  if (!/вологомір|вологомір|вимірювач вологост/.test(name)) {
    return null;
  }

  if (/грунт|почв/.test(name)) {
    return "soil";
  }

  if (/сін|солом/.test(name)) {
    return "hay";
  }

  if (/зерн|насін/.test(name)) {
    return "grain";
  }

  return "unknown";
}

function moistureCandidates() {
  return products.filter(p => {
    const type = moistureType(p);

    if (!type) return false;

    if (state.material && type !== state.material) {
      return false;
    }

    const price = numericPrice(p);

    if (state.budget !== null) {
      if (price === null || price > state.budget) {
        return false;
      }
    }

    return safeLink(p.url);
  }).sort((a, b) => {
    const pa = numericPrice(a);
    const pb = numericPrice(b);

    return (pa ?? Infinity) - (pb ?? Infinity);
  });
}

function completeMoisture() {
  const candidates = moistureCandidates();

  const names = {
    grain: "зерна",
    hay: "сіна або соломи",
    soil: "ґрунту"
  };

  let response = "Підбираю вологоміри";

  if (state.material) {
    response += " для " + names[state.material];
  }

  if (state.budget !== null) {
    response +=
      " у бюджеті до " +
      state.budget.toLocaleString("uk-UA") +
      " грн";
  }

  response += ".";
  message(response);

  if (candidates.length) {
    showProducts(candidates.slice(0, 5));
  } else {
    message(
      "За заданими умовами не знайшла відповідних товарів із зазначеною ціною. Це не означає, що такого приладу немає в Лабзоні."
    );
    choices(["Новий пошук", "Зв'язатися з менеджером"]);
  }

  reset();
}

function askMaterial() {
  state.stage = "material";

  message("Що саме потрібно вимірювати?");

  choices([
    "Зерно",
    "Сіно або солому",
    "Ґрунт",
    "Інші матеріали"
  ]);
}

function askUsage() {
  state.stage = "usage";

  message("Для яких умов потрібен прилад?");

  choices([
    "Для господарства",
    "Для лабораторії",
    "Не знаю"
  ]);
}

function askBudget() {
  state.stage = "budget";

  message("Який орієнтовний бюджет?");

  choices([
    "До 10 000 грн",
    "До 15 000 грн",
    "До 25 000 грн",
    "Без обмежень"
  ]);
}

function continueMoisture() {
  if (!state.material) {
    askMaterial();
    return;
  }

  if (!state.usage) {
    askUsage();
    return;
  }

  if (state.budget === null && state.stage !== "budgetDone") {
    askBudget();
    return;
  }

  completeMoisture();
}

function startMoisture(text) {
  reset();

  state.category = "moisture";
  state.material = detectMaterial(text);
  state.usage = detectUsage(text);
  state.budget = extractBudget(text);

  if (state.budget !== null) {
    state.stage = "budgetDone";
  }

  continueMoisture();
}

function genericSearch(query) {
  const words = norm(query).match(/[a-zа-яіїє0-9]+/g) || [];

  const stop = new Set([
    "мені", "треба", "потрібен",
    "потрібні", "купити", "хочу",
    "для", "лабораторії", "прилад",
    "обладнання", "шукаю", "порадьте"
  ]);

  const terms = words.filter(w =>
    w.length > 2 && !stop.has(w)
  );

  return products.map(p => {
    const name = norm(p.name);
    const description = norm(p.description);

    let score = 0;

    terms.forEach(term => {
      if (name.includes(term)) {
        score += 5;
      } else if (description.includes(term)) {
        score += 1;
      }
    });

    return { p, score };
  })
  .filter(item =>
    item.score > 0 && safeLink(item.p.url)
  )
  .sort((a, b) => b.score - a.score)
  .slice(0, 5)
  .map(item => item.p);
}

function contactManager() {
  message(
    "Зв'яжіться з менеджером Лабзони для уточнення характеристик і наявності товарів."
  );

  const box = document.createElement("div");
  box.className = "actions";

  const link = document.createElement("a");
  link.className = "choice";
  link.href = "tel:+380505956447";
  link.textContent = "Зателефонувати: 050 595 64 47";

  box.appendChild(link);
  messages.appendChild(box);
  scrollBottom();
}

function handle(text) {
  text = String(text || "").trim();
  if (!text) return;

  message(text, "user");

  if (!loaded) {
    message("Каталог ще завантажується.");
    return;
  }

  if (/^(новий пошук|спочатку|скинути)$/i.test(text)) {
    reset();
    message("Яке обладнання шукаєте?");
    choices([
      "Аналітичні ваги",
      "pH-метр",
      "Термометр",
      "Гігрометр",
      "Вологомір"
    ]);
    return;
  }

  if (/зв.язатися з менеджером/i.test(text)) {
    contactManager();
    return;
  }

  if (state.category === "moisture") {
    if (state.stage === "material") {
      state.material = detectMaterial(text);

      if (!state.material) {
        message(
          "Для інших матеріалів потрібен окремий підбір. Уточніть назву матеріалу або зверніться до менеджера."
        );
        reset();
        choices(["Новий пошук", "Зв'язатися з менеджером"]);
        return;
      }

      continueMoisture();
      return;
    }

    if (state.stage === "usage") {
      state.usage = detectUsage(text) || "unknown";
      continueMoisture();
      return;
    }

    if (state.stage === "budget") {
      if (/без обмежень|не знаю/i.test(text)) {
        state.budget = null;
      } else {
        state.budget = extractBudget(text);

        if (state.budget === null) {
          message(
            "Вкажіть бюджет, наприклад: до 15000 грн."
          );
          return;
        }
      }

      state.stage = "budgetDone";
      completeMoisture();
      return;
    }
  }

  if (isMoistureQuery(text) || /^вологомір$/i.test(text)) {
    startMoisture(text);
    return;
  }

  const results = genericSearch(text);

  if (results.length) {
    message("Знайшла товари в каталозі Лабзони:");
    showProducts(results);
  } else {
    message(
      "За цим запитом товарів не знайдено. Уточніть назву обладнання."
    );
    choices(["Новий пошук", "Зв'язатися з менеджером"]);
  }
}

document.getElementById("form")
  .addEventListener("submit", event => {
    event.preventDefault();

    const text = input.value.trim();
    input.value = "";

    handle(text);
  });

async function load() {
  try {
    const response = await fetch(
      CATALOG_URL,
      { cache: "no-cache" }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (!Array.isArray(data.products)) {
      throw new Error("Invalid catalog");
    }

    products = data.products;
    loaded = true;

    message(
      "Вітаємо у Лабзоні! Допоможемо підібрати лабораторне обладнання. Який прилад вам потрібен?"
    );

    choices([
      "Аналітичні ваги",
      "pH-метр",
      "Термометр",
      "Гігрометр",
      "Вологомір"
    ]);

  } catch (error) {
    console.error(error);

    message(
      "Не вдалося завантажити каталог. Спробуйте пізніше."
    );
  }
}

load();
</script>
</body>
</html>
