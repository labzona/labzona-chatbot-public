
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лабзона | Консультант</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#222}
.chat{max-width:480px;height:min(650px,95dvh);margin:20px auto;background:white;border:1px solid #ddd;border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.header{background:#c8202e;color:#fff;padding:18px;font-size:19px;font-weight:bold}
.messages{flex:1;overflow-y:auto;padding:16px}
.message{padding:12px;border-radius:11px;margin-bottom:12px;line-height:1.5;overflow-wrap:anywhere}
.bot{background:#f0f0f0}
.user{background:#fce4e6;margin-left:35px}
.product{border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:10px;background:white}
.product a{color:#c8202e;font-weight:bold}
.details{font-size:13px;color:#555;margin-top:7px;line-height:1.4}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.choice{background:white;color:#c8202e;border:1px solid #c8202e;padding:9px 11px;border-radius:8px;cursor:pointer}
.form{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}
input{flex:1;min-width:0;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:14px}
.send{background:#c8202e;color:#fff;border:0;border-radius:8px;padding:11px;cursor:pointer}
</style>
</head>
<body>
<div class="chat">
<div class="header">Лабзона | Консультант</div>
<div class="messages" id="messages"></div>
<form class="form" id="form">
<input id="input" placeholder="Який прилад шукаєте?" required>
<button class="send" type="submit">Надіслати</button>
</form>
</div>

<script>
const CATALOG_URL="./catalog.json";
const messages=document.getElementById("messages");
const input=document.getElementById("input");

let products=[];
let loaded=false;
let state={stage:null,capacity:null,precision:null};

function norm(s){
  return String(s||"").toLowerCase()
    .replace(/,/g,".")
    .replace(/\s+/g," ").trim();
}

function message(text,role="bot"){
  const div=document.createElement("div");
  div.className="message "+role;
  div.textContent=text;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

function choices(items){
  const box=document.createElement("div");
  box.className="actions";
  items.forEach(item=>{
    const button=document.createElement("button");
    button.type="button";
    button.className="choice";
    button.textContent=item;
    button.onclick=()=>handle(item);
    box.appendChild(button);
  });
  messages.appendChild(box);
  messages.scrollTop=messages.scrollHeight;
}

function reset(){
  state={stage:null,capacity:null,precision:null};
}

function safeLink(url){
  try{
    const u=new URL(url);
    return u.protocol==="https:" &&
      u.hostname==="labzona.com.ua" &&
      u.pathname.startsWith("/shop/");
  }catch{return false;}
}

function priceText(p){
  const raw=String(p.price||"").trim();
  const amount=Number(raw);
  return raw&&Number.isFinite(amount)&&amount>0
    ?"Ціна: "+amount.toLocaleString("uk-UA")+" грн"
    :"Ціна: уточніть у менеджера";
}

function showProducts(items){
  if(!items.length){
    message("Товарів із підтвердженими характеристиками не знайдено. Можливо, параметри не вказані в каталозі. Зверніться до менеджера Лабзони для уточнення.");
    choices(["Новий пошук"]);
    return;
  }

  items.forEach(p=>{
    if(!safeLink(p.url))return;

    const card=document.createElement("div");
    card.className="product";

    const link=document.createElement("a");
    link.href=p.url;
    link.target="_blank";
    link.rel="noopener noreferrer";
    link.textContent=p.name;

    const price=document.createElement("div");
    price.className="details";
    price.textContent=priceText(p);

    const desc=document.createElement("div");
    desc.className="details";
    desc.textContent=String(p.description||"").slice(0,180);

    card.append(link,price,desc);
    messages.appendChild(card);
  });

  choices(["Новий пошук"]);
  messages.scrollTop=messages.scrollHeight;
}

function productText(p){
  return norm([
    p.name||"",
    p.description||"",
    p.details||""
  ].join(" "));
}

function numberValue(s){
  const match=norm(s).match(/\d+(?:\.\d+)?/);
  return match?Number(match[0]):null;
}

/*
  Extract technical specifications only when they appear
  beside a recognizable specification label.
  This avoids treating unrelated numbers as specifications.
*/
function extractCapacity(p){
  const text=productText(p);

  const patterns=[
    /(?:максимальн\w*\s+(?:навантаженн\w*|мас\w*|зважуванн\w*)|найбільш\w*\s+границ\w*\s+зважуванн\w*|max\b|мах\b|нмз\b|границ\w*\s+зважуванн\w*)\s*[:=\-–]?\s*(\d+(?:\.\d+)?)\s*(кг|г|kg|g)\b/gi,
    /(?:\bmax\b|\bмах\b)\s*[:=\-–]?\s*(\d+(?:\.\d+)?)\s*(кг|г|kg|g)\b/gi
  ];

  const values=[];
  patterns.forEach(re=>{
    for(const m of text.matchAll(re)){
      const value=Number(m[1])*
        (m[2]==="кг"||m[2]==="kg"?1000:1);
      if(value>0)values.push(value);
    }
  });

  return [...new Set(values)];
}

function extractPrecision(p){
  const text=productText(p);

  const patterns=[
    /(?:дискретніст\w*|ціна\s+поділк\w*|ціна\s+дискр\w*|читабельніст\w*|readability|resolution)\s*[:=\-–]?\s*(\d+(?:\.\d+)?)\s*(мг|г|mg|g)\b/gi,
    /(?:\bd\b)\s*[:=]\s*(\d+(?:\.\d+)?)\s*(мг|г|mg|g)\b/gi
  ];

  const values=[];
  patterns.forEach(re=>{
    for(const m of text.matchAll(re)){
      const value=Number(m[1])*
        (m[2]==="мг"||m[2]==="mg"?0.001:1);
      if(value>0)values.push(value);
    }
  });

  return [...new Set(values)];
}

function numericMatch(values,target){
  return values.some(value=>
    Math.abs(value-target)<Math.max(1e-8,target*1e-6)
  );
}

function findScales(capacity,precision){
  return products.filter(p=>{
    if(!/ваг|balance|scale/i.test(p.name||""))return false;

    const capacities=extractCapacity(p);
    const precisions=extractPrecision(p);

    if(capacity!==null&&!numericMatch(capacities,capacity)){
      return false;
    }
    if(precision!==null&&!numericMatch(precisions,precision)){
      return false;
    }
    return true;
  });
}

function genericSearch(query){
  const words=norm(query).match(/[a-zа-яіїєґ0-9]+/g)||[];
  const stop=new Set([
    "мені","треба","потрібен","потрібні",
    "купити","хочу","для","лабораторії",
    "порадьте","знайти","прилад","обладнання"
  ]);
  const terms=words.filter(w=>w.length>1&&!stop.has(w));

  return products.map(p=>{
    const title=norm(p.name);
    const body=productText(p);
    let score=0;
    terms.forEach(w=>{
      if(title.includes(w))score+=5;
      else if(body.includes(w))score+=1;
    });
    return {p,score};
  }).filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score)
    .slice(0,5).map(x=>x.p);
}

function startScales(){
  reset();
  state.stage="capacity";
  message("Яке максимальне навантаження ваг вам потрібне?");
  choices(["120 г","200 г","220 г","Інше / не знаю"]);
}

function completeScales(){
  const capacity=numberValue(state.capacity);
  const precision=numberValue(state.precision);

  if(capacity===null&&precision===null){
    message("Покажу аналітичні ваги для ознайомлення.");
    showProducts(genericSearch("аналітичні ваги"));
    reset();
    return;
  }

  const found=findScales(capacity,precision);

  message(
    "Перевірила каталог за параметрами: "+
    "максимальне навантаження — "+
    (capacity===null?"не вказано":capacity+" г")+
    "; дискретність — "+
    (precision===null?"не вказано":precision+" г")+"."
  );

  if(found.length){
    message(
      "Знайдено "+found.length+
      " моделей, для яких у каталозі розпізнані потрібні характеристики. Перед замовленням перевірте специфікацію товару."
    );
    showProducts(found.slice(0,10));
  }else{
    message(
      "Не знайшла моделей, у яких вдалося підтвердити обидва параметри. Це не означає, що таких ваг немає в Лабзоні: можливо, характеристики записані в іншому форматі."
    );
    choices(["Новий пошук"]);
  }
  reset();
}

function handle(text){
  text=String(text||"").trim();
  if(!text)return;

  message(text,"user");

  if(!loaded){
    message("Каталог ще завантажується. Спробуйте пізніше.");
    return;
  }

  if(/^(новий пошук|спочатку|скинути)$/i.test(text)){
    reset();
    message("Яке обладнання шукаєте?");
    choices(["Аналітичні ваги","pH-метр","Термометр"]);
    return;
  }

  if(state.stage==="capacity"){
    state.capacity=text;
    state.stage="precision";
    message("Яка дискретність (крок зважування) потрібна?");
    choices(["0,0001 г","0,001 г","0,01 г","Не знаю"]);
    return;
  }

  if(state.stage==="precision"){
    state.precision=text;
    completeScales();
    return;
  }

  if(/ваг|зважуван/i.test(text)){
    startScales();
    return;
  }

  const results=genericSearch(text);
  if(results.length){
    message("Знайшла товари в каталозі Лабзони:");
    showProducts(results);
  }else{
    message("За цим запитом товари не знайдено. Уточніть назву обладнання.");
    choices(["Новий пошук"]);
  }
}

document.getElementById("form").addEventListener("submit",e=>{
  e.preventDefault();
  const text=input.value.trim();
  input.value="";
  handle(text);
});

async function load(){
  try{
    const response=await fetch(CATALOG_URL,{cache:"no-cache"});
    if(!response.ok)throw new Error("HTTP "+response.status);

    const data=await response.json();
    if(!Array.isArray(data.products))throw new Error("Invalid catalog");

    products=data.products;
    loaded=true;

    message("Вітаємо у Лабзоні! Допоможемо підібрати лабораторне обладнання. Що ви шукаєте?");
    choices(["Аналітичні ваги","pH-метр","Термометр"]);
  }catch(error){
    console.error(error);
    message("Не вдалося завантажити каталог. Спробуйте пізніше.");
  }
}
load();
</script>
</body>
</html>
