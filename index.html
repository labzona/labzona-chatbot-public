function norm(value){
 return String(value??"")
  .toLowerCase()
  .replace(/[’ʼ`]/g,"'")
  .replace(/,/g,".")
  .replace(/\s+/g," ")
  .trim();
}

function validUrl(value){

function priceNumber(value){

 }

 return Number.isFinite(n)&&n>0?n:null;
}

/*

const CATEGORIES=[

  exclude:/гир[яі]|набір гир|чашк|кабел|блок живлення|аксесуар/i
 },
 {
  id:"hygrometer",
  label:"Гігрометри",
  query:/гігрометр|гигрометр|вит[\s-]*[12]|віт[\s-]*[12]/i,
  name:/гігрометр|гигрометр/i,
  exclude:/чохол|футляр|запчастин/i
 },
 {

  label:"Вологоміри",
  query:/вологомір|влагомер|аналізатор вологості|вологість зерна|вологість деревини/i,
  name:/вологомір|влагомер|аналізатор вологості/i,
  exclude:/чашк|контейнер|запчастин/i
 },
 {

  label:"Термометри",
  query:/термометр|термощуп|термодатчик|температур[а-яіїєґ]*\s+холодильник/i,

  exclude:/чохол|футляр|окремий зонд/i
 },
 {

  label:"Лабораторні сита",
  query:/сит[оа]|сита|sieve|просіюван/i,

 },
 {

 },
 {

  query:/колб[аиу]|пробірк|бюретк|піпетк|циліндр мірн|лабораторний посуд/i,

 },

 {

function categoryOf(query){
 const q=norm(query);

 // Запити на кислотність води мають пріоритет
 // над загальними згадками води.
 if(
  /(кислотн|кислотност|кисл[а-яіїєґ]*)/.test(q) &&
  /(вод|рідин|раствор|розчин)/.test(q)
 ){
  return CATEGORIES[0];
 }

 return CATEGORIES.find(c=>c.query.test(q))||null;
}

const MATERIAL={
 grain:/зерн|пшениц|кукурудз|ячмен|ріпак/i,
 soil:/ґрунт|грунт|soil/i,
 wood:/деревин|дерев'ян|дерев/i
};

function materialOf(q){
 const s=norm(q);
 return Object.keys(MATERIAL).find(k=>MATERIAL[k].test(s))||null;
}

function budgetOf(q){
 const s=norm(q);
 if(/без обмежень|будь.як.*цін/.test(s))return Infinity;

 const m=s.match(
  /(?:до|бюджет|не дорожче|не більше|максимум|ціна)\s*[:-]?\s*(\d[\d\s.]*)\s*(тис|тисяч|к|грн)?/
 );

 if(!m)return null;
 let n=Number(m[1].replace(/\s/g,""));
 if(/^(тис|к)/.test(m[2]||""))n*=1000;
 return n>0?n:null;
}

function grams(number,unit){
 const n=Number(String(number).replace(",","."));
 return /^(кг|kg)$/i.test(unit)?n*1000:n;
}

function readabilityGrams(number,unit){
 const n=Number(String(number).replace(",","."));
 return /^(мг|mg)$/i.test(unit)?n*.001:n;
}

/*
 Точні метрологічні характеристики:
 - capacity = НПВ, у грамах
 - readability = дискретність, у грамах
 - похибка НЕ прирівнюється до дискретності.
*/
function scaleSpecs(value){
 const s=norm(value);
 let capacity=null;
 let readability=null;

 const slash=s.match(
  /(\d+(?:\.\d+)?)\s*(кг|г|kg|g)\s*\/\s*(\d+(?:\.\d+)?)\s*(мг|г|mg|g)/i
 );

 if(slash){
  capacity=grams(slash[1],slash[2]);
  readability=readabilityGrams(slash[3],slash[4]);
 }

 const max=s.match(
  /(?:нпв|нгз|мах|max|найбільша межа зважування|максимальне навантаження)\s*[:=-]?\s*(\d+(?:\.\d+)?)\s*(кг|г|kg|g)/i
 );
 if(max)capacity=grams(max[1],max[2]);

 const step=s.match(
  /(?:дискретність|дискретністю|крок зважування|ціна поділки|readability)\s*[:=-]?\s*(\d+(?:\.\d+)?)\s*(мг|г|mg|g)/i
 );
 if(step)readability=readabilityGrams(step[1],step[2]);

 const values=[...s.matchAll(
  /(\d+(?:\.\d+)?)\s*(мг|кг|г|mg|kg|g)(?=\s|$|[.,;)/])/gi
 )];

 if(capacity===null){
  const match=values.find(m=>
   /^(кг|kg|г|g)$/i.test(m[2])&&Number(m[1])>=1
  );
  if(match)capacity=grams(match[1],match[2]);
 }

 if(readability===null){
  const match=values.find(m=>
   /^(мг|mg)$/i.test(m[2])||
   (/^(г|g)$/i.test(m[2])&&
    Number(m[1])>0&&Number(m[1])<.1)
  );
  if(match)readability=readabilityGrams(match[1],match[2]);
 }

 return {capacity,readability};
}

function productScale(p){
 const a=scaleSpecs(p.name);
 const b=scaleSpecs([p.description,p.details].join(" "));
 return {
  capacity:a.capacity??b.capacity,
  readability:a.readability??b.readability
 };
}

function same(a,b){
 return Math.abs(a-b)<Math.max(1e-8,Math.abs(b)*1e-6);
}

function dimensionQuery(q){
 const s=norm(q);
 const out={};

 let m=s.match(
  /(?:об'єм|місткість|объем|\bна\b)\s*[:=]?\s*(\d+(?:\.\d+)?)\s*(мл|л)/u
 );
 if(m)out.volume=Number(m[1])*(m[2]==="л"?1000:1);

 m=s.match(
  /(?:діаметр|діам|ø|⌀)\s*[:=]?\s*(\d+(?:\.\d+)?)\s*(мм|см)/u
 );
 if(m)out.diameter=Number(m[1])*(m[2]==="см"?10:1);

 m=s.match(
  /(?:отвор(?:и|ів|у)?|комірк(?:и|а)?|ячейк(?:а|и)?)\s*[:=]?\s*(\d+(?:\.\d+)?)\s*(мм|мкм)/u
 );
 if(m)out.aperture=Number(m[1])*(m[2]==="мкм"?.001:1);

 return out;
}

function productDimensions(p){
 return dimensionQuery([p.name,p.description,p.details].join(" "));
}

function hasAmbiguousScaleError(q){
 const s=norm(q);
 return !!categoryOf(s) &&
  categoryOf(s).id==="scales" &&
  /похиб|погреш|accuracy/i.test(s);
}

function newState(query){
 const category=categoryOf(query);
 const specs=category?.id==="scales"
  ?scaleSpecs(query)
  :{capacity:null,readability:null};

 return {
  query,
  category,
  material:materialOf(query),
  budget:budgetOf(query),
  capacity:specs.capacity,
  readability:specs.readability,
  dimensions:dimensionQuery(query),
  waitBudget:false
 };
}

function wordTokens(value){
 const stop=new Set([
  "для","води","вода","прилад","обладнання",
  "шукаю","треба","мені","купити","який",
  "яка","щоб","наскільки","перевірити",
  "лабораторний","лабораторна","лабораторне",
  "грн","ціна","вартість","потрібно",
  "нужен","нужна","мне","для","или"
 ]);
 return norm(value)
  .replace(/[^a-zа-яіїєґ0-9]+/g," ")
  .split(/\s+/)
  .filter(w=>w.length>2&&!stop.has(w));
}

function scoreProduct(p,s){
 if(!validUrl(p.url))return null;
 if(!s.category)return null;

 const name=norm(p.name);
 const body=norm([p.description,p.details].join(" "));

 // Обов'язкова категорійна відповідність.
 if(!s.category.name.test(name))return null;
 if(s.category.exclude?.test(name))return null;

 let score=50;
 const confirmed=[];
 const unknown=[];

 if(s.category.id==="scales"){
  const specs=productScale(p);

  if(/аналітичн/.test(norm(s.query))&&!/аналітичн/.test(name))
   return null;

  for(const [key,label] of [
   ["capacity","найбільша межа зважування"],
   ["readability","дискретність"]
  ]){
   if(s[key]!==null){
    if(specs[key]!==null){
     if(!same(specs[key],s[key]))return null;
     confirmed.push(label+": "+s[key]+" г");
     score+=25;
    }else{
     unknown.push(label);
    }
   }
  }
 }

 // Призначення не повинно суперечити типу приладу.
 if(s.category.id==="moisture"&&s.material){
  const pattern=MATERIAL[s.material];
  if(!pattern.test(name)&&!pattern.test(body))return null;
  score+=25;
 }

 if(s.category.id==="thermometer"){
  const q=norm(s.query);
  if(/холодильн|морозильн/.test(q)){
   if(!/холодильн|морозильн/.test(name+" "+body))
    return null;
   score+=25;
  }
 }

 for(const [key,value] of Object.entries(s.dimensions)){
  const actual=productDimensions(p)[key];
  if(actual!==undefined){
   if(!same(actual,value))return null;
   confirmed.push(
    key+": "+value+(key==="volume"?" мл":" мм")
   );
   score+=15;
  }else{
   unknown.push("параметр "+key);
  }
 }

 const price=priceNumber(p.price);

 if(s.budget!==null&&s.budget!==Infinity){
  if(price!==null&&price>s.budget)return null;
  if(price===null)unknown.push("ціну");
 }

 for(const word of wordTokens(s.query)){
  if(name.includes(word))score+=8;
  else if(body.includes(word))score+=2;
 }

 if(price!==null)score+=2;
 if(!unknown.length)score+=5;

 return {product:p,score,confirmed,unknown};
}

function cleanDescription(p){
 const s=String(p.description||"")
  .replace(/(?:\+?38)?[\s(.-]*0\d[\d\s().-]{7,}/g,"")
  .replace(/працюємо\s*24\s*\/\s*7/gi,"")
  .replace(/доставка по україні/gi,"")
  .replace(/в наявності/gi,"")
  .replace(/\s+/g," ")
  .trim();

 return s.length>155
  ?s.slice(0,155).replace(/\s+\S*$/,"")+"…"
  :s;
}

function productCard(result){
 const p=result.product;
 const div=document.createElement("div");
 div.className="product";

 const link=document.createElement("a");
 link.href=p.url;
 link.target="_blank";
 link.rel="noopener noreferrer";
 link.textContent=p.name;
 div.appendChild(link);

 const price=document.createElement("div");
 price.className="price";
 price.textContent=priceText(p.price);
 div.appendChild(price);

 const desc=cleanDescription(p);
 if(desc){
  const detail=document.createElement("div");
  detail.className="detail";
  detail.textContent=desc;
  div.appendChild(detail);
 }

 if(result.confirmed.length){
  const el=document.createElement("div");
  el.className="detail good";
  el.textContent="Підтверджено за каталогом: "+
   result.confirmed.join(", ")+".";
  div.appendChild(el);
 }

 if(result.unknown.length){
  const el=document.createElement("div");
  el.className="note";
  el.textContent="Потрібно уточнити: "+
   result.unknown.join(", ")+".";
  div.appendChild(el);
 }

 return div;
}

function renderProduct(){
 if(!resultBox||!results.length)return;

 resultBox.replaceChildren();

 const status=document.createElement("div");
 status.className="detail";
 status.style.marginBottom="10px";
 status.textContent="Товар "+(resultIndex+1)+" із "+results.length;
 resultBox.appendChild(status);
 resultBox.appendChild(productCard(results[resultIndex]));

 const box=document.createElement("div");
 box.className="actions";

 const prev=document.createElement("button");
 prev.type="button";
 prev.className="choice";
 prev.textContent="← Попередній товар";
 prev.disabled=resultIndex===0;
 prev.onclick=()=>{resultIndex--;renderProduct()};

 const next=document.createElement("button");
 next.type="button";
 next.className="choice";
 next.textContent="Наступний товар →";
 next.disabled=resultIndex===results.length-1;
 next.onclick=()=>{resultIndex++;renderProduct()};

 box.append(prev,next);
 resultBox.appendChild(box);
}

function recommend(skipAI=false){
 if(!state?.category){
  message(
   "Поки не вдалося точно визначити категорію обладнання. "+
   "Уточніть назву чи призначення приладу."
  );

  if(!skipAI&&AI_CONFIG.enabled)offerAI(state.query);

  actions(["Новий пошук","Зв'язатися з менеджером"]);
  return;
 }

 results=products
  .map(p=>scoreProduct(p,state))
  .filter(Boolean)
  .sort((a,b)=>
   a.unknown.length-b.unknown.length||
   b.score-a.score
  );

 if(!results.length){
  message(
   "За цим запитом у каталозі бота немає товарів "+
   "із підтвердженою відповідністю. Це не означає, "+
   "що Лабзона не постачає таке обладнання."
  );

  if(!skipAI&&AI_CONFIG.enabled)offerAI(state.query);

  actions([
   "Уточнити бюджет",
   "Новий пошук",
   "Зв'язатися з менеджером"
  ]);
  return;
 }

 message(
  "Категорія: "+state.category.label+". "+
  "Знайдено "+results.length+" потенційно відповідних "+
  "товарів. Непідтверджені характеристики "+
  "позначено в картках."
 );

 resultIndex=0;
 resultBox=document.createElement("div");
 messages.appendChild(resultBox);
 renderProduct();

 actions([
  "Уточнити бюджет",
  "Новий пошук",
  "Зв'язатися з менеджером"
 ]);
}

/*
 AI викликається лише за бажанням покупця.
 Turnstile token видається браузерному віджету.
 Gemini API key залишається тільки в Cloudflare.
*/
function offerAI(originalQuery){
 const box=document.createElement("div");
 box.className="actions";

 const button=document.createElement("button");
 button.type="button";
 button.className="choice";
 button.textContent="✨ Уточнити запит через AI";
 box.appendChild(button);
 messages.appendChild(box);

 button.onclick=()=>{
  if(aiBusy)return;
  button.disabled=true;

  if(!window.turnstile||
     typeof window.turnstile.render!=="function"){
   message("Turnstile ще завантажується. Спробуйте знову.");
   button.disabled=false;
   return;
  }

  const holder=document.createElement("div");
  holder.className="turnstile-holder";
  messages.appendChild(holder);
  messages.scrollTop=messages.scrollHeight;

  let used=false;

  try{
   window.turnstile.render(holder,{
    sitekey:AI_CONFIG.siteKey,
    theme:"auto",

    callback:async token=>{
     if(used)return;
     used=true;
     aiBusy=true;
     const loading=message("Перевіряю запит за допомогою AI…");

     try{
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),18000);
      let response;

      try{
       response=await fetch(AI_CONFIG.endpoint,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
         query:originalQuery,
         turnstileToken:token
        }),
        signal:controller.signal
       });
      }finally{
       clearTimeout(timer);
      }

      const data=await response.json().catch(()=>({}));

      if(!response.ok){
       if(
        response.status===503&&
        data.error==="Public AI is not enabled yet"
       ){
        message(
         "AI поки вимкнений на тестовому сервері. "+
         "Звичайний пошук продовжує працювати."
        );
       }else if(response.status===429){
        message(
         "Тимчасово досягнуто ліміту AI-запитів. "+
         "Скористайтеся звичайним пошуком."
        );
       }else{
        message("AI зараз недоступний. Зверніться до менеджера.");
       }
       return;
      }

      if(data.needs_clarification){
       message(
        data.clarification_question||
        "Уточніть, будь ласка, характеристики обладнання."
       );
       return;
      }

      if(
       typeof data.normalized_query!=="string"||
       data.normalized_query.trim().length<2
      ){
       message("AI не зміг уточнити запит.");
       return;
      }

      const normalized=data.normalized_query.trim();
      message("AI уточнив запит: "+normalized);

      state=newState(normalized);
      recommend(true);

     }catch{
      message(
       "Не вдалося отримати відповідь AI. "+
       "Звичайний пошук залишається доступним."
      );
     }finally{
      loading.remove();
      aiBusy=false;
      holder.remove();
     }
    },

    "error-callback":()=>{
     message("Перевірка Turnstile не вдалася. Спробуйте знову.");
     holder.remove();
     button.disabled=false;
    },

    "expired-callback":()=>{
     message("Термін дії перевірки минув. Повторіть спробу.");
     holder.remove();
     button.disabled=false;
    }
   });
  }catch{
   message("Не вдалося запустити Turnstile.");
   holder.remove();
   button.disabled=false;
  }
 };
}

function manager(){
 message("Як зручніше зв'язатися з менеджеркою Лабзони?");

 const box=document.createElement("div");
 box.className="actions";

 const phone=document.createElement("button");
 phone.type="button";
 phone.className="choice";
 phone.textContent="Телефон менеджера";
 phone.onclick=()=>message("Телефон менеджера Лабзони: "+PHONE);

 const telegram=document.createElement("a");
 telegram.className="choice";
 telegram.href=TELEGRAM;
 telegram.target="_blank";
 telegram.rel="noopener noreferrer";
 telegram.textContent="Написати в Telegram";

 box.append(phone,telegram);
 messages.appendChild(box);
}

function start(){
 state=null;
 message("Яке обладнання або матеріали шукаєте?");
 actions([
  "Аналітичні ваги",
  "pH-метр",
  "Термометр для холодильника",
  "Вологомір зерна",
  "Лабораторний посуд",
  "Сита лабораторні",
  "Ареометр"
 ]);
}

function handle(raw){
 const value=String(raw||"").trim();
 if(!value)return;

 message(value,"user");

 if(!ready){
  message("Каталог ще завантажується.");
  return;
 }

 if(/^новий пошук$/i.test(value)){
  start();
  return;
 }

 if(/^зв'язатися з менеджером$/i.test(value)){
  manager();
  return;
 }

 if(/^уточнити бюджет$/i.test(value)){
  if(!state){
   message("Спочатку напишіть, яке обладнання шукаєте.");
   return;
  }

  state.waitBudget=true;
  message("Який максимальний бюджет?");
  actions([
   "До 1000 грн",
   "До 5000 грн",
   "До 10000 грн",
   "До 15000 грн",
   "Без обмежень"
  ]);
  return;
 }

 if(state?.waitBudget){
  const budget=budgetOf(value);

  if(budget===null){
   message('Напишіть, наприклад, «до 15000 грн».');
   return;
  }

  state.budget=budget;
  state.waitBudget=false;
  recommend();
  return;
 }

 state=newState(value);

 if(hasAmbiguousScaleError(value)){
  message(
   "Уточніть, будь ласка: йдеться про допустиму "+
   "похибку вимірювання чи дискретність ваг? "+
   "Укажіть одиницю вимірювання та "+
   "найбільшу межу зважування."
  );
  return;
 }

 recommend();
}

form.addEventListener("submit",event=>{
 event.preventDefault();
 const value=input.value.trim();
 input.value="";
 if(value)handle(value);
});

async function load(){
 try{
  const response=await fetch(CATALOG_URL,{cache:"no-store"});

  if(!response.ok){
   throw Error("Catalog HTTP "+response.status);
  }

  const data=await response.json();

  if(!Array.isArray(data.products)){
   throw Error("Invalid catalog format");
  }

  products=data.products.filter(p=>
   p&&typeof p.name==="string"&&validUrl(p.url)
  );

  ready=true;

  message(
   "Вітаємо у Лабзоні! Допоможемо підібрати "+
   "лабораторне обладнання, прилади та матеріали. "+
   "Що саме вам потрібно?"
  );

  actions([
   "Аналітичні ваги",
   "pH-метр",
   "Термометр для холодильника",
   "Вологомір зерна",
   "Лабораторний посуд",
   "Сита лабораторні"
  ]);

 }catch(error){
  console.error(error);
  message(
   "Не вдалося завантажити каталог. "+
   "Оновіть сторінку або зверніться до менеджера."
  );
 }
}

load();
