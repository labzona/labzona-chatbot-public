
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лабзона | Консультант</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f4f6f8;
  font-family:Arial,sans-serif;
  color:#222;
}
.chat{
  max-width:480px;
  height:min(650px,95dvh);
  margin:20px auto;
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.header{
  background:#c8202e;
  color:white;
  padding:18px;
  font-size:19px;
  font-weight:bold;
}
.messages{
  flex:1;
  overflow-y:auto;
  padding:16px;
}
.message{
  padding:12px;
  border-radius:11px;
  margin-bottom:12px;
  line-height:1.5;
  overflow-wrap:anywhere;
}
.bot{background:#f0f0f0}
.user{
  background:#fce4e6;
  margin-left:35px;
}
.product{
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
  background:#fff;
}
.product a{
  color:#c8202e;
  font-weight:bold;
  line-height:1.4;
}
.details{
  font-size:13px;
  color:#555;
  margin-top:7px;
  line-height:1.45;
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:12px;
}
.choice{
  background:#fff;
  color:#c8202e;
  border:1px solid #c8202e;
  padding:9px 11px;
  border-radius:8px;
  cursor:pointer;
}
.choice:hover{background:#fff1f2}
.form{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #eee;
}
input{
  flex:1;
  min-width:0;
  padding:11px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:14px;
}
.send{
  background:#c8202e;
  color:#fff;
  border:0;
  border-radius:8px;
  padding:11px;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="chat">
  <div class="header">Лабзона | Консультант</div>
  <div class="messages" id="messages"></div>
  <form class="form" id="form">
    <input id="input"
      placeholder="Яке обладнання шукаєте?"
      autocomplete="off"
      required>
    <button class="send" type="submit">Надіслати</button>
  </form>
</div>

<script>
const messages=document.getElementById("messages");
const input=document.getElementById("input");

let products=[];
let loaded=false;
let state={
  stage:null,
  capacity:null,
  precision:null
};

function norm(s){
  return String(s||"")
    .toLowerCase()
    .replace(/,/g,".")
    .replace(/\s+/g," ")
    .trim();
}

function scroll(){
  messages.scrollTop=messages.scrollHeight;
}

function message(text,role="bot"){
  const div=document.createElement("div");
  div.className="message "+role;
  div.textContent=text;
  messages.appendChild(div);
  scroll();
}

function choices(items){
  const box=document.createElement("div");
  box.className="actions";

  items.forEach(item=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="choice";
    btn.textContent=item;

    btn.onclick=()=>{
      box.remove();
      handle(item);
    };

    box.appendChild(btn);
  });

  messages.appendChild(box);
  scroll();
}

function reset(){
  state={
    stage:null,
    capacity:null,
    precision:null
  };
}

function safeLink(url){
  try{
    const u=new URL(url);
    return u.protocol==="https:" &&
      u.hostname==="labzona.com.ua" &&
      u.pathname.startsWith("/shop/");
  }catch{
    return false;
  }
}

function priceText(p){
  const raw=String(p.price||"").trim();
  const value=Number(raw);

  return raw&&Number.isFinite(value)&&value>0
    ?"Ціна: "+value.toLocaleString("uk-UA")+" грн"
    :"Ціна: уточніть у менеджера";
}

function cleanDescription(p){
  let s=String(p.description||"");

  s=s.replace(
    /(?:тел\.?|телефон|консультація)\s*[:.]?\s*\+?[\d\s()+-]{9,}/gi,
    ""
  );

  s=s.replace(
    /(?:в наявності|доставка по україні|працюємо 24\/7|безкоштовна консультація)[^.]*\.?/gi,
    ""
  );

  s=s.replace(/\s+/g," ").trim();

  return s.length>170
    ?s.slice(0,170).trim()+"…"
    :s;
}

function showProducts(items){
  const valid=items.filter(p=>safeLink(p.url));

  if(!valid.length){
    message(
      "Не знайшла відповідних товарів. Спробуйте уточнити назву, модель або характеристики."
    );
    choices(["Новий пошук"]);
    return;
  }

  valid.forEach(p=>{
    const card=document.createElement("div");
    card.className="product";

    const link=document.createElement("a");
    link.href=p.url;
    link.target="_blank";
    link.rel="noopener noreferrer";
    link.textContent=p.name;

    const price=document.createElement("div");
    price.className="details";
    price.textContent=priceText(p);

    const desc=document.createElement("div");
    desc.className="details";
    desc.textContent=cleanDescription(p);

    card.append(link,price,desc);
    messages.appendChild(card);
  });

  choices(["Новий пошук"]);
  scroll();
}

function productText(p){
  return norm([
    p.name||"",
    p.description||"",
    p.details||""
  ].join(" "));
}

function toGrams(value,unit){
  const n=Number(String(value).replace(",","."));
  if(!Number.isFinite(n))return null;

  const u=unit.toLowerCase();

  if(u==="мг"||u==="mg")return n/1000;
  if(u==="кг"||u==="kg")return n*1000;
  return n;
}

function closeEnough(a,b){
  return Math.abs(a-b)<
    Math.max(1e-8,Math.abs(b)*1e-6);
}

function extractValues(p,kind){
  const text=productText(p);

  const labels=kind==="capacity"
    ?[
      "нгз",
      "нпв",
      "max",
      "мах",
      "максимальне навантаження",
      "максимальна маса зважування",
      "найбільша межа зважування",
      "найбільша границя зважування",
      "максимальна межа зважування"
    ]
    :[
      "дискретність",
      "ціна поділки",
      "ціна ділення",
      "крок зважування",
      "readability",
      "resolution"
    ];

  const values=[];

  for(const label of labels){
    const escaped=label.replace(
      /[.*+?^${}()|[\]\\]/g,"\\$&"
    );

    const re=new RegExp(
      escaped+
      "\\s*[:=—–-]?\\s*"+
      "(\\d+(?:[.,]\\d+)?)"+
      "\\s*(мг|кг|г|mg|kg|g)",
      "gi"
    );

    for(const m of text.matchAll(re)){
      const value=toGrams(m[1],m[2]);

      if(value!==null&&value>0){
        values.push(value);
      }
    }
  }

  return [...new Set(values)];
}

function numberValue(s){
  const m=norm(s).match(/\d+(?:\.\d+)?/);
  return m?Number(m[0]):null;
}

function findScales(capacity,precision){
  return products.filter(p=>{
    if(!/ваг|balance|scale/i.test(p.name||"")){
      return false;
    }

    const capacities=extractValues(p,"capacity");
    const precisions=extractValues(p,"precision");

    if(capacity!==null &&
       !capacities.some(v=>closeEnough(v,capacity))){
      return false;
    }

    if(precision!==null &&
       !precisions.some(v=>closeEnough(v,precision))){
      return false;
    }

    return true;
  });
}

/* Визначення категорії та призначення */

function detectIntent(query){
  const q=norm(query);

  if(/холодильник|холодильн|морозильн|холодов/.test(q)
     && /термометр|температур/.test(q)){
    return "fridge_thermometer";
  }

  if(/термометр|вимірювач температури/.test(q)){
    return "thermometer";
  }

  if(/гігрометр|вологість повітря/.test(q)){
    return "hygrometer";
  }

  if(/ph|рн-метр|кислотн/.test(q)){
    return "ph_meter";
  }

  if(/сито|сита|просіюван/.test(q)){
    return "sieve";
  }

  if(/ареометр|густин/.test(q)){
    return "hydrometer";
  }

  return "general";
}

function categoryMatches(p,intent){
  const title=norm(p.name);

  if(intent==="fridge_thermometer" ||
     intent==="thermometer"){
    return /термометр|термогігрометр|термограф/.test(title)
      && !/ареометр|спалах|тигл|нафтопродукт/.test(title);
  }

  if(intent==="hygrometer"){
    return /гігрометр|термогігрометр|вологомір повітря/.test(title);
  }

  if(intent==="ph_meter"){
    return /ph|рн-метр|кислотномір/.test(title);
  }

  if(intent==="sieve"){
    return /сито|сита|набір сит/.test(title);
  }

  if(intent==="hydrometer"){
    return /ареометр|денсиметр/.test(title);
  }

  return true;
}

function purposeMatches(p,intent){
  const title=norm(p.name);
  const description=norm(p.description);
  const details=norm(p.details);

  if(intent==="fridge_thermometer"){
    const purpose=/холодильник|холодильн|морозильн|холодов|холодильних камер/;

    return purpose.test(title) ||
      purpose.test(description) ||
      purpose.test(details);
  }

  return true;
}

const stop=new Set([
  "мені","треба","потрібен","потрібна",
  "потрібні","потрібно","хочу","купити",
  "порадьте","знайти","підберіть","підкажіть",
  "який","яка","які","для","мене","будь",
  "ласка","прилад","обладнання","лабораторії",
  "лабораторний","лабораторна","лабораторні",
  "та","або","що","де","чи","на","по","від",
  "із","з","в","у","і","є"
]);

function tokenize(s){
  return (norm(s).match(/[a-zа-яіїєґ0-9]+/g)||[])
    .filter(w=>w.length>1&&!stop.has(w));
}

function genericSearch(query){
  const intent=detectIntent(query);
  const terms=[...new Set(tokenize(query))];

  if(!terms.length)return [];

  return products
    .filter(p=>safeLink(p.url))
    .filter(p=>categoryMatches(p,intent))
    .filter(p=>purposeMatches(p,intent))
    .map(p=>{
      const title=norm(p.name);
      const description=norm(p.description);
      const details=norm(p.details);

      let score=0;

      terms.forEach(word=>{
        if(title.includes(word))score+=10;
        else if(description.includes(word))score+=3;
        else if(details.includes(word))score+=1;
      });

      if(intent==="fridge_thermometer"){
        if(/холодильник|холодильн|морозильн/.test(title)){
          score+=100;
        }
      }

      return {p,score};
    })
    .filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score)
    .slice(0,5)
    .map(x=>x.p);
}

function startScales(){
  reset();
  state.stage="capacity";

  message(
    "Допоможу підібрати аналітичні ваги. Яка максимальна маса зважування вам потрібна?"
  );

  choices(["120 г","200 г","220 г","Інша / не знаю"]);
}

function completeScales(){
  const capacity=numberValue(state.capacity);
  const precision=numberValue(state.precision);

  if(capacity===null&&precision===null){
    message("Ось аналітичні ваги з каталогу Лабзони:");
    showProducts(genericSearch("аналітичні ваги"));
    reset();
    return;
  }

  const found=findScales(capacity,precision);

  message(
    "Шукаю ваги: навантаження — "+
    (capacity===null?"не вказано":capacity+" г")+
    ", дискретність — "+
    (precision===null?"не вказано":
      String(precision).replace(".",",")+" г")+"."
  );

  if(found.length){
    message(
      "Знайдено "+found.length+
      " моделей із розпізнаними параметрами. Перевірте технічні характеристики перед замовленням."
    );
    showProducts(found.slice(0,10));
  }else{
    message(
      "Не знайшла моделей із підтвердженими параметрами. Можливо, потрібна модель є в каталозі, але її характеристики записані в іншому форматі."
    );
    choices(["Новий пошук"]);
  }

  reset();
}

function recommend(query){
  const found=genericSearch(query);

  if(found.length){
    message(
      "Знайшла "+found.length+
      " товарів за вашим запитом. Підбір виконано за призначенням і описом; перевірте технічні характеристики перед замовленням."
    );
    showProducts(found);
  }else{
    message(
      "У каталозі не знайшла товарів із підтвердженим призначенням за цим запитом. Уточніть модель або зверніться до менеджера Лабзони."
    );
    choices(["Новий пошук"]);
  }
}

function handle(text){
  text=String(text||"").trim();
  if(!text)return;

  message(text,"user");

  if(!loaded){
    message("Каталог ще завантажується. Спробуйте пізніше.");
    return;
  }

  if(/^(новий пошук|спочатку|скинути)$/i.test(text)){
    reset();
    message("Що шукаємо цього разу?");
    choices([
      "Аналітичні ваги",
      "pH-метр",
      "Термометр",
      "Гігрометр"
    ]);
    return;
  }

  if(state.stage==="capacity"){
    state.capacity=text;
    state.stage="precision";

    message("Яка дискретність (крок зважування) потрібна?");
    choices([
      "0,0001 г",
      "0,001 г",
      "0,01 г",
      "Не знаю"
    ]);
    return;
  }

  if(state.stage==="precision"){
    state.precision=text;
    completeScales();
    return;
  }

  if(/ваг|зважуван/i.test(text)){
    startScales();
    return;
  }

  recommend(text);
}

document.getElementById("form").addEventListener(
  "submit",e=>{
    e.preventDefault();
    const text=input.value.trim();
    input.value="";
    handle(text);
  }
);

async function load(){
  try{
    const response=await fetch("./catalog.json",{
      cache:"no-cache"
    });

    if(!response.ok){
      throw new Error("HTTP "+response.status);
    }

    const data=await response.json();

    if(!Array.isArray(data.products)){
      throw new Error("Невірний формат каталогу");
    }

    products=data.products;
    loaded=true;

    message(
      "Вітаємо у Лабзоні! Допоможемо знайти лабораторне обладнання. Який прилад вам потрібен?"
    );

    choices([
      "Аналітичні ваги",
      "pH-метр",
      "Термометр",
      "Гігрометр"
    ]);

  }catch(error){
    console.error(error);
    message(
      "Каталог тимчасово недоступний. Спробуйте пізніше або зверніться до менеджера Лабзони."
    );
  }
}

load();
</script>
</body>
</html>
