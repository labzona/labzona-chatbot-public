
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лабзона | Консультант</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#222}
.chat{max-width:480px;height:min(650px,95dvh);margin:20px auto;background:white;border:1px solid #ddd;border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.header{background:#c8202e;color:white;padding:18px;font-size:19px;font-weight:bold}
.messages{flex:1;overflow-y:auto;padding:16px}
.message{padding:12px;border-radius:11px;margin-bottom:12px;line-height:1.5;overflow-wrap:anywhere}
.bot{background:#f0f0f0}
.user{background:#fce4e6;margin-left:35px}
.product{border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:10px;background:white}
.product a{color:#c8202e;font-weight:bold}
.details{font-size:13px;color:#555;margin-top:7px;line-height:1.4}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.choice{background:white;color:#c8202e;border:1px solid #c8202e;padding:9px 11px;border-radius:8px;cursor:pointer}
.form{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}
input{flex:1;min-width:0;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:14px}
.send{background:#c8202e;color:white;border:0;border-radius:8px;padding:11px;cursor:pointer}
</style>
</head>
<body>
<div class="chat">
<div class="header">Лабзона | Консультант</div>
<div class="messages" id="messages"></div>
<form class="form" id="form">
<input id="input" placeholder="Яке обладнання шукаєте?" required>
<button class="send" type="submit">Надіслати</button>
</form>
</div>
<script>
const CATALOG_URL="./catalog.json";
const messages=document.getElementById("messages");
const input=document.getElementById("input");
let products=[],loaded=false;
let state={stage:null,category:null,answers:[],original:""};

function norm(s){
 return String(s||"").toLowerCase().replace(/,/g,".").replace(/\s+/g," ").trim();
}
function message(t,role="bot"){
 const d=document.createElement("div");
 d.className="message "+role;d.textContent=t;
 messages.appendChild(d);scroll();
}
function scroll(){messages.scrollTop=messages.scrollHeight}
function choices(items){
 const d=document.createElement("div");d.className="actions";
 items.forEach(t=>{
  const b=document.createElement("button");b.type="button";
  b.className="choice";b.textContent=t;b.onclick=()=>handle(t);
  d.appendChild(b);
 });
 messages.appendChild(d);scroll();
}
function reset(){state={stage:null,category:null,answers:[],original:""}}
function safeLink(url){
 try{
  const u=new URL(url);
  return u.protocol==="https:"&&u.hostname==="labzona.com.ua"&&u.pathname.startsWith("/shop/");
 }catch{return false}
}
function priceText(p){
 const raw=String(p.price||"").trim();
 const amount=Number(raw.replace(/\s/g,""));
 return amount>0&&Number.isFinite(amount)
  ?"Ціна: "+amount.toLocaleString("uk-UA")+" грн"
  :"Ціна: уточніть у менеджера";
}
function productText(p){
 return norm([p.name,p.description,p.details].join(" "));
}
function cleanDescription(p){
 let s=String(p.description||"");
 s=s.replace(/(?:тел\.?|телефон|дзвоніть|консультація)\s*[:.]?\s*[\d\s()+-]{7,}/gi,"");
 s=s.replace(/\+?380[\d\s()-]{8,}/g,"");
 return s.trim().slice(0,190);
}
function showProducts(items){
 if(!items.length){
  message("Не знайшла товарів із достатньо підтвердженою відповідністю. Спробуйте уточнити запит або зверніться до менеджера.");
  choices(["Новий пошук"]);
  return;
 }
 items.forEach(p=>{
  if(!safeLink(p.url))return;
  const card=document.createElement("div");card.className="product";
  const link=document.createElement("a");
  link.href=p.url;link.target="_blank";link.rel="noopener noreferrer";link.textContent=p.name;
  const price=document.createElement("div");price.className="details";price.textContent=priceText(p);
  const desc=document.createElement("div");desc.className="details";desc.textContent=cleanDescription(p);
  card.append(link,price,desc);messages.appendChild(card);
 });
 choices(["Новий пошук"]);
 scroll();
}
function extractValues(p,kind){
 const text=productText(p);
 const values=[];
 const re=kind==="capacity"
  ?/(?:нпв|максимальн[а-яіїєґ]*\s+(?:навантаженн[а-яіїєґ]*|мас[а-яіїєґ]*|зважуванн[а-яіїєґ]*)|max)\s*[:=\s-]*([0-9]+(?:\.[0-9]+)?)\s*(кг|г|kg|g)/gi
  :/(?:дискретніст[а-яіїєґ]*|ціна\s+поділк[а-яіїєґ]*|readability|resolution|d\s*=)\s*[:=\s-]*([0-9]+(?:\.[0-9]+)?)\s*(мг|г|mg|g)/gi;
 for(const m of text.matchAll(re)){
  values.push(Number(m[1])*(["кг","kg"].includes(m[2])?1000:["мг","mg"].includes(m[2])?.001:1));
 }
 const title=norm(p.name);
 if(kind==="capacity"){
  for(const m of title.matchAll(/(\d+(?:\.\d+)?)\s*(кг|г|kg|g)(?![а-яіїєґa-z])/gi)){
   const value=Number(m[1])*(["кг","kg"].includes(m[2])?1000:1);
   if(value>=20)values.push(value);
  }
 }else{
  for(const m of title.matchAll(/(\d+(?:\.\d+)?)\s*(мг|mg)(?![а-яіїєґa-z])/gi)){
   values.push(Number(m[1])*.001);
  }
  for(const m of title.matchAll(/(?:\/|дискретніст[а-яіїєґ]*\s*[:=]?)\s*(0\.\d+)\s*(г|g)(?![а-яіїєґa-z])/gi)){
   values.push(Number(m[1]));
  }
 }
 return [...new Set(values)];
}
function numericMatch(values,target){
 return values.some(v=>Math.abs(v-target)<Math.max(1e-8,target*1e-6));
}
function scaleSearch(){
 const cap=Number(norm(state.answers[0]).match(/\d+(?:\.\d+)?/)?.[0]||0);
 const prec=Number(norm(state.answers[1]).match(/\d+(?:\.\d+)?/)?.[0]||0);
 return products.filter(p=>{
  if(!/ваг|balance|scale/i.test(p.name||""))return false;
  if(cap&&!numericMatch(extractValues(p,"capacity"),cap))return false;
  if(prec&&!numericMatch(extractValues(p,"precision"),prec))return false;
  return true;
 });
}
function classifyThermometer(p){
 const title=norm(p.name);
 if(!/термометр|термогігрометр/.test(title))return null;
 if(/ареометр|апарат|спалах/.test(title))return null;
 if(/холодильник|морозильник|рефрижератор/.test(title))return "air";
 if(/щуп|зонд|проникн|харчов|haccp|хассп|наccp/.test(title))return "food";
 if(/рідини|рідин|занур/.test(title))return "liquid";
 return "general";
}
function thermometerSearch(){
 const purpose=norm(state.answers[0]||"");
 const service=norm(state.answers[1]||"");
 let type="general";
 if(/повітря|холодильник/.test(purpose))type="air";
 else if(/продукт/.test(purpose))type="food";
 else if(/рідин/.test(purpose))type="liquid";
 const scored=products.map(p=>{
  const kind=classifyThermometer(p);
  if(!kind)return null;
  const title=norm(p.name),body=productText(p);
  let score=kind===type?100:kind==="general"?10:0;
  if(type==="air"&&kind!=="air")return null;
  if(type==="food"&&kind==="air")return null;
  if(type==="liquid"&&kind==="air")return null;
  if(/повірк/.test(service)&&/повірк/.test(body))score+=4;
  if(/калібрув/.test(service)&&/калібрув/.test(body))score+=4;
  if(/термометр/.test(title))score+=3;
  return score>0?{p,score}:null;
 }).filter(Boolean).sort((a,b)=>b.score-a.score);
 return scored.slice(0,5).map(x=>x.p);
}
function genericSearch(query){
 const words=norm(query).match(/[a-zа-яіїєґ0-9]+/g)||[];
 const stop=new Set(["мені","треба","потрібен","потрібні","купити","хочу","для","лабораторії","порадьте","знайти","прилад","обладнання"]);
 const terms=words.filter(w=>w.length>2&&!stop.has(w));
 return products.map(p=>{
  const title=norm(p.name),body=productText(p);
  let score=0;
  terms.forEach(w=>{
   if(title.includes(w))score+=6;
   else if(body.includes(w))score+=1;
  });
  return {p,score};
 }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,5).map(x=>x.p);
}
function start(category,original){
 reset();state.category=category;state.original=original;
 if(category==="scale"){
  state.stage="scale-capacity";
  message("Допоможу підібрати аналітичні ваги. Яка максимальна маса зважування вам потрібна?");
  choices(["120 г","200 г","220 г","Не знаю"]);
 }else if(category==="thermometer"){
  state.stage="thermo-purpose";
  message("Що саме потрібно вимірювати?");
  choices(["Повітря в холодильнику","Температуру продуктів","Рідини","Інше / не знаю"]);
 }else if(category==="ph"){
  state.stage="ph-purpose";
  message("Для яких зразків потрібен pH-метр?");
  choices(["Вода та розчини","Ґрунт","Харчові продукти","Не знаю"]);
 }else if(category==="hygrometer"){
  state.stage="hygro-purpose";
  message("Де плануєте вимірювати вологість?");
  choices(["У приміщенні","У холодильнику","На складі","Не знаю"]);
 }
}
function finish(){
 let found=[];
 if(state.category==="scale"){
  found=scaleSearch();
  message("Підбираю ваги за навантаженням і дискретністю, зазначеними в каталозі.");
 }else if(state.category==="thermometer"){
  found=thermometerSearch();
  message("Підібрала термометри за призначенням. Наявність повірки або калібрування потрібно підтвердити у менеджера.");
 }else{
  const category=state.category==="ph"?"pH-метр":"гігрометр";
  found=genericSearch(category+" "+state.answers[0]);
  message("Показую найближчі за описом товари. Уточніть характеристики в картці товару.");
 }
 if(found.length)message("Знайдено "+found.length+" відповідних товарів.");
 showProducts(found);
 reset();
}
function handle(text){
 text=String(text||"").trim();if(!text)return;
 message(text,"user");
 if(!loaded){message("Каталог ще завантажується.");return}
 if(/^(новий пошук|спочатку|скинути)$/i.test(text)){
  reset();message("Яке обладнання шукаєте?");
  choices(["Аналітичні ваги","pH-метр","Термометр","Гігрометр"]);return;
 }
 if(state.stage){
  state.answers.push(text);
  if(state.stage==="scale-capacity"){
   state.stage="scale-precision";
   message("Яка дискретність (крок зважування) потрібна?");
   choices(["0,0001 г","0,001 г","0,01 г","Не знаю"]);return;
  }
  if(state.stage==="thermo-purpose"){
   state.stage="thermo-service";
   message("Чи потрібна повірка або калібрування?");
   choices(["Потрібна повірка","Потрібне калібрування","Не потрібно","Не знаю"]);return;
  }
  if(state.stage==="ph-purpose"){
   state.stage="ph-format";
   message("Який тип приладу зручніший?");
   choices(["Портативний","Настільний","Не знаю"]);return;
  }
  if(state.stage==="hygro-purpose"){
   state.stage="hygro-service";
   message("Чи потрібна повірка?");
   choices(["Так","Ні","Не знаю"]);return;
  }
  finish();return;
 }
 if(/ваг|зважуван/i.test(text)){start("scale",text);return}
 if(/термометр|температур|холодильник/i.test(text)){start("thermometer",text);return}
 if(/ph|pH|рн-метр|рн метр/i.test(text)){start("ph",text);return}
 if(/гігрометр|вологіст/i.test(text)){start("hygrometer",text);return}
 const found=genericSearch(text);
 if(found.length){
  message("Знайшла "+found.length+" товарів у каталозі Лабзони. Це попередній пошук за назвою та описом.");
  showProducts(found);
 }else{
  message("За цим запитом товари не знайдено. Спробуйте уточнити назву обладнання.");
  choices(["Новий пошук"]);
 }
}
document.getElementById("form").addEventListener("submit",e=>{
 e.preventDefault();const text=input.value.trim();input.value="";handle(text);
});
async function load(){
 try{
  const response=await fetch(CATALOG_URL,{cache:"no-cache"});
  if(!response.ok)throw new Error("HTTP "+response.status);
  const data=await response.json();
  if(!Array.isArray(data.products))throw new Error("Invalid catalog");
  products=data.products.filter(p=>safeLink(p.url));
  loaded=true;
  message("Вітаємо у Лабзоні! Допоможемо підібрати лабораторне обладнання. Який прилад вам потрібен?");
  choices(["Аналітичні ваги","pH-метр","Термометр","Гігрометр"]);
 }catch(error){
  console.error(error);
  message("Не вдалося завантажити каталог. Спробуйте оновити сторінку.");
 }
}
load();
</script>
</body>
</html>
