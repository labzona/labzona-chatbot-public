
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лабзона | Онлайн-консультант</title>
<style>
:root {
  --red: #c91d2c;
  --pale: #fbe6e9;
  --line: #dddddd;
  --text: #252525;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f4f6f8;
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

.chat {
  max-width: 620px;
  height: min(760px, 96dvh);
  min-height: 420px;
  margin: 12px auto;
  background: white;
  border: 1px solid var(--line);
  border-radius: 17px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header {
  background: var(--red);
  color: white;
  padding: 19px 22px;
  font-weight: bold;
  font-size: 22px;
}

.sub {
  font-size: 12px;
  font-weight: normal;
  opacity: .9;
  margin-top: 4px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  scroll-behavior: smooth;
}

.message {
  padding: 13px 15px;
  margin-bottom: 13px;
  border-radius: 13px;
  line-height: 1.48;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.bot { background: #f0f0f0; }

.user {
  background: var(--pale);
  margin-left: 12%;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}

.choice {
  font: inherit;
  background: white;
  color: var(--red);
  border: 1px solid var(--red);
  border-radius: 9px;
  padding: 9px 12px;
  cursor: pointer;
}

.choice:hover { background: #fff3f4; }

.choice:focus-visible,
.send:focus-visible,
input:focus-visible {
  outline: 3px solid #2563eb;
  outline-offset: 2px;
}

.product {
  border: 1px solid var(--line);
  padding: 15px;
  margin-bottom: 12px;
  border-radius: 13px;
}

.product a {
  color: var(--red);
  font-size: 17px;
  font-weight: bold;
  line-height: 1.4;
}

.price {
  margin-top: 8px;
  font-weight: bold;
}

.details {
  color: #555;
  font-size: 14px;
  line-height: 1.5;
  margin-top: 9px;
  overflow-wrap: anywhere;
}

.status {
  font-size: 12px;
  color: #666;
  margin-top: 8px;
}

.form {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid #eee;
}

input {
  flex: 1;
  min-width: 0;
  border: 1px solid #ccc;
  border-radius: 9px;
  padding: 12px;
  font: inherit;
}

.send {
  border: 0;
  border-radius: 9px;
  background: var(--red);
  color: white;
  padding: 12px 16px;
  font: inherit;
  cursor: pointer;
}

.send:disabled {
  opacity: .6;
  cursor: wait;
}

@media (max-width: 650px) {
  .chat {
    height: 100dvh;
    max-width: none;
    min-height: 0;
    margin: 0;
    border-radius: 0;
  }
  .header { font-size: 19px; padding: 15px; }
  .messages { padding: 12px; }
  .form { padding: 9px; }
  .send { padding: 10px; }
}
</style>
</head>
<body>

<main class="chat">
  <header class="header">
    Лабзона | Консультант
    <div class="sub">
      Підбір обладнання з каталогу Лабзони
    </div>
  </header>

  <section class="messages" id="messages"
    aria-live="polite"></section>

  <form class="form" id="form">
    <input id="input"
      placeholder="Яке обладнання шукаєте?"
      autocomplete="off" required>
    <button class="send" id="send" type="submit">
      Надіслати
    </button>
  </form>
</main>

<script>
'use strict';

const CATALOG_URL = './catalog.json';
const PHONE = '0505956447';

const messages = document.getElementById('messages');
const input = document.getElementById('input');
const send = document.getElementById('send');

let products = [];
let loaded = false;

let state = {};

function reset() {
  state = {
    stage: 'start',
    category: null,
    material: null,
    use: null,
    capacity: null,
    readability: null,
    budget: null,
    query: ''
  };
}

reset();

function norm(s) {
  return String(s ?? '')
    .toLowerCase()
    .replace(/[’`]/g, "'")
    .replace(/\u00a0/g, ' ')
    .replace(/,/g, '.')
    .replace(/\s+/g, ' ')
    .trim();
}

function txt(p) {
  return norm([
    p.name,
    p.description,
    p.details
  ].filter(Boolean).join(' '));
}

function say(text, role = 'bot') {
  const div = document.createElement('div');
  div.className = 'message ' + role;
  div.textContent = text;
  messages.appendChild(div);
  scroll();
}

function scroll() {
  requestAnimationFrame(() => {
    messages.scrollTop = messages.scrollHeight;
  });
}

function buttons(options) {
  const box = document.createElement('div');
  box.className = 'actions';

  options.forEach(option => {
    const label = typeof option === 'string'
      ? option : option.label;

    const value = typeof option === 'string'
      ? option : option.value;

    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'choice';
    button.textContent = label;
    button.onclick = () => handle(label, value);
    box.appendChild(button);
  });

  messages.appendChild(box);
  scroll();
}

function validUrl(url) {
  try {
    const u = new URL(url);
    return u.protocol === 'https:' &&
      u.hostname === 'labzona.com.ua' &&
      u.pathname.startsWith('/shop/');
  } catch {
    return false;
  }
}

function price(p) {
  const raw = String(p.price ?? '')
    .replace(/\s/g, '')
    .replace(',', '.');

  const n = Number(raw);
  return Number.isFinite(n) && n > 0 ? n : null;
}

function money(n) {
  return n.toLocaleString('uk-UA') + ' грн';
}

function cleanDescription(s) {
  return String(s || '')
    .replace(/(?:\+?38\s*)?(?:\(?0\d{2}\)?[\s-]*)?\d{3}[\s-]*\d{2}[\s-]*\d{2}/g, '')
    .replace(/(?:дзвоніть|тел\.?|консультація|замовляй|купити в лабзоні)[^.!?]{0,80}[.!?]?/gi, '')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 210);
}

const categories = {
  scale: {
    title: 'Аналітичні ваги',
    name: /ваги|ваг|balance/i,
    exclude: /ювелірн|кухонн|торгов|чашк|гир[яі]|аксесуар|адаптер|платформ|тензодатчик/i
  },
  ph: {
    title: 'pH-метр',
    name: /ph[\s-]?метр|рн[\s-]?метр|ph\s*tester|кислотномір|ph\s*checker/i,
    exclude: /буфер|розчин|електрод|реактив|порошок|капсул/i
  },
  thermometer: {
    title: 'Термометр',
    name: /термометр|термощуп|temperature\s*(meter|probe)/i,
    exclude: /гігрометр|термогігрометр|чохол|батарейк|запасн/i
  },
  hygrometer: {
    title: 'Гігрометр',
    name: /гігрометр|термогігрометр|hygrometer/i,
    exclude: /запасн|чохол|батарейк|таблиц/i
  },
  moisture: {
    title: 'Вологомір',
    name: /вологомір|влагомер|moisture\s*meter/i,
    exclude: /чашк|ваг[ -]?вологомір|аксесуар|електрод\s+запасн|чохол/i
  }
};

function categoryFrom(s) {
  const t = norm(s);

  if (/вологомір|влагомер|moisture/.test(t))
    return 'moisture';

  if (/гігрометр|термогігрометр/.test(t))
    return 'hygrometer';

  if (/ph[ -]?метр|рн[ -]?метр|кислотномір|ph\s*tester/.test(t))
    return 'ph';

  if (/термометр|термощуп/.test(t))
    return 'thermometer';

  if (/ваг|зважуван|balance/.test(t))
    return 'scale';

  return null;
}

function materialFrom(s) {
  const t = norm(s);

  if (/зерн|насін|пшениц|кукурудз|ячмін|ріпак|соняшник/.test(t))
    return 'grain';

  if (/ґрунт|грунт|soil|теплиц|саджанц/.test(t))
    return 'soil';

  if (/сіно|солом|корм|hay/.test(t))
    return 'hay';

  if (/деревин|дерев|wood/.test(t))
    return 'wood';

  return null;
}

function useFrom(s) {
  const t = norm(s);

  if (/холодиль|морозиль|склад|зберіган/.test(t))
    return 'cold';

  if (/харч|насср|хассп|їж|продукт|кухн/.test(t))
    return 'food';

  if (/лаборатор|дослідж|аналіз/.test(t))
    return 'lab';

  if (/виробниц|промислов/.test(t))
    return 'industry';

  if (/господар|ферм|поле/.test(t))
    return 'farm';

  return null;
}

function parseBudget(s) {
  const t = norm(s).replace(/(\d)\s+(?=\d{3}(?:\D|$))/g, '$1');

  let m = t.match(
    /(?:до|бюджет|не\s+дорожче|максимум|в\s+межах|за)\s*(\d{3,7})/
  );

  if (!m) {
    m = t.match(/(\d{3,7})\s*(?:грн|₴)/);
  }

  return m ? Number(m[1]) : null;
}

function detectCapacity(s) {
  const t = norm(s);
  const m = t.match(
    /(?:навантаження|нгз|нпв|max|ваги)\s*[:= -]*\s*(\d+(?:\.\d+)?)\s*(?:г|g)(?![\p{L}])/u
  );
  return m ? Number(m[1]) : null;
}

function detectReadability(s) {
  const t = norm(s);
  const m = t.match(
    /(?:дискретність|крок|ціна поділки|readability)\s*[:= -]*\s*(0\.\d+)\s*(мг|mg|г|g)(?![\p{L}])/u
  );

  if (!m) return null;

  let value = Number(m[1]);
  if (m[2] === 'мг' || m[2] === 'mg') value /= 1000;

  return value;
}

function isMain(p, category) {
  const name = norm(p.name);
  const spec = categories[category];

  if (!spec) return false;
  if (!spec.name.test(name)) return false;
  if (spec.exclude.test(name)) return false;

  if (category === 'scale') {
    return /аналітичн|analytical|radwag\s+as|ohaus\s+ax|axis\s+ang/.test(name);
  }

  return true;
}

function materialMatch(p, material) {
  if (!material) return true;

  const name = norm(p.name);
  const text = txt(p);

  const patterns = {
    grain: /зерн|насін|пшениц|кукурудз|wille|wile|kett\s*pm|всп[- ]?100|he\s*lite/i,
    soil: /ґрунт|грунт|soil|мг[- ]?44/i,
    hay: /сіно|солом|корм|hay/i,
    wood: /деревин|дерев|wood/i
  };

  if (!patterns[material].test(text)) return false;

  if (material === 'grain' &&
      /ґрунт|грунт|soil/.test(name) &&
      !patterns.grain.test(name)) return false;

  if (material === 'soil' &&
      /зерн|насін/.test(name) &&
      !patterns.soil.test(name)) return false;

  return true;
}

function contextScore(p, use) {
  if (!use) return 0;

  const text = txt(p);

  const patterns = {
    cold: /холодиль|морозиль|низьк.{0,10}температур|зберіган/,
    food: /харч|продукт|haccp|насср|хассп|щуп/,
    lab: /лаборатор|аналітич|дослідж|проб/,
    industry: /виробниц|промислов|технічн/,
    farm: /ферм|господар|зерн|поле/
  };

  return patterns[use] && patterns[use].test(text) ? 3 : 0;
}

function specValues(p, type) {
  const text = txt(p);
  const name = norm(p.name);
  const result = [];

  const number = '(\\d+(?:\\.\\d+)?)';

  const capacityPatterns = [
    new RegExp(
      '(?:нгз|нпв|максимальн[^:;]{0,45}(?:навантаженн|зважуван|мас)|max(?:imum)?\\s*(?:capacity)?|межа\\s+зважування)\\s*[:=–-]?\\s*' +
      number + '\\s*(кг|kg|г|g)(?![\\p{L}])', 'gu'
    ),
    /(?:^|[ ,;—-])(\d+(?:\.\d+)?)\s*(г|g)\s*\/\s*0\.\d+\s*(?:г|g)/gu
  ];

  const precisionPatterns = [
    new RegExp(
      '(?:дискретніст\\p{L}*|ціна\\s+поділк\\p{L}*|крок\\s+зважування|readability|resolution|d\\s*=)\\s*[:=–-]?\\s*' +
      number + '\\s*(мг|mg|г|g)(?![\\p{L}])', 'gu'
    ),
    /\d+(?:\.\d+)?\s*(?:г|g)\s*\/\s*(0\.\d+)\s*(мг|mg|г|g)(?![\p{L}])/gu
  ];

  const patterns = type === 'capacity'
    ? capacityPatterns : precisionPatterns;

  for (const re of patterns) {
    for (const match of text.matchAll(re)) {
      let value = Number(match[1]);
      const unit = match[2];

      if (type === 'capacity' &&
          (unit === 'кг' || unit === 'kg')) value *= 1000;

      if (type === 'readability' &&
          (unit === 'мг' || unit === 'mg')) value /= 1000;

      if (value > 0) result.push(value);
    }
  }

  if (type === 'capacity') {
    const match = name.match(
      /(?:^|[ ,—-])(\d+(?:\.\d+)?)\s*(г|g)(?![\p{L}])/u
    );
    if (match) result.push(Number(match[1]));
  }

  if (type === 'readability') {
    const match = name.match(
      /(?:^|[ ,\/—-])(0\.\d+)\s*(мг|mg|г|g)(?![\p{L}])/u
    );
    if (match) {
      let value = Number(match[1]);
      if (match[2] === 'мг' || match[2] === 'mg')
        value /= 1000;
      result.push(value);
    }
  }

  return [...new Set(result)];
}

function near(a, b) {
  return Math.abs(a - b) < Math.max(1e-8, b * 0.00001);
}

function searchProducts() {
  let list = products.filter(p => validUrl(p.url));
  const category = state.category;

  if (category) {
    list = list.filter(p => isMain(p, category));
  }

  if (category === 'moisture' && state.material) {
    list = list.filter(p => materialMatch(p, state.material));
  }

  if (state.budget !== null && state.budget > 0) {
    list = list.filter(p => {
      const value = price(p);
      return value !== null && value <= state.budget;
    });
  }

  const confirmed = [];
  const unverified = [];

  for (const p of list) {
    let score = 0;
    const uncertainty = [];

    if (category === 'scale') {
      const capacities = specValues(p, 'capacity');
      const steps = specValues(p, 'readability');

      if (state.capacity !== null && state.capacity > 0) {
        if (capacities.length &&
            !capacities.some(v => near(v, state.capacity))) continue;

        if (!capacities.length) {
          uncertainty.push('максимальне навантаження');
        } else {
          score += 8;
        }
      }

      if (state.readability !== null &&
          state.readability > 0) {
        if (steps.length &&
            !steps.some(v => near(v, state.readability))) continue;

        if (!steps.length) {
          uncertainty.push('дискретність');
        } else {
          score += 8;
        }
      }
    }

    if (category === 'moisture' && state.material) {
      const name = norm(p.name);
      const patterns = {
        grain: /зерн|насін|wille|wile|kett\s*pm|всп[- ]?100|he\s*lite/,
        soil: /ґрунт|грунт|soil|мг[- ]?44/,
        hay: /сіно|солом|hay/,
        wood: /дерев|wood/
      };

      score += patterns[state.material].test(name) ? 8 : 1;
    }

    score += contextScore(p, state.use);

    if (state.budget > 0 && price(p) !== null) {
      score += Math.max(0, 2 - price(p) / state.budget);
    }

    const item = { p, score, uncertainty };

    if (uncertainty.length) {
      unverified.push(item);
    } else {
      confirmed.push(item);
    }
  }

  const sorter = (a, b) =>
    b.score - a.score ||
    (price(a.p) ?? Infinity) - (price(b.p) ?? Infinity);

  confirmed.sort(sorter);
  unverified.sort(sorter);

  return { confirmed, unverified };
}

function showCard(entry) {
  const p = entry.p;

  const card = document.createElement('article');
  card.className = 'product';

  const link = document.createElement('a');
  link.href = p.url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  link.textContent = p.name;
  card.appendChild(link);

  const priceDiv = document.createElement('div');
  priceDiv.className = 'price';
  priceDiv.textContent = 'Ціна: ' +
    (price(p) === null
      ? 'уточніть у менеджера'
      : money(price(p)));

  card.appendChild(priceDiv);

  const description = cleanDescription(p.description);

  if (description) {
    const desc = document.createElement('div');
    desc.className = 'details';
    desc.textContent = description;
    card.appendChild(desc);
  }

  const status = document.createElement('div');
  status.className = 'status';

  status.textContent = entry.uncertainty.length
    ? 'Потрібно уточнити: ' +
      entry.uncertainty.join(', ') + '.'
    : 'Попередній підбір за каталогом. Перевірте характеристики перед замовленням.';

  card.appendChild(status);
  messages.appendChild(card);
}

function showResults() {
  state.stage = 'done';

  const { confirmed, unverified } = searchProducts();

  if (!confirmed.length && !unverified.length) {
    say(
      'Не знайшла відповідних приладів у каталозі за цими умовами. ' +
      'Можна змінити бюджет або уточнити запит у менеджера.'
    );

    buttons(['Новий пошук', "Зв'язатися з менеджером"]);
    return;
  }

  if (confirmed.length) {
    say(
      'Знайдено ' + confirmed.length +
      ' відповідних товарів за доступними даними каталогу.'
    );

    confirmed.slice(0, 5).forEach(showCard);
  }

  if (unverified.length) {
    say(confirmed.length
      ? 'Також є моделі, для яких потрібно уточнити характеристики:'
      : 'Є можливі варіанти, але не всі характеристики підтверджені в каталозі:'
    );

    unverified.slice(0, 3).forEach(showCard);
  }

  buttons(['Новий пошук', "Зв'язатися з менеджером"]);
  scroll();
}

function askNext() {
  if (state.category === 'moisture' && !state.material) {
    state.stage = 'material';
    say('Вологість якого матеріалу потрібно вимірювати?');

    buttons([
      { label: 'Зерно', value: 'grain' },
      { label: 'Ґрунт', value: 'soil' },
      { label: 'Сіно або солома', value: 'hay' },
      { label: 'Деревина', value: 'wood' },
      { label: 'Інший матеріал', value: 'other' }
    ]);
    return;
  }

  if (state.category === 'scale' &&
      state.capacity === null) {
    state.stage = 'capacity';
    say('Яке максимальне навантаження потрібне?');
    buttons(['120 г', '200 г', '220 г', 'Не знаю']);
    return;
  }

  if (state.category === 'scale' &&
      state.readability === null) {
    state.stage = 'readability';
    say('Яка дискретність (найменший крок зважування) потрібна?');
    buttons(['0,0001 г', '0,001 г', '0,01 г', 'Не знаю']);
    return;
  }

  if (['thermometer', 'hygrometer', 'ph']
      .includes(state.category) && !state.use) {
    state.stage = 'use';
    say('Для яких умов або завдань потрібен прилад?');

    buttons(state.category === 'thermometer'
      ? [
          'Для холодильника',
          'Для харчових продуктів',
          'Для лабораторії',
          'Для виробництва',
          'Не знаю'
        ]
      : [
          'Для лабораторії',
          'Для виробництва',
          'Для господарства',
          'Не знаю'
        ]
    );
    return;
  }

  if (state.budget === null) {
    state.stage = 'budget';

    say(
      'Який орієнтовний бюджет? ' +
      'Можна написати суму, наприклад «до 15000 грн».'
    );

    buttons([
      'До 1000 грн',
      'До 5000 грн',
      'До 10000 грн',
      'До 15000 грн',
      'Без обмежень'
    ]);
    return;
  }

  showResults();
}

function parseFreeQuery(s) {
  state.query = s;
  state.category = categoryFrom(s);
  state.material = materialFrom(s);
  state.use = useFrom(s);
  state.budget = parseBudget(s);

  if (state.category === 'scale') {
    state.capacity = detectCapacity(s);
    state.readability = detectReadability(s);
  }

  if (!state.category) {
    const words = norm(s)
      .split(/\s+/)
      .filter(w => w.length > 3);

    const matches = products
      .filter(p => validUrl(p.url))
      .map(p => {
        const name = norm(p.name);
        const score = words.reduce(
          (sum, w) => sum + (name.includes(w) ? 3 : 0), 0
        );

        return { p, score, uncertainty: [] };
      })
      .filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 5);

    if (matches.length) {
      say(
        'Знайшла товари за назвою. ' +
        'Для точного підбору уточніть призначення та характеристики.'
      );

      matches.forEach(showCard);
    } else {
      say(
        'Не вдалося визначити тип обладнання. ' +
        'Спробуйте вказати назву приладу або виберіть категорію.'
      );
    }

    buttons(['Новий пошук', "Зв'язатися з менеджером"]);
    state.stage = 'done';
    return;
  }

  askNext();
}

function contactManager() {
  say(
    'Менеджер Лабзони допоможе уточнити характеристики, ' +
    'наявність і умови замовлення.\nТелефон: ' + PHONE
  );

  const link = document.createElement('a');
  link.href = 'tel:+380505956447';
  link.textContent = 'Зателефонувати менеджеру';
  link.style.color = '#c91d2c';
  link.style.display = 'block';
  link.style.marginBottom = '15px';

  messages.appendChild(link);
  scroll();
}

function handle(label, value = label) {
  if (!loaded) {
    say('Каталог ще завантажується. Спробуйте за кілька секунд.');
    return;
  }

  const s = String(label).trim();
  if (!s) return;

  say(s, 'user');

  if (/новий пошук|спочатку|скинути/i.test(s)) {
    reset();

    say(
      'Що потрібно підібрати? ' +
      'Можете вибрати категорію або описати потребу своїми словами.'
    );

    buttons([
      'Аналітичні ваги',
      'pH-метр',
      'Термометр',
      'Гігрометр',
      'Вологомір'
    ]);
    return;
  }

  if (/зв.?язатися з менеджером/i.test(s)) {
    contactManager();
    return;
  }

  if (state.stage === 'material') {
    if (value === 'other') {
      state.stage = 'otherMaterial';
      say('Напишіть, який матеріал потрібно перевіряти.');
      return;
    }

    state.material = value;
    askNext();
    return;
  }

  if (state.stage === 'otherMaterial') {
    state.material = materialFrom(s);

    if (!state.material) {
      say(
        'Для цього матеріалу немає окремого перевіреного фільтра. ' +
        'Рекомендую уточнити сумісність приладу в менеджера.'
      );

      buttons(['Новий пошук', "Зв'язатися з менеджером"]);
      state.stage = 'done';
      return;
    }

    askNext();
    return;
  }

  if (state.stage === 'capacity') {
    if (/не знаю/i.test(s)) {
      state.capacity = 0;
    } else {
      state.capacity = detectCapacity('навантаження ' + s);
    }

    if (state.capacity === null) {
      say('Напишіть навантаження у грамах, наприклад 220 г.');
      return;
    }

    askNext();
    return;
  }

  if (state.stage === 'readability') {
    if (/не знаю/i.test(s)) {
      state.readability = 0;
    } else {
      state.readability = detectReadability('дискретність ' + s);
    }

    if (state.readability === null) {
      say('Напишіть значення, наприклад 0,0001 г або 0,1 мг.');
      return;
    }

    askNext();
    return;
  }

  if (state.stage === 'use') {
    state.use = /не знаю/i.test(s)
      ? 'unknown'
      : useFrom(s) || 'unknown';

    askNext();
    return;
  }

  if (state.stage === 'budget') {
    if (/без обмежень/i.test(s)) {
      state.budget = 0;
    } else {
      const budget = parseBudget(s);

      if (budget === null) {
        say(
          'Напишіть суму, наприклад «до 10000 грн», ' +
          'або виберіть «Без обмежень».'
        );
        return;
      }

      state.budget = budget;
    }

    showResults();
    return;
  }

  reset();
  parseFreeQuery(s);
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();

  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  handle(text);
});

async function init() {
  try {
    send.disabled = true;

    const response = await fetch(
      CATALOG_URL + '?t=' + Date.now(),
      { cache: 'no-store' }
    );

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    const data = await response.json();

    if (!Array.isArray(data.products)) {
      throw new Error('Неправильний формат каталогу');
    }

    products = data.products.filter(p =>
      p &&
      typeof p.name === 'string' &&
      validUrl(p.url)
    );

    loaded = true;

    say(
      'Вітаємо у Лабзоні! ' +
      'Допоможемо підібрати лабораторне обладнання. ' +
      'Який прилад вам потрібен?'
    );

    buttons([
      'Аналітичні ваги',
      'pH-метр',
      'Термометр',
      'Гігрометр',
      'Вологомір'
    ]);

  } catch (error) {
    console.error('Catalog:', error);

    say(
      'Зараз не вдалося завантажити каталог товарів. ' +
      'Спробуйте оновити сторінку або зв’яжіться з менеджером: ' +
      PHONE
    );
  } finally {
    send.disabled = false;
  }
}

init();
</script>
